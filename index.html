<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Lapis</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="kiriko/icon.svg">
<style>
  :root { --ink: #f3f1ff; --dim: #9d98c8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: #0d0b22; color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif; }
  body { min-height: 100vh; background: radial-gradient(120% 80% at 50% 0%, #1a1740, #0d0b22 70%);
    padding: calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 40px); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: .24em; }
  p.lead { margin: 0 0 32px; color: var(--dim); font-size: 14px; }
  .list { display: grid; gap: 14px; }
  a.card { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 20px; text-decoration: none; color: inherit;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  a.card:active { background: rgba(255,255,255,.14); }
  a.card img { width: 64px; height: 64px; border-radius: 15px; flex: none; }
  .t { font-size: 20px; font-weight: 800; letter-spacing: .08em; }
  .d { font-size: 13px; color: var(--dim); margin-top: 2px; }
</style>
</head>
<body>
<main>
  <h1>LAPIS</h1>
  <p class="lead">自分用のミニゲーム置き場</p>
  <div class="list">
    <a class="card" href="kiriko/">
      <img src="kiriko/apple-touch-icon.png" alt="">
      <div><div class="t">KIRIKO</div><div class="d">ブロックパズル</div></div>
    </a>
    <a class="card" href="numberun/">
      <img src="numberun/apple-touch-icon.png" alt="">
      <div><div class="t">numberun</div><div class="d">～ナンバ走り～ けいさんゲート</div></div>
    </a>
    <a class="card" href="numplace/">
      <img src="numplace/apple-touch-icon.png" alt="">
      <div><div class="t">numplace</div><div class="d">～ナンプレ～ 数字パズル</div></div>
    </a>
    <a class="card" href="gemdig/">
      <img src="gemdig/apple-touch-icon.png" alt="">
      <div><div class="t">gemdig</div><div class="d">～ジェムディグ～ 宝さがしパズル</div></div>
    </a>
  </div>
</main>
</body>
</html>
