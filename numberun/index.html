<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>numberun～ナンバ走り～</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">
<style>
:root { --navy: #12305a; --sky0: #4cc3ff; --sky1: #d4f3ff; --accent: #ffb02e; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: var(--sky0); color: var(--navy);
  font-family: "Hiragino Maru Gothic ProN", -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; -webkit-text-size-adjust: 100%;
}
body { position: fixed; inset: 0; background: linear-gradient(180deg, var(--sky0), var(--sky1)); }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#sab { position: fixed; left: 0; bottom: 0; height: env(safe-area-inset-bottom); width: 1px; visibility: hidden; pointer-events: none; }

#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 4px calc(env(safe-area-inset-left) + 12px);
  display: flex; align-items: center; gap: 8px;
}
#lives { font-size: 26px; letter-spacing: 2px; color: #ff4f7b; text-shadow: 0 2px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff; }
#stageBadge { padding: 8px 16px; border-radius: 99px; background: #fff; font-weight: 800; font-size: 18px; box-shadow: 0 3px 0 rgba(18,48,90,.25); }
.spacer { flex: 1; }
.icon-btn {
  pointer-events: auto; min-width: 46px; height: 46px; border-radius: 16px; border: 0; background: #fff; color: var(--navy);
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 10px;
  font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 rgba(18,48,90,.25); touch-action: manipulation;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(18,48,90,.25); }
.icon-btn:disabled { opacity: .4; }
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
#btnSound.off .wave { display: none; }
#btnSound:not(.off) .cross { display: none; }

.btn {
  appearance: none; border: 0; width: min(300px, 80vw); padding: 17px 0; margin-top: 12px; border-radius: 20px;
  font-family: inherit; font-size: 20px; font-weight: 800; color: #fff; letter-spacing: .06em;
  background: linear-gradient(180deg, #ffbf4d, #ff9a1f); text-shadow: 0 2px 0 rgba(0,0,0,.18);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 6px 0 #c76f00, 0 12px 20px rgba(0,0,0,.25);
  touch-action: manipulation; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), 0 2px 0 #c76f00, 0 6px 10px rgba(0,0,0,.25); }
.btn.sec { background: linear-gradient(180deg, #5aa8ff, #2e7be6); box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 6px 0 #1a54a8, 0 12px 20px rgba(0,0,0,.25); }
.btn.sec:active { box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 2px 0 #1a54a8, 0 6px 10px rgba(0,0,0,.25); }
.btn[hidden] { display: none; }

.screen {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);
  background: linear-gradient(180deg, rgba(76,195,255,.97), rgba(212,243,255,.97)); transition: opacity .25s;
  overflow-y: auto; touch-action: pan-y;
}
.screen > :first-child { margin-top: auto; }
.screen > :last-child { margin-bottom: auto; }
.screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
.screen.dim { background: rgba(18, 48, 90, .92); color: #fff; }
.logo2 { display: flex; flex-direction: column; align-items: center; margin-bottom: 6px; }
.gatechips { display: flex; margin-bottom: 4px; }
.chip { display: inline-block; padding: 6px 16px; border-radius: 14px; font-weight: 900; font-size: 24px; color: #fff; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.chip.b { background: #2e9bff; transform: rotate(-8deg); }
.chip.o { background: #ffae2a; transform: rotate(7deg); margin-left: 12px; }
.word { font-size: 56px; line-height: 1.1; font-weight: 900; font-style: italic; color: #fff; transform: skewX(-6deg);
  -webkit-text-stroke: 7px #12305a; paint-order: stroke fill; text-shadow: 0 6px 0 #12305a, 0 12px 16px rgba(0,0,0,.25); }
.ribbon { margin-top: 12px; padding: 4px 20px; border-radius: 99px; background: #ff7a1a; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: .15em; box-shadow: 0 3px 0 #c24f00; }
.runners { margin: 6px 0 2px; display: flex; gap: 10px; align-items: flex-end; }
.runners span { display: inline-block; animation: hop .55s ease-in-out infinite; }
@keyframes hop { 50% { transform: translateY(-12px); } }
.group { width: min(340px, 90vw); margin-top: 10px; }
.group .lbl { font-size: 13px; font-weight: 800; margin: 0 4px 6px; opacity: .8; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1 1 40%; appearance: none; border: 3px solid transparent; border-radius: 16px; padding: 8px 4px; font-family: inherit; font-size: 16px; font-weight: 800;
  background: #fff; color: var(--navy); box-shadow: 0 3px 0 rgba(18,48,90,.25); touch-action: manipulation; }
.seg button small { display: block; font-size: 11px; font-weight: 700; opacity: .7; margin-top: 2px; }
.seg button.on { border-color: var(--accent); background: #fff6e0; }
.best { margin: 14px 0 6px; font-weight: 800; font-size: 15px; }
.rule { margin: 0 0 4px; font-size: 13px; font-weight: 800; color: #12305a; opacity: .8; }
.best b { font-size: 24px; color: #e07d00; margin: 0 4px; }
h2 { margin: 0 0 8px; font-size: 28px; text-align: center; }
.sumline { font-size: 22px; font-weight: 800; margin: 6px 0 10px; text-align: center; }
.review { width: min(360px, 92vw); max-height: 34vh; overflow-y: auto; margin: 6px 0 8px; font-size: 14px; line-height: 1.5; text-align: left;
  background: rgba(255,255,255,.12); border-radius: 14px; padding: 10px 12px; -webkit-overflow-scrolling: touch; }
.review:empty { display: none; }
.review .item { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.2); }
.review .item:last-child { border-bottom: 0; }
.review .ok { color: #8cf5a8; font-weight: 800; }
.review .ng { color: #ffd27a; font-weight: 800; }
@media (max-height: 760px) { .word { font-size: 46px; } .chip { font-size: 20px; padding: 4px 12px; } .runners svg { width: 44px; height: 44px; } .runners span:nth-child(2) svg { width: 56px; height: 56px; } .group { margin-top: 6px; } .btn { padding: 14px 0; } }
#tapSplash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); color: #fff; font-weight: 900; font-size: 24px; letter-spacing: .06em; touch-action: manipulation; }
#tapSplash .msg { padding: 16px 28px; border-radius: 99px; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.5); animation: splashPulse 1.2s ease-in-out infinite; }
@keyframes splashPulse { 50% { transform: scale(1.07); } }
#tapSplash.hidden { opacity: 0; pointer-events: none; transition: opacity .25s; }

.title-snd { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; margin: 0 !important; height: 46px; padding: 0 14px 0 12px; border-radius: 23px; border: 0;
  background: rgba(255,255,255,.55); color: #12305a; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 800; font-size: 14px; touch-action: manipulation; z-index: 3; }
.title-snd svg { width: 22px; height: 22px; fill: currentColor; }
.title-snd .lbl::after { content: 'おとON'; }
.title-snd.off .lbl::after { content: 'おとOFF'; }
.title-snd.off .wave { display: none; } .title-snd:not(.off) .cross { display: none; }
</style>
</head>
<body>
<div id="tapSplash"><div class="msg">♪ タップして はじめる</div></div>
<canvas id="c"></canvas>
<div id="sab"></div>

<div id="hud">
  <div id="stageBadge">ステージ 1</div>
  <div id="lives" aria-label="のこりのミス"></div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnHint" aria-label="ヒント">
    <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zM9 20h6v1.5a.5.5 0 0 1-.5.5h-5a.5.5 0 0 1-.5-.5V20z"/></svg>
    <span id="hintCount">3</span>
  </button>
  <button class="icon-btn" id="btnSound" aria-label="サウンド">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2l1.4-1.4zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10l1.4-1.4z"/><path class="cross" d="M15 9.4 16.4 8 18.5 10.1 20.6 8 22 9.4 19.9 11.5 22 13.6 20.6 15 18.5 12.9 16.4 15 15 13.6 17.1 11.5z"/></svg>
  </button>
  <button class="icon-btn" id="btnPause" aria-label="一時停止">
    <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
  </button>
</div>

<div class="screen" id="scTitle">
  <button id="btnSoundTitle" class="title-snd" aria-label="サウンド"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2l1.4-1.4zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10l1.4-1.4z"/><path class="cross" d="M15 9.4 16.4 8 18.5 10.1 20.6 8 22 9.4 19.9 11.5 22 13.6 20.6 15 18.5 12.9 16.4 15 15 13.6 17.1 11.5z"/></svg><span class="lbl"></span></button>
  <div class="logo2">
    <div class="gatechips"><span class="chip b">+5</span><span class="chip o">×2</span></div>
    <div class="word">numberun</div>
    <div class="ribbon">～ ナンバ走り ～</div>
    <div class="runners" id="runners"></div>
  </div>
  <div class="group"><div class="lbl">がくねん</div>
    <div class="seg" id="segLevel">
      <button data-v="g2">2年生<small>たし算・2のだん</small></button>
      <button data-v="g3">3年生<small>たし・ひき・九九・わり</small></button>
      <button data-v="g4">4年生<small>少し大きな数</small></button>
      <button data-v="ch">チャレンジ<small>大きな数</small></button>
    </div>
  </div>
  <div class="group"><div class="lbl">あそびかた</div>
    <div class="seg" id="segMode">
      <button data-v="think">じっくり<small>考えてから選ぶ</small></button>
      <button data-v="run">ラン<small>走りながら動かす</small></button>
    </div>
  </div>
  <div class="best" id="titleBest"></div>
  <div class="rule">♥ ミスは1かいまで（1かい: ひきわけ、2かい: まけ）</div>
  <button class="btn" id="btnStart">スタート</button>
</div>

<div class="screen hidden dim" id="scPause">
  <h2>ひとやすみ</h2>
  <button class="btn" id="btnResume">つづける</button>
  <button class="btn sec" id="btnToTitle">タイトルへ</button>
</div>

<div class="screen hidden dim" id="scResult">
  <div id="resMascot"></div>
  <h2 id="resTitle"></h2>
  <div class="sumline" id="resSum"></div>
  <div class="review" id="resReview"></div>
  <button class="btn" id="btnNext"></button>
  <button class="btn sec" id="btnResultTitle">タイトルへ</button>
</div>

<script>
'use strict';
/* =====================================================================
 * 調整用定数（ここをいじれば、難しさや遊び心地が変わる）
 * ===================================================================== */
const CONFIG = {
  // 学年ごとの設定
  LEVELS: {
    g2: { label: '2年生', start: 10, cap: 200,
      add: [1, 10], sub: [1, 8], mul: [2, 3, 4, 5], div: [2, 3],
      typeWeight: { add: 3, sub: 2, mul: 2, div: 1 },
      unlock: { sub: 2, div: 4 },   // このステージから、ひき算 / わり算が出はじめる
      mulStart: 1,                  // 最初に出るかけ算は「2のだん」だけ。ステージごとに1種類ずつ増える
      enemyRatio: 0.70,             // てきの人数の割合（この学年だけ別の値。小さいほど勝ちやすい）
      comfort: 30,                  // 人数がこれを超えると、「減る方を選ぶ」組が出やすくなる（増えすぎ防止）
      minDiff: 0.25, maxDiff: 0.90 },   // 2つのゲートの結果の差（大きい方に対する割合）
    g3: { label: '3年生', start: 10, cap: 300,
      add: [1, 20], sub: [1, 15], mul: [2, 3, 4, 5], div: [2, 3],
      typeWeight: { add: 3, sub: 2, mul: 2, div: 1 },
      unlock: { sub: 1, div: 1 }, mulStart: 99,   // 最初から、ひき算・わり算・かけ算がぜんぶ出る
      enemyRatio: 0.85,
      comfort: 40,
      minDiff: 0.20, maxDiff: 0.70 },
    g4: { label: '4年生', start: 20, cap: 999,
      add: [5, 40], sub: [3, 30], mul: [2, 3, 4, 5, 6, 7, 8, 9], div: [2, 3, 4, 5, 6, 8, 9],
      typeWeight: { add: 3, sub: 2, mul: 3, div: 2 },
      unlock: { sub: 1, div: 2 }, mulStart: 3, enemyRatio: 0.80,
      comfort: 150,
      minDiff: 0.10, maxDiff: 0.50 },
    ch: { label: 'チャレンジ', start: 50, cap: 9999,
      add: [10, 300], sub: [10, 200], mul: [2, 3, 4, 5, 6, 7, 8, 9, 11, 12], div: [2, 3, 4, 5, 6, 7, 8, 9, 12],
      typeWeight: { add: 3, sub: 2, mul: 3, div: 3 },
      unlock: { sub: 1, div: 1 }, mulStart: 99, enemyRatio: 0.85,
      comfort: 800,
      minDiff: 0.04, maxDiff: 0.30 },
  },

  STAGE_START_GROWTH: 0.25,   // ステージが進むごとに、はじめの人数を「最初の人数 × この割合」ずつ増やす
  ADD_SCALE: 0.6,        // 数が大きいとき、たす・ひく数の上限を「今の数 × この値」まで広げる
  BIG_UP_REJECT: 0.85,    // 人数が comfort を超えているとき、「大きく増える」組を、この確率で作り直す
  BOTH_DOWN_REJECT: 0.9,  // 「両方とも人数が減る」組を、この確率で作り直す
  OBVIOUS_REJECT: 0.7,   // 「どちらかが減って、どちらかが増える」明らかな組を、この確率で作り直す

  // ステージ
  STAGE: { PAIRS_BASE: 3, PAIRS_PER_STAGE: 1, PAIRS_MAX: 7 },   // 1ステージのゲートの数
  ENEMY_RATIO: 0.85,   // てきの人数 = 「毎回いちばん多い方を選んだ人数」 × この値（小さいほど勝ちやすい）
  ENEMY_MIN: 3,
  HINTS: { g2: 3, g3: 3, g4: 3, ch: 1 },   // ヒントの回数（1回のゲームあたり）

  // 速さ（画面の高さに対する、1秒あたりの移動量）
  SPEED: { think: 0.60, run: 0.30 },
  REVEAL_MS: { think: 1500, run: 650 },   // 結果を見せる時間

  // サウンド
  SOUND: {
    TAP_SPLASH: true,   // 起動時に「タップしてはじめる」を出す（iPhoneは最初のタップまで音が出せないため。falseで無効）
    SFX_VOLUME: 0.6,         // 効果音の音量（1で最大。BGMとは別に調整できる）
    BGM_VOLUME: 0.8,
    BGM_MIX: 'A',            // 'A' = 前のミックス（低音が太い） / 'B' = 中高音を厚くしたミックス
    BGM_BPM: 138,            // BGMのテンポ（速いほど急かされる）
    BGM_BPM_PER_STAGE: 2,    // ステージが進むごとに速くなる量（0で一定）
    BGM_BPM_MAX_UP: 14,      // 速くなる量の上限
  },
  VIBRATE: true,
};

/* ---------- 共通 ---------- */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
const easeOutCubic = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
const easeInOut = t => { t = Math.min(1, Math.max(0, t)); return t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOutBack = t => { const c = 1.70158; t = Math.min(1, Math.max(0, t)) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
function vibrate(p) { if (CONFIG.VIBRATE && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { /* ignore */ } } }

/* ---------- ゲートの計算 ---------- */
const startFor = (levelKey, stage) => Math.round(CONFIG.LEVELS[levelKey].start * (1 + CONFIG.STAGE_START_GROWTH * (stage - 1)));
const OP_LABEL = { add: '+', sub: '−', mul: '×', div: '÷' };
const gateText = g => OP_LABEL[g.op] + g.v;
function applyGate(n, g) {
  switch (g.op) {
    case 'add': return n + g.v;
    case 'sub': return Math.max(1, n - g.v);
    case 'mul': return n * g.v;
    case 'div': return Math.max(1, Math.floor(n / g.v));
  }
}
function makeGate(n, L, type, stage) {
  switch (type) {
    case 'add': { const hi = Math.max(L.add[1], Math.round(n * CONFIG.ADD_SCALE)); return { op: 'add', v: rnd(L.add[0], hi) }; }
    case 'sub': {
      const hi = Math.min(Math.max(L.sub[1], Math.round(n * CONFIG.ADD_SCALE)), n - 2);
      if (hi < L.sub[0]) return null;
      return { op: 'sub', v: rnd(L.sub[0], hi) };
    }
    case 'mul': {
      const ks = L.mul.slice(0, L.mulStart + stage - 1).filter(k => n * k <= L.cap);
      return ks.length ? { op: 'mul', v: pick(ks) } : null;
    }
    case 'div': {
      const ks = L.div.filter(k => n % k === 0 && n / k >= 2);
      return ks.length ? { op: 'div', v: pick(ks) } : null;
    }
  }
  return null;
}
function pickType(L, stage) {
  const w = {}; let total = 0;
  for (const k in L.typeWeight) { w[k] = (L.unlock[k] || 1) <= stage ? L.typeWeight[k] : 0; total += w[k]; }
  let x = Math.random() * total;
  for (const k in w) { x -= w[k]; if (x <= 0 && w[k] > 0) return k; }
  return 'add';
}
// 今の人数 n に対する、左右のゲートの組を作る
function makePair(n, levelKey, stage = 99) {
  const L = CONFIG.LEVELS[levelKey];
  for (let t = 0; t < 120; t++) {
    const a = makeGate(n, L, pickType(L, stage), stage), b = makeGate(n, L, pickType(L, stage), stage);
    if (!a || !b) continue;
    if (a.op === b.op && a.v === b.v) continue;
    const ra = applyGate(n, a), rb = applyGate(n, b);
    if (ra > L.cap || rb > L.cap) continue;
    const hi = Math.max(ra, rb), lo = Math.min(ra, rb), diff = (hi - lo) / hi;
    if (diff < L.minDiff || diff > L.maxDiff) continue;
    const big = n > L.comfort;
    if (big) { if (hi > n * 1.15 && Math.random() < CONFIG.BIG_UP_REJECT) continue; }     // 多すぎるときは、増える組を出しにくくする
    else if (ra < n && rb < n && Math.random() < CONFIG.BOTH_DOWN_REJECT) continue;
    if ((ra < n) !== (rb < n) && ra !== n && rb !== n && Math.random() < CONFIG.OBVIOUS_REJECT) continue;
    return finishPair(n, a, b, ra, rb);
  }
  const a = { op: 'add', v: 5 }, b = { op: 'add', v: 9 };      // 見つからないときの保険
  return finishPair(n, a, b, applyGate(n, a), applyGate(n, b));
}
function finishPair(n, a, b, ra, rb) {
  const swap = Math.random() < 0.5;
  const g = swap ? [{ ...b, res: rb }, { ...a, res: ra }] : [{ ...a, res: ra }, { ...b, res: rb }];
  return { gates: g, best: g[0].res > g[1].res ? 0 : 1, nBefore: n };
}

/* ---------- サウンド ---------- */
const Sound = {
  ctx: null, master: null, bgmGain: null, primed: false,
  muted: lsGet('numberun.mute') === '1',
  unlock() {
    try {
      if (!this.ctx) {

        for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2.6); }

  },
  tone(freq, dur, type = 'sine', vol = 0.2, slideTo = 0, delay = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  select() { this.tone(700, 0.08, 'sine', 0.3, 900); },
  ready() { return !(this.muted || !this.ctx || this.ctx.state !== 'running'); },
  // ベルのような音（FM合成）
  bell(freq, delay, vol, dur) {
    if (!this.ready()) return;
    const c = this.ctx, t = c.currentTime + delay;
    const car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();

    mg.gain.setValueAtTime(freq * 1.5, t); mg.gain.exponentialRampToValueAtTime(1, t + dur * 0.6);
    mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  // 人数がふえたときの音。level が大きい（たくさん増えた）ほど、音が多くなる
  up(level) {
    const steps = [0, 4, 7, 12, 16, 19, 24, 28];
    const n = Math.min(steps.length, 3 + level * 2);
    for (let i = 0; i < n; i++) this.bell(784 * Math.pow(2, steps[i] / 12), i * 0.05, 0.22, 0.55);
    this.bell(784 * 4, n * 0.05, 0.1, 0.7);
    this.tone(1568, 0.06, 'sine', 0.05, 2200);
  },
  ok() { this.bell(988, 0, 0.14, 0.4); this.bell(1319, 0.07, 0.12, 0.5); },
  good() { this.up(0); },
  bad() { this.tone(300, 0.28, 'triangle', 0.18, 170); },
  hint() { this.tone(880, 0.1, 'sine', 0.12); this.tone(1175, 0.14, 'sine', 0.12, 0, 0.08); },
  hit() { this.tone(180, 0.1, 'square', 0.06, 90); },
  noise() {
    if (!this._noise) {
      const len = this.ctx.sampleRate, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this._noise = b;
    }
    return this._noise;
  },
  // 人の声っぽい音（のこぎり波を、母音の響き＝フォルマントで加工する）
  voice(f0, formants, dur, vol, delay, glide, att = 0.28, hold = 0) {
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * glide, t + dur);
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 5 + Math.random() * 1.5; lg.gain.value = f0 * 0.018;
    lfo.connect(lg); lg.connect(o.frequency);

    const a = Math.min(att, 0.9) * dur;
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(vol, t + a);
    if (hold) out.gain.setValueAtTime(vol, t + dur * hold);                 // 声を伸ばしたまま保つ
    out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    formants.forEach(([fr, q, gn]) => {
      const b = c.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fr * (0.96 + Math.random() * 0.08); b.Q.value = q;
      const g = c.createGain(); g.gain.value = gn; o.connect(b); b.connect(g); g.connect(out);
    });
    out.connect(this.sfx); out.connect(this.revSend);
    o.start(t); lfo.start(t); o.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05);

  burstNoise(delay, dur, freq, q, vol) {
    const c = this.ctx, t = c.currentTime + delay;
    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;

  },
  swell(delay, dur, freq, q, vol) {     // 群衆の「ざわーっ」というノイズ
    const c = this.ctx, t = c.currentTime + delay;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise(); src.loop = true; f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;

  },
  // 歓声: 拍手 + 「ヒューッ」という笛 + クラッカー + きらきら（合成の声は怖く聞こえるので使わない）
  cheer() {
    if (!this.ready()) return;
    this.burstNoise(0, 0.12, 3000, 0.6, 0.5);                            // 「パンッ」
    this.tone(1200, 0.45, 'sine', 0.16, 2600, 0.04);                      // 「ヒューッ」
    [1568, 2093, 2637, 3136].forEach((f, i) => this.bell(f, 0.1 + i * 0.07, 0.12, 0.5));
    for (let i = 0; i < 55; i++) this.burstNoise(0.12 + Math.random() * 1.1, 0.035 + Math.random() * 0.03, 2500 + Math.random() * 3500, 0.7, 0.2 + Math.random() * 0.14);   // はくしゅ
  },
  // ブーイング「ぶーーーーー…」。len を大きくするほど長くなる
  boo(len = 0.65) {
    if (!this.ready()) return;
    const U = [[420, 7, 4.5], [900, 8, 3.5], [2300, 10, 1.2]];
    for (let i = 0; i < 10; i++) {
      const f0 = 175 * Math.pow(2, (Math.random() * 8) / 12);           // 175〜280Hz
      this.voice(f0, U, (1.9 + Math.random() * 0.5) * len, 0.2, Math.random() * 0.14, 0.82 + Math.random() * 0.05, 0.1, 0.6);
    }
    this.swell(0, 2.2 * len, 900, 0.7, 0.16);
    this.voice(300, [[700, 6, 4], [1200, 7, 3]], 1.7 * len, 0.14, 0.02, 0.78, 0.1, 0.6);   // 「ブーッ」というブザー感
  },
  // たたかいの効果音
  clash() {
    if (!this.ready()) return;
    this.tone(150, 0.4, 'sine', 0.5, 40);
    this.burstNoise(0, 0.3, 1800, 0.4, 0.9); this.burstNoise(0, 0.12, 5000, 0.6, 0.6);     // 「ガッ」という高めの成分
    this.bell(330, 0, 0.3, 0.7); this.bell(523, 0.03, 0.22, 0.6); this.bell(1175, 0.05, 0.12, 0.5);
    this.tone(660, 0.2, 'square', 0.12, 330);
  },
  pop() { if (this.ready()) { this.tone(500 + Math.random() * 900, 0.08, 'triangle', 0.4, 240); this.burstNoise(0, 0.03, 3500, 1, 0.12); } },
  finishHit() {
    if (!this.ready()) return;
    this.tone(180, 0.35, 'sine', 0.45, 40); this.burstNoise(0, 0.35, 1500, 0.4, 0.8); this.burstNoise(0, 0.15, 5000, 0.6, 0.5);
    this.bell(440, 0, 0.3, 0.8); this.bell(880, 0.04, 0.2, 0.7); this.tone(880, 0.25, 'square', 0.1, 440);
  },
  win() { [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.tone(392 * Math.pow(2, s / 12), 0.35, 'triangle', 0.22, 0, i * 0.09)); },
  lose() { [0, -3, -7, -12].forEach((s, i) => this.tone(330 * Math.pow(2, s / 12), 0.35, 'sawtooth', 0.09, 0, i * 0.16)); },
  // BGM（コードで生成）
  bgmOn: false, bgmTimer: null, bgmNext: 0, bgmStep: 0, bgmScene: 'play',
  bgmLevel() { return this.muted ? 0 : CONFIG.SOUND.BGM_VOLUME; },
  bgmFade(to, sec) {
    if (!this.ctx || !this.bgmGain) return;

    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(to, t + sec);
  },
  bgmNote(freq, t, dur, type, vol) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  },
  bgmStart() {
    if (this.bgmOn || !CONFIG.SOUND.BGM_VOLUME) return;
    this.bgmOn = true; this.bgmNext = 0; this.bgmStep = 0;
    this.bgmFade(this.bgmLevel(), 0.6);
    this.bgmTimer = setInterval(() => this.bgmTick(), 100);
  },
  bgmStop() {
    if (!this.bgmOn) return;
    this.bgmOn = false; clearInterval(this.bgmTimer); this.bgmTimer = null; this.bgmFade(0, 0.3);
  },
  bgmKick(t, vol) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(g); g.connect(this.bgmGain); o.start(t); o.stop(t + 0.2);
  },
  bgmHat(t, vol) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    s.buffer = this.noise(); f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

  },
  bgmTick() {
    if (!this.ctx || this.ctx.state !== 'running') { this.bgmNext = 0; return; }
    const now = this.ctx.currentTime;
    if (!this.bgmNext || this.bgmNext < now) this.bgmNext = now + 0.1;
    const S = CONFIG.SOUND, T = this.bgmScene === 'title', bpm = T ? 100 : S.BGM_BPM + Math.min(S.BGM_BPM_MAX_UP, Math.max(0, G.stage - 1) * S.BGM_BPM_PER_STAGE);
    const sx = 60 / bpm / 4;                       // 16分音符
    // Am - F - G - E（Aからの半音数）。短調で、せまってくる感じ
    const CH = [[0, 3, 7, 12], [-4, 0, 3, 8], [-2, 2, 5, 10], [-5, -1, 2, 7]];
    const ARP = [0, 2, 1, 2, 3, 2, 1, 2, 0, 2, 1, 2, 3, 2, 3, 1];
    const hz = n => 220 * Math.pow(2, n / 12);

      const bar = Math.floor(this.bgmStep / 16) % 4, k = this.bgmStep % 16, ch = CH[bar], t = this.bgmNext;

        if (!T && k % 4 === 0) { this.bgmKick(t, 0.3); this.bgmHat(t, 0.1); }
        if (!T && k % 2 === 1) this.bgmHat(t, k % 4 === 3 ? 0.16 : 0.09);
        if (!T && k % 2 === 0) this.bgmNote(hz(ch[0] - (k % 8 === 6 ? 0 : 12)), t, sx * 1.7, 'square', 0.05);
        this.bgmNote(hz(ch[ARP[k]] + 12), t, sx * 1.5, 'square', 0.07);
        this.bgmNote(hz(ch[ARP[k]] + 24), t, sx * 1.2, 'triangle', 0.09);
      } else {            // ミックスA: 前のバージョン（音量だけ上げた）
        if (k === 0) for (const n of [ch[0], ch[1], ch[2]]) this.bgmNote(hz(n), t, sx * 16, 'sawtooth', 0.012);
        if (!T && k % 4 === 0) this.bgmKick(t, 0.5);
        if (!T && k % 2 === 1) this.bgmHat(t, k % 4 === 3 ? 0.07 : 0.035);
        if (!T && k % 2 === 0) this.bgmNote(hz(ch[0] - 12 + (k % 8 === 6 ? 12 : 0)), t, sx * 1.7, 'square', 0.055);
        this.bgmNote(hz(ch[ARP[k]] + 12), t, sx * 1.5, 'square', 0.022);
        this.bgmNote(hz(ch[ARP[k]] + 12), t, sx * 1.5, 'triangle', 0.05);
      }
      if (T) {            // タイトルは、リズムを抜いたぶん、メロディとパッドをはっきり聞かせる
        if (k === 0) for (const n of [ch[0], ch[1], ch[2]]) this.bgmNote(hz(n + 12), t, sx * 16, 'sine', 0.07);
        this.bgmNote(hz(ch[ARP[k]] + 24), t, sx * 1.8, 'triangle', 0.13);
      }
      this.bgmNext += sx; this.bgmStep++;
    }
  },

  setMuted(m) { this.muted = m; lsSet('numberun.mute', m ? '1' : '0'); $('btnSound').classList.toggle('off', m); { const tb = document.getElementById('btnSoundTitle'); if (tb) tb.classList.toggle('off', m); } if (this.bgmOn) this.bgmFade(this.bgmLevel(), 0.2); },
};

/* ---------- 画面・状態 ---------- */
const canvas = $('c'), ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, P = {};   // P = レイアウト
let screen = 'title';

const settings = {
  level: ['g2', 'g3', 'g4', 'ch'].includes(lsGet('numberun.level')) ? lsGet('numberun.level') : 'g3',
  mode: ['think', 'run'].includes(lsGet('numberun.mode')) ? lsGet('numberun.mode') : 'think',
};
const bestKey = lv => 'numberun.best.' + lv;
const getBest = lv => parseInt(lsGet(bestKey(lv)), 10) || 0;

const G = {
  stage: 1, pairsTotal: 3, pairIdx: 0,
  n: 10, shown: 10, parN: 10,
  crowdX: 0, crowdTX: 0, crowdY: 0,
  pair: null, phase: 'idle', sel: -1, timer: 0,
  mistakes: [], hints: 0, scroll: 0, mood: 'normal', moodT: 0, waitAt: 0, stageMistakes: 0,
  enemy: null,   // {n, shown, y, vis}
  battle: null,
  stageLog: [],
};
let particles = [], floaters = [], bursts = [];

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const sb = $('sab').offsetHeight || 0;
  const gh = Math.max(96, Math.min(150, H * 0.14));
  const crowdY = Math.min(H * 0.70, H - sb - 190);
  P = { gh, stopY: H * 0.30, crowdY, crossY: crowdY - gh / 2 - 125, laneX: [W * 0.25, W * 0.75] };
  if (G.phase === 'idle' || !G.crowdY) { G.crowdY = P.crowdY; }
}

/* ---------- ゲーム進行 ---------- */
function resetGame() {
  G.stage = 1; G.n = startFor(settings.level, 1); G.shown = G.n; G.mistakes = [];
  G.hints = CONFIG.HINTS[settings.level];
  particles = []; floaters = []; bursts = [];
  startStage();
}
function startStage() {
  const S = CONFIG.STAGE;
  G.pairsTotal = Math.min(S.PAIRS_BASE + (G.stage - 1) * S.PAIRS_PER_STAGE, S.PAIRS_MAX);
  G.pairIdx = 0; G.parN = G.n; G.enemy = null; G.battle = null; G.stageLog = []; G.stageMistakes = 0;
  G.crowdX = W / 2; G.crowdTX = W / 2; G.crowdY = P.crowdY; G.mood = 'normal'; G.moodT = 0;
  updateHud();
  spawnPair();
}
function spawnPair() {
  G.pair = makePair(G.n, settings.level, G.stage);
  G.pair.y = -P.gh; G.pair.chosen = -1; G.pair.hinted = false; G.pair.revealed = false;
  // 「毎回いちばん多い方を選んだ場合」の人数（てきの強さを決めるために使う）
  G.parN = Math.max(applyGate(G.parN, G.pair.gates[0]), applyGate(G.parN, G.pair.gates[1]));
  G.phase = 'intro';
  updateHud();
}
function speed() { return H * CONFIG.SPEED[settings.mode]; }

function cross(lane) {
  const pr = G.pair, g = pr.gates[lane], before = G.n;
  pr.chosen = lane; pr.revealed = true;
  G.n = g.res;
  const good = lane === pr.best;
  if (!good) G.stageMistakes++;
  const entry = { stage: G.stage, no: G.pairIdx + 1, nBefore: pr.nBefore, gates: pr.gates.map(x => ({ text: gateText(x), res: x.res })), chosen: lane, best: pr.best, good };
  G.stageLog.push(entry);
  if (!good) G.mistakes.push(entry);
  const x = lane === 0 ? P.laneX[0] : P.laneX[1];
  addFloater(good ? 'せいかい！' : (G.stageMistakes >= 2 ? 'ミス2かい…' : 'おしい！ ミス1かい'), x, pr.y - P.gh * 0.75, 34, good ? '#1fae5b' : '#e0701a');
  burst(x, pr.y + P.gh / 2, good ? '#ffd24d' : '#ff8a5c', good ? 26 : 12, 260);
  G.mood = good ? 'happy' : 'sad'; G.moodT = 1.5;
  if (good) {
    const ratio = g.res / Math.max(1, before);
    if (g.res > before) Sound.up(ratio >= 3 ? 3 : ratio >= 2 ? 2 : ratio >= 1.4 ? 1 : 0); else Sound.ok();
    Sound.cheer(); vibrate(15);
  } else { Sound.boo(); vibrate([20, 40, 20]); }
  G.phase = 'reveal'; G.timer = CONFIG.REVEAL_MS[settings.mode] / 1000;
  updateHud();
}
function afterReveal() {
  G.pairIdx++;
  if (G.stageMistakes >= 2 || G.pairIdx >= G.pairsTotal) startBattle(); else spawnPair();   // 2回ミスしたら、のこりは飛ばして すぐ しょうぶ
}

function startBattle() {
  const m = G.stageMistakes, L = CONFIG.LEVELS[settings.level];
  let E, result;
  if (m === 0) {
    result = 'win';
    E = Math.max(CONFIG.ENEMY_MIN, Math.floor(G.parN * (L.enemyRatio || CONFIG.ENEMY_RATIO)));
    if (E >= G.n) E = Math.max(0, G.n - 1);
  } else if (m === 1) { result = 'draw'; E = G.n; }                                   // ミス1回: 同点でひきわけ
  else { result = 'lose'; E = G.n + Math.max(3, Math.round(G.n * 0.3)); }             // ミス2回: まけ
  G.pair = null;
  G.enemy = { n: E, shown: E, y: -90 };
  G.battle = { t: 0, result, win: result === 'win', me0: G.n, en0: E, burstDone: false, closed: false, clashDone: false, popT: 0 };
  G.phase = 'battle'; $('btnHint').disabled = true;
  G.crowdTX = W / 2;
  updateHud();
}
function finishBattle() {
  const b = G.battle, diff = Math.abs(b.me0 - b.en0);
  if (b.result === 'win') {
    if (G.stage > getBest(settings.level)) lsSet(bestKey(settings.level), String(G.stage));
    G.mood = 'happy'; G.moodT = 99; Sound.win(); Sound.cheer(); vibrate([30, 40, 30, 40, 80]);
  } else if (b.result === 'draw') {
    G.mood = 'normal'; G.moodT = 99; Sound.ok(); vibrate(30);
  } else {
    G.mood = 'sad'; G.moodT = 99; Sound.boo(); vibrate([60, 40, 120]);
  }
  showResult(b.result, diff);
}

function showResult(result, diff) {

  $('resMascot').innerHTML = mascotSVG(win ? 'happy' : result === 'draw' ? 'normal' : 'sad', '#2f86ff', 110, win);
  $('resTitle').textContent = win ? `ステージ ${G.stage} クリア！` : result === 'draw' ? 'ひきわけ！' : 'ざんねん…';
  const sub = win ? `${diff}人 のこって かった！ ミスなし！` : result === 'draw' ? 'ミスが1かい。おなじステージを もういちど！（もんだいは かわるよ）' : '2かい まちがえたので まけちゃった…';
  $('resSum').innerHTML = `あなた ${b.me0} − てき ${b.en0} = ${b.me0 - b.en0}<br><span style="font-size:15px;font-weight:700;opacity:.85">${sub}</span>`;
  const mk = G.stageLog.filter(e => !e.good);

  if (mk.length) {
    rows.push('<div style="font-weight:800;margin-bottom:4px">ふりかえり（おおきい方をえらぼう）</div>');

/* ---------- HUD・画面 ---------- */
function updateHud() {
  $('stageBadge').textContent = `ステージ ${G.stage}`;
  $('hintCount').textContent = G.hints;
  const left = Math.max(0, 2 - G.stageMistakes);
  $('lives').textContent = '♥'.repeat(left) + '♡'.repeat(2 - left);
  $('btnHint').disabled = !(G.pair && !G.pair.hinted && G.hints > 0 && (G.phase === 'wait' || G.phase === 'intro'));
}
const screens = { title: $('scTitle'), pause: $('scPause'), result: $('scResult') };
function syncBgm() {        // タイトル=静かな版 / プレイ中=ベースとリズム入り / それ以外=止める
  if (screen === 'title') { Sound.bgmScene = 'title'; Sound.bgmStart(); }
  else if (screen === 'play') { Sound.bgmScene = 'play'; Sound.bgmStart(); }
  else Sound.bgmStop();
}
function showScreen(name) {

  for (const k in screens) screens[k].classList.toggle('hidden', k !== name);

}
function openTitle() {

  document.querySelectorAll('#segMode button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.mode));

/* ---------- 入力 ---------- */
function laneAt(x) { return x < W / 2 ? 0 : 1; }
canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (screen !== 'play') return;
  if (settings.mode === 'think') {
    if (G.phase !== 'wait' || performance.now() - G.waitAt < 300) return;   // 止まった直後の誤タップを防ぐ
    const lane = laneAt(e.clientX);
    G.pair.chosen = lane; G.crowdTX = P.laneX[lane]; G.phase = 'choose'; updateHud(); Sound.select();
  } else if (G.phase === 'intro' || G.phase === 'reveal') {
    canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
    G.crowdTX = clampX(e.clientX);
  }
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (screen !== 'play' || settings.mode !== 'run') return;
  if (e.buttons || e.pointerType === 'touch') G.crowdTX = clampX(e.clientX);
  e.preventDefault();
});
const clampX = x => Math.max(W * 0.12, Math.min(W * 0.88, x));

$('btnHint').addEventListener('click', () => {
  if (!G.pair || G.pair.hinted || G.hints <= 0) return;
  G.hints--; G.pair.hinted = true; G.pair.revealed = true; Sound.hint(); updateHud();
});

/* ---------- 演出 ---------- */
function addFloater(text, x, y, size, color) { floaters.push({ text, x, y, size, color, t0: performance.now(), dur: 1000 }); }
function burst(x, y, color, count, power) {
  for (let i = 0; i < count && particles.length < 400; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * power;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.3, life: 0, max: 0.5 + Math.random() * 0.5, size: 4 + Math.random() * 6, color });
  }
}

/* ---------- 更新 ---------- */
function update(dt) {
  if (G.moodT > 0 && (G.moodT -= dt) <= 0) G.mood = 'normal';
  G.shown += (G.n - G.shown) * (1 - Math.exp(-dt * 10));
  if (Math.abs(G.n - G.shown) < 0.5) G.shown = G.n;
  G.crowdX += (G.crowdTX - G.crowdX) * (1 - Math.exp(-dt * (settings.mode === 'run' ? 12 : 9)));
  const sp = speed();
  switch (G.phase) {
    case 'intro': {
      G.pair.y += sp * dt; G.scroll += sp * dt;
      if (settings.mode === 'think') {
        if (G.pair.y >= P.stopY) { G.pair.y = P.stopY; G.phase = 'wait'; G.waitAt = performance.now(); updateHud(); }
      } else if (G.pair.y >= P.crossY) { cross(laneAt(G.crowdX)); }
      break;
    }
    case 'choose': {
      G.pair.y += sp * dt; G.scroll += sp * dt;
      if (G.pair.y >= P.crossY) { G.pair.y = P.crossY; cross(G.pair.chosen); }
      break;
    }
    case 'reveal': {
      if (settings.mode === 'run') G.scroll += sp * dt;
      G.timer -= dt;
      if (G.timer <= 0) afterReveal();
      break;
    }
    case 'battle': {
      const b = G.battle; b.t += dt;
      G.crowdY += (H * 0.64 - G.crowdY) * (1 - Math.exp(-dt * 4));
      G.enemy.y += (H * 0.30 - G.enemy.y) * (1 - Math.exp(-dt * 4));
      G.scroll += sp * 0.3 * dt;
      if (!b.clashDone && b.t > 1.05) { b.clashDone = true; Sound.clash(); }
      const k = (b.t - 1.2) / 1.8;      // 1.2秒あとから、人数が減っていく
      if (k >= 0 && k < 1 && (b.popT -= dt) <= 0) { b.popT = 0.075; Sound.pop(); }
      if (k >= 0) {
        const e = easeInOut(k), diff = Math.abs(b.me0 - b.en0);
        const meEnd = Math.max(0, b.me0 - b.en0), enEnd = Math.max(0, b.en0 - b.me0);
        G.shown = b.me0 + (meEnd - b.me0) * e;
        G.enemy.shown = b.en0 + (enEnd - b.en0) * e;
        if (!b.burstDone && k > 0.15) { b.burstDone = true; burst(W / 2, (G.crowdY + G.enemy.y) / 2, '#ffd24d', 60, 380); Sound.hit(); }
      }
      if (k >= 1 && !b.closed) { b.closed = true; Sound.finishHit(); G.shown = Math.max(0, b.me0 - b.en0); G.n = G.shown; finishBattle(); }
      break;
    }
  }
}

/* ---------- 描画 ---------- */
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, 7); ctx.fill(); }   // 1つずつ塗る（まとめると円どうしが線でつながる）
function drawChar(x, y, r, body, edge, mood, enemy, leader, hop, i) {
  const t = performance.now() / 1000, ph = t * hop + i * 0.9;
  const sn = Math.abs(Math.sin(ph));                              // 0=着地 1=ジャンプの頂点
  const gy = y;
  y -= sn * r * (mood === 'happy' ? 0.95 : 0.42);
  const rx = r * (1.04 + (1 - sn) * 0.05), ry = r * (0.97 - (1 - sn) * 0.05);   // 着地でぷにっとつぶれる
  const ink = '#12305a';
  ctx.fillStyle = 'rgba(18,48,90,.16)'; ctx.beginPath(); ctx.ellipse(x, gy + r * 1.02, r * (0.85 - sn * 0.2), r * 0.24, 0, 0, 7); ctx.fill();
  const f = Math.sin(ph * 1.5) * r * 0.14;
  ctx.fillStyle = edge;                                           // あし
  ell(x - r * 0.42, y + r * 0.92 + f, r * 0.3, r * 0.19); ell(x + r * 0.42, y + r * 0.92 - f, r * 0.3, r * 0.19);
  const arm = mood === 'happy' ? -r * 0.6 : Math.sin(ph + 1) * r * 0.12;
  ell(x - r * 1.0, y + r * 0.2 + arm, r * 0.2, r * 0.26, 0.4); ell(x + r * 1.0, y + r * 0.2 + arm, r * 0.2, r * 0.26, -0.4);
  ctx.beginPath(); ctx.ellipse(x, y + r * 0.04, rx + 1.4, ry + 1.4, 0, 0, 7); ctx.fill();   // ふち
  ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(x, y + r * 0.38, r * 0.66, r * 0.5, 0, 0, 7); ctx.fill();     // おなか
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(x - r * 0.42, y - r * 0.6, r * 0.28, r * 0.15, -0.5, 0, 7); ctx.fill();  // つや
  if (r < 5.5) { ctx.fillStyle = ink; ell(x - r * 0.33, y, r * 0.17, r * 0.17); ell(x + r * 0.33, y, r * 0.17, r * 0.17); return; }
  // 頭の飾り（先頭=王冠 / てき=つの / なかま=芽）
  const topY = y - ry;
  if (enemy) {
    ctx.fillStyle = '#7a1620'; ctx.beginPath();
    ctx.moveTo(x - r * 0.72, topY + r * 0.28); ctx.lineTo(x - r * 0.52, topY - r * 0.42); ctx.lineTo(x - r * 0.22, topY + r * 0.1);
    ctx.moveTo(x + r * 0.72, topY + r * 0.28); ctx.lineTo(x + r * 0.52, topY - r * 0.42); ctx.lineTo(x + r * 0.22, topY + r * 0.1); ctx.fill();
  } else if (leader) {
    const w = r * 0.95, b0 = topY + r * 0.1, tp = topY - r * 0.5;
    ctx.fillStyle = '#ffd24d'; ctx.strokeStyle = '#c98a00'; ctx.lineWidth = Math.max(1, r * 0.08); ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - w / 2, b0); ctx.lineTo(x - w / 2, tp); ctx.lineTo(x - w / 4, topY - r * 0.15); ctx.lineTo(x, tp - r * 0.08);
    ctx.lineTo(x + w / 4, topY - r * 0.15); ctx.lineTo(x + w / 2, tp); ctx.lineTo(x + w / 2, b0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff5a7a'; ctx.beginPath(); ctx.arc(x, b0 - r * 0.14, r * 0.09, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = '#2e9a3a'; ctx.lineWidth = Math.max(1, r * 0.1); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, topY + r * 0.05); ctx.lineTo(x, topY - r * 0.22); ctx.stroke();
    ctx.fillStyle = '#6fe07a'; ell(x - r * 0.2, topY - r * 0.3, r * 0.22, r * 0.11, -0.5); ell(x + r * 0.2, topY - r * 0.3, r * 0.22, r * 0.11, 0.5);
  }
  const ex = r * 0.38, ey = y - r * 0.02;
  ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1, r * 0.13);
  if (mood === 'happy' && !enemy) {                               // にっこり目（^ ^）
    ctx.strokeStyle = ink; ctx.beginPath();
    ctx.arc(x - ex, ey + r * 0.08, r * 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + ex, ey + r * 0.08, r * 0.18, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {                                                        // つぶらな目（ハイライト付き）
    ctx.fillStyle = ink; ell(x - ex, ey, r * 0.19, r * 0.27); ell(x + ex, ey, r * 0.19, r * 0.27);
    ctx.fillStyle = '#fff';
    ell(x - ex - r * 0.05, ey - r * 0.1, r * 0.09, r * 0.09); ell(x + ex - r * 0.05, ey - r * 0.1, r * 0.09, r * 0.09);
    ell(x - ex + r * 0.06, ey + r * 0.09, r * 0.045, r * 0.045); ell(x + ex + r * 0.06, ey + r * 0.09, r * 0.045, r * 0.045);
  }
  ctx.fillStyle = enemy ? 'rgba(255,200,120,.5)' : 'rgba(255,110,150,.6)';                       // ほっぺ
  ell(x - r * 0.7, y + r * 0.3, r * 0.17, r * 0.1); ell(x + r * 0.7, y + r * 0.3, r * 0.17, r * 0.1);
  const my = y + r * 0.34;
  ctx.strokeStyle = ink;
  if (enemy) {
    ctx.beginPath(); ctx.moveTo(x - ex - r * 0.28, ey - r * 0.46); ctx.lineTo(x - ex + r * 0.22, ey - r * 0.26);
    ctx.moveTo(x + ex + r * 0.28, ey - r * 0.46); ctx.lineTo(x + ex - r * 0.22, ey - r * 0.26); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, my + r * 0.2, r * 0.17, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - r * 0.14, my + r * 0.02); ctx.lineTo(x - r * 0.06, my + r * 0.16); ctx.lineTo(x + r * 0.02, my + r * 0.02);
    ctx.moveTo(x + r * 0.02, my + r * 0.02); ctx.lineTo(x + r * 0.1, my + r * 0.16); ctx.lineTo(x + r * 0.18, my + r * 0.02); ctx.fill();
  } else if (mood === 'happy') {
    ctx.fillStyle = '#7a1f2b'; ctx.beginPath(); ctx.arc(x, my - r * 0.04, r * 0.23, 0, Math.PI); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff8aa0'; ctx.beginPath(); ctx.ellipse(x, my + r * 0.13, r * 0.12, r * 0.07, 0, 0, 7); ctx.fill();
  } else if (mood === 'sad') {
    ctx.beginPath(); ctx.arc(x, my + r * 0.22, r * 0.15, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - ex - r * 0.2, ey - r * 0.4); ctx.lineTo(x - ex + r * 0.2, ey - r * 0.5);
    ctx.moveTo(x + ex + r * 0.2, ey - r * 0.4); ctx.lineTo(x + ex - r * 0.2, ey - r * 0.5); ctx.stroke();
    ctx.fillStyle = '#8fd8ff'; ctx.beginPath(); ctx.ellipse(x + ex + r * 0.12, ey + r * 0.42, r * 0.09, r * 0.16, 0, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(x - r * 0.1, my, r * 0.1, 0, Math.PI); ctx.stroke();    // ω の口
    ctx.beginPath(); ctx.arc(x + r * 0.1, my, r * 0.1, 0, Math.PI); ctx.stroke();
  }
}

function drawCrowd(cx, cy, n, shownN, body, edge, label, mood, enemy) {
  const cnt = Math.max(0, Math.min(Math.round(n), 100));
  const maxR = Math.min(W * 0.2, 96);
  const c = Math.min(maxR / Math.sqrt(cnt), 26), dr = Math.min(c * 0.56, 13);
  const moving = G.phase === 'intro' || G.phase === 'choose' || G.phase === 'battle' || (G.phase === 'reveal' && settings.mode === 'run');
  const hop = moving ? 9 : 3;
  const list = [];
  for (let i = 0; i < cnt; i++) {
    const r = c * Math.sqrt(i + 0.5), a = i * 2.39996 + 0.3;
    list.push({ i, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r * 0.85 });
  }
  list.sort((a, b) => a.y - b.y);
  for (const m of list) drawChar(m.x, m.y, m.i === 0 ? dr * 1.12 : dr, body, edge, mood, enemy, m.i === 0 && !enemy, hop, m.i);
  // 人数のラベル
  const top = cy - Math.min(c * Math.sqrt(cnt), maxR) - dr - 30;
  const txt = String(Math.round(shownN));
  ctx.font = '900 30px "Hiragino Maru Gothic ProN", -apple-system, system-ui, sans-serif';
  const w = Math.max(54, ctx.measureText(txt).width + 28);
  ctx.fillStyle = edge; rr(cx - w / 2, top - 22 + 3, w, 44, 22); ctx.fill();
  ctx.fillStyle = body; rr(cx - w / 2, top - 22, w, 44, 22); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, cx, top + 1);
  if (label) { ctx.font = '800 13px system-ui'; ctx.fillStyle = 'rgba(18,48,90,.75)'; ctx.fillText(label, cx, top - 32); }
}
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawTrack() {
  // 道（流れるしま模様）
  const stripe = 90, off = G.scroll % (stripe * 2);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,.22)';
  for (let y = -stripe * 2 + off; y < H; y += stripe * 2) ctx.fillRect(0, y, W, stripe);
  ctx.strokeStyle = 'rgba(18,48,90,.25)'; ctx.setLineDash([16, 14]); ctx.lineWidth = 4;
  ctx.lineDashOffset = -G.scroll; ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke(); ctx.setLineDash([]);
}

const GATE_COLORS = [['#2e9bff', '#1568c8'], ['#ffae2a', '#c97a00']];
function drawGates() {
  const pr = G.pair; if (!pr) return;
  const gh = P.gh, w = W / 2 - 14;
  for (let i = 0; i < 2; i++) {
    const g = pr.gates[i], x = i * W / 2 + 7, y = pr.y - gh / 2;
    const sel = pr.chosen === i;
    const dim = pr.revealed && G.phase === 'reveal' && pr.chosen !== i;
    ctx.save();
    ctx.globalAlpha = dim ? 0.55 : 1;
    if (sel) { ctx.shadowColor = 'rgba(255,255,255,.95)'; ctx.shadowBlur = 24 * dpr; }
    ctx.fillStyle = GATE_COLORS[i][1]; rr(x, y + 6, w, gh, 22); ctx.fill();
    ctx.fillStyle = GATE_COLORS[i][0]; rr(x, y, w, gh, 22); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = sel ? 7 : 3; ctx.strokeStyle = sel ? '#fff' : 'rgba(255,255,255,.6)'; rr(x + 2, y + 2, w - 4, gh - 4, 20); ctx.stroke();
    const text = gateText(g);
    ctx.font = `900 ${Math.min(64, gh * 0.5)}px "Hiragino Maru Gothic ProN", -apple-system, system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const ty = pr.revealed ? y + gh * 0.37 : y + gh * 0.5;
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(18,48,90,.35)'; ctx.strokeText(text, x + w / 2, ty);
    ctx.fillStyle = '#fff'; ctx.fillText(text, x + w / 2, ty);
    if (pr.revealed) {
      ctx.font = `900 ${Math.min(30, gh * 0.24)}px "Hiragino Maru Gothic ProN", system-ui, sans-serif`;
      ctx.fillStyle = '#fff6c9'; ctx.fillText(`${pr.nBefore} → ${g.res}`, x + w / 2, y + gh * 0.77);
    }
    ctx.restore();
    if (G.phase === 'wait') {   // 「これにする！」ボタン
      const pulse = 1 + 0.04 * Math.sin(performance.now() / 150), bw = w * 0.82, bh = 50;
      ctx.save(); ctx.translate(x + w / 2, y + gh + 14 + bh / 2); ctx.scale(pulse, pulse);
      ctx.fillStyle = '#c76f00'; rr(-bw / 2, -bh / 2 + 5, bw, bh, 25); ctx.fill();
      ctx.fillStyle = '#ff9a1f'; rr(-bw / 2, -bh / 2, bw, bh, 25); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = '900 21px "Hiragino Maru Gothic ProN", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('これにする！', 0, 1); ctx.restore();
    }
    if (pr.revealed && G.phase === 'reveal' && i === pr.best) {   // おおきい方に ★
      ctx.font = '900 26px system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#ffd400';
      ctx.strokeStyle = '#12305a'; ctx.lineWidth = 5; ctx.strokeText('★ おおきい！', x + w / 2, y - 14); ctx.fillText('★ おおきい！', x + w / 2, y - 14);
    }
  }
  if (G.phase === 'wait') {
    ctx.font = '800 17px "Hiragino Maru Gothic ProN", system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#12305a';
    ctx.fillText('たくさんになる方の ボタンをタップ！', W / 2, P.stopY - P.gh / 2 - 28);
  }

}

function render(now, dt) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  drawTrack();
  drawGates();
  if (G.enemy) drawCrowd(W / 2, G.enemy.y, G.enemy.shown, G.enemy.shown, '#ff5a5a', '#b82b2b', 'てき', 'normal', true);
  drawCrowd(G.crowdX, G.crowdY, G.shown, G.shown, '#2f86ff', '#1a4fb0', G.phase === 'battle' ? 'あなた' : '', G.mood, false);
  if (G.phase === 'battle' && G.battle && G.battle.t > 0.4 && G.battle.t < 1.4) {
    const my = (G.enemy.y + G.crowdY) / 2 - 30;
    ctx.font = '900 38px "Hiragino Maru Gothic ProN", system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#12305a'; ctx.lineWidth = 8; ctx.strokeText('しょうぶ！', W / 2, my); ctx.fillText('しょうぶ！', W / 2, my);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  floaters = floaters.filter(f => now - f.t0 < f.dur);
  for (const f of floaters) {
    const k = (now - f.t0) / f.dur, pop = easeOutBack(Math.min(1, (now - f.t0) / 150));
    ctx.save(); ctx.globalAlpha = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4; ctx.translate(f.x, f.y - 40 * easeOutCubic(k)); ctx.scale(pop, pop);
    ctx.font = `900 ${f.size}px "Hiragino Maru Gothic ProN", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = f.size * 0.25; ctx.strokeStyle = '#fff'; ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0); ctx.restore();
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (screen === 'play') update(dt);
  else if (screen === 'result' || screen === 'pause') { /* 止める */ }
  render(now, dt);
  requestAnimationFrame(frame);
}

function mascotSVG(mood, body, size, crown) {
  const edge = body === '#ff5a5a' ? '#b82b2b' : '#1a4fb0';
  const eyes = mood === 'happy'
    ? `<path d="M31 54 Q39 42 47 54 M63 54 Q71 42 79 54" fill="none" stroke="#12305a" stroke-width="5" stroke-linecap="round"/>`
    : `<ellipse cx="39" cy="53" rx="8.5" ry="12" fill="#12305a"/><ellipse cx="71" cy="53" rx="8.5" ry="12" fill="#12305a"/>
       <circle cx="36" cy="47" r="4" fill="#fff"/><circle cx="68" cy="47" r="4" fill="#fff"/><circle cx="42" cy="58" r="2" fill="#fff"/><circle cx="74" cy="58" r="2" fill="#fff"/>`;
  const mouth = mood === 'happy' ? '<path d="M44 68 Q55 90 66 68 Z" fill="#7a1f2b"/><ellipse cx="55" cy="77" rx="5" ry="3" fill="#ff8aa0"/>'
    : mood === 'sad' ? '<path d="M46 80 Q55 70 64 80" fill="none" stroke="#12305a" stroke-width="4" stroke-linecap="round"/><path d="M26 40 L44 36 M84 40 L66 36" stroke="#12305a" stroke-width="3.5" stroke-linecap="round"/><ellipse cx="80" cy="70" rx="4" ry="7" fill="#8fd8ff"/>'
    : '<path d="M46 72 Q50 78 55 72 Q60 78 64 72" fill="none" stroke="#12305a" stroke-width="3.5" stroke-linecap="round"/>';
  const arms = mood === 'happy' ? `<ellipse cx="13" cy="52" rx="8" ry="11" fill="${edge}" transform="rotate(25 13 52)"/><ellipse cx="97" cy="52" rx="8" ry="11" fill="${edge}" transform="rotate(-25 97 52)"/>`
    : `<ellipse cx="13" cy="68" rx="8" ry="11" fill="${edge}" transform="rotate(20 13 68)"/><ellipse cx="97" cy="68" rx="8" ry="11" fill="${edge}" transform="rotate(-20 97 68)"/>`;
  const top = crown
    ? '<path d="M32 26 L32 4 L44 16 L55 0 L66 16 L78 4 L78 26 Z" fill="#ffd24d" stroke="#c98a00" stroke-width="3" stroke-linejoin="round"/><circle cx="55" cy="21" r="4" fill="#ff5a7a"/>'
    : '<path d="M55 24 L55 10" stroke="#2e9a3a" stroke-width="4" stroke-linecap="round"/><ellipse cx="46" cy="8" rx="11" ry="6" fill="#6fe07a" transform="rotate(-25 46 8)"/><ellipse cx="64" cy="8" rx="11" ry="6" fill="#6fe07a" transform="rotate(25 64 8)"/>';
  return `<svg viewBox="0 0 110 112" width="${size}" height="${size}">${arms}
    <ellipse cx="38" cy="102" rx="13" ry="8" fill="${edge}"/><ellipse cx="72" cy="102" rx="13" ry="8" fill="${edge}"/>
    <ellipse cx="55" cy="62" rx="44" ry="40" fill="${edge}"/><ellipse cx="55" cy="59" rx="42" ry="38" fill="${body}"/>
    <ellipse cx="55" cy="80" rx="28" ry="19" fill="#fff" opacity=".2"/><ellipse cx="38" cy="34" rx="13" ry="6.5" fill="#fff" opacity=".5" transform="rotate(-25 38 34)"/>
    ${top}${eyes}<ellipse cx="22" cy="68" rx="8" ry="5" fill="#ff6e96" opacity=".6"/><ellipse cx="88" cy="68" rx="8" ry="5" fill="#ff6e96" opacity=".6"/>${mouth}</svg>`;
}

// 起動時の「タップしてはじめる」: iPhoneは最初のタップまで音を出せないので、ここでタップしてもらい、タイトルのBGMを流す
(function () {
  const sp = document.getElementById('tapSplash');
  if (!sp) return;
  if (Sound.muted || CONFIG.SOUND.TAP_SPLASH === false) { sp.remove(); return; }
  let done = false;
  const go = e => { if (done) return; done = true; Sound.unlock(); syncBgm(); sp.classList.add('hidden'); setTimeout(() => sp.remove(), 300); if (e) e.preventDefault(); };
  sp.addEventListener('touchend', go); sp.addEventListener('click', go);
})();

  const items = [
    ['ふえる（ちょっと）', () => Sound.up(0)], ['ふえる（そこそこ）', () => Sound.up(1)], ['ふえる（けっこう）', () => Sound.up(2)], ['ふえる（すごく）', () => Sound.up(3)],
    ['せいかい（へったけど正解）', () => Sound.ok()], ['歓声', () => Sound.cheer()], ['ブーイング', () => Sound.boo()],
    ['たたかい（ぶつかる）', () => Sound.clash()], ['たたかい（ポップ連打）', () => { for (let i = 0; i < 14; i++) setTimeout(() => Sound.pop(), i * 75); }], ['たたかい（決着）', () => Sound.finishHit()],
    ['クリアのファンファーレ', () => { Sound.win(); Sound.cheer(); }], 
    ['BGM A（前のミックス）', () => { Sound.bgmStop(); Sound.bgmMix = 'A'; setTimeout(() => Sound.bgmStart(), 400); }],
    ['BGM B（中高音を厚く）', () => { Sound.bgmStop(); Sound.bgmMix = 'B'; setTimeout(() => Sound.bgmStart(), 400); }],

  ];

}
