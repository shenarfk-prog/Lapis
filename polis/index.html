<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>polis academy ～公共・政経～</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="polis">
<meta name="theme-color" content="#f6f1e7">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root { --bg: #f6f1e7; --card: #fffdf8; --ink: #1f2a37; --dim: #6b7280; --acc: #1c7c6b; --acc-soft: #e4f1ed; --ng: #c0392b; --ng-soft: #fbe6e3; --gold: #c9972b; --line: #e2dccd; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif; -webkit-text-size-adjust: 100%;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app { position: fixed; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px); }
.view { max-width: 640px; margin: 0 auto; }
.hidden { display: none !important; }
textarea, input[type=text] { -webkit-user-select: text; user-select: text; font-family: inherit; }
button { font-family: inherit; touch-action: manipulation; }

/* タイトル */
.logo { text-align: center; padding: 18px 0 6px; position: relative; }
.logo svg { width: 84px; height: 84px; }
.logo .name { font-size: 46px; font-weight: 900; letter-spacing: .04em; line-height: 1.1; margin-top: 4px; }
.logo .name em { font-style: normal; color: var(--acc); }
.logo .aca { font-size: 26px; font-weight: 900; letter-spacing: .18em; margin-top: 2px; text-indent: .18em; }
.logo .sub { margin-top: 4px; font-size: 14px; font-weight: 800; letter-spacing: .3em; color: var(--dim); }
.icon-btn { border: 0; background: rgba(31,42,55,.08); color: var(--ink); border-radius: 22px; height: 44px; min-width: 44px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; }
.statline { text-align: center; font-weight: 800; font-size: 15px; margin: 10px 0 4px; }
.statline b { color: var(--acc); font-size: 20px; }
.banner { background: #fff4d6; border: 1px solid #ecd9a0; color: #6b5200; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 700; text-align: center; margin: 8px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin: 12px 0; box-shadow: 0 2px 0 rgba(0,0,0,.03); }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--dim); font-weight: 800; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 99px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
.chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
.seg { display: flex; gap: 6px; } .seg .chip { flex: 1; text-align: center; padding: 9px 4px; border-radius: 12px; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.mode { border: 0; border-radius: 18px; padding: 16px 10px; background: var(--acc); color: #fff; font-size: 17px; font-weight: 900; box-shadow: 0 5px 0 #125548; text-align: center; line-height: 1.35; }
.mode small { display: block; font-size: 12px; font-weight: 700; opacity: .85; margin-top: 3px; }
.mode:active { transform: translateY(3px); box-shadow: 0 2px 0 #125548; }
.mode.alt { background: #2f5d8a; box-shadow: 0 5px 0 #1f3f60; } .mode.alt:active { box-shadow: 0 2px 0 #1f3f60; }
.mode.gold { background: var(--gold); box-shadow: 0 5px 0 #8a6616; } .mode.gold:active { box-shadow: 0 2px 0 #8a6616; }
.mode.rose { background: #b5486b; box-shadow: 0 5px 0 #7d2d49; } .mode.rose:active { box-shadow: 0 2px 0 #7d2d49; }
.links { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 6px; }
.link { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 4px; font-size: 14px; font-weight: 800; color: var(--ink); text-align: center; }
.toggle { display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; }
.toggle .sw { width: 46px; height: 26px; border-radius: 99px; background: #c9c3b3; position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on .sw { background: var(--acc); } .toggle.on .sw::after { transform: translateX(20px); }
.back { display: block; text-align: center; margin: 18px 0 0; color: var(--dim); font-weight: 700; font-size: 14px; text-decoration: none; padding: 10px; }

/* クイズ */
.qtop { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.qtop .prog { flex: 1; }
.bar { height: 8px; border-radius: 99px; background: #e5dfd0; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width .25s; }
.qtop .count { font-weight: 900; font-size: 15px; white-space: nowrap; }
.qcat { display: inline-block; background: var(--acc-soft); color: var(--acc); font-weight: 800; font-size: 12px; border-radius: 99px; padding: 3px 10px; margin-bottom: 8px; }
.qtext { font-size: 19px; line-height: 1.75; font-weight: 700; }
.qterm { font-size: 30px; font-weight: 900; line-height: 1.4; text-align: center; padding: 22px 6px; }
.choices { display: grid; gap: 10px; margin: 14px 0 6px; }
.choice { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 14px; font-size: 17px; font-weight: 800; color: var(--ink); line-height: 1.55; }
.choice.def { font-size: 14.5px; font-weight: 600; line-height: 1.65; }
.choice:active { background: #f1ede1; }
.choice.ok { border-color: var(--acc); background: var(--acc-soft); } .choice.ng { border-color: var(--ng); background: var(--ng-soft); } .choice.dim { opacity: .55; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0 6px; }
.tf button { border: 0; border-radius: 18px; padding: 22px 0; font-size: 40px; font-weight: 900; color: #fff; }
.tf .t { background: var(--acc); box-shadow: 0 5px 0 #125548; } .tf .f { background: var(--ng); box-shadow: 0 5px 0 #8c2a1f; }
.tf button:disabled { opacity: .35; box-shadow: none; }
.fb { margin-top: 12px; border-radius: 16px; padding: 14px; border: 2px solid var(--line); background: #fff; }
.fb.ok { border-color: var(--acc); } .fb.ng { border-color: var(--ng); }
.fb .head { font-size: 22px; font-weight: 900; } .fb.ok .head { color: var(--acc); } .fb.ng .head { color: var(--ng); }
.fb .ans { font-size: 20px; font-weight: 900; margin: 6px 0 2px; } .fb .def { font-size: 15px; line-height: 1.7; margin: 4px 0; }
.fb .note { background: #fff4d6; border-radius: 10px; padding: 8px 10px; font-size: 14px; line-height: 1.65; margin: 8px 0; }
.fb textarea { width: 100%; min-height: 64px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 15px; line-height: 1.5; margin-top: 6px; background: #fffef9; }
.btn { display: block; width: 100%; border: 0; border-radius: 16px; padding: 15px; font-size: 18px; font-weight: 900; color: #fff; background: var(--acc); box-shadow: 0 4px 0 #125548; margin-top: 12px; }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #125548; }
.btn.sec { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: none; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.know { background: var(--acc); } .btn.dont { background: var(--ng); box-shadow: 0 4px 0 #8c2a1f; }

/* 結果・きろく・確認 */
h2 { margin: 6px 0 10px; font-size: 24px; }
.big { font-size: 56px; font-weight: 900; text-align: center; color: var(--acc); line-height: 1.1; margin: 8px 0; }
.big small { font-size: 22px; color: var(--dim); }
.msg { text-align: center; font-weight: 800; margin-bottom: 8px; }
.wlist .item { border-top: 1px solid var(--line); padding: 10px 0; } .wlist .item:first-child { border-top: 0; }
.wlist .t { font-weight: 900; font-size: 16px; } .wlist .d { font-size: 14px; line-height: 1.65; color: #374151; margin-top: 2px; } .wlist .m { font-size: 13px; color: var(--acc); margin-top: 4px; }
.catbar { margin: 8px 0; } .catbar .l { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin-bottom: 3px; }
details { border: 1px solid var(--line); border-radius: 14px; background: #fff; margin: 8px 0; padding: 4px 12px; }
summary { font-weight: 900; padding: 10px 0; font-size: 15px; }
.rv { border-top: 1px solid var(--line); padding: 10px 0; }
.rv .t { font-weight: 900; } .rv .d { font-size: 13.5px; line-height: 1.65; margin: 3px 0; } .rv .n { font-size: 12.5px; color: #8a6616; margin: 3px 0; }
.rv .acts { display: flex; gap: 6px; margin-top: 6px; }
.rv .acts button { flex: 1; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 0; font-weight: 800; font-size: 14px; }
.rv .acts button.ok.on { background: var(--acc); border-color: var(--acc); color: #fff; } .rv .acts button.fix.on { background: var(--ng); border-color: var(--ng); color: #fff; }
.rv input { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 6px; }
.rv.s-ok { background: #f3faf7; margin: 0 -12px; padding: 10px 12px; } .rv.s-fix { background: #fdf0ee; margin: 0 -12px; padding: 10px 12px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 28px); transform: translateX(-50%); background: rgba(31,42,55,.92); color: #fff; padding: 10px 18px; border-radius: 99px; font-weight: 800; font-size: 14px; z-index: 60; }
.daily { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #1c7c6b, #2e9b86); color: #fff; border: 0; margin-top: 8px; }
.daily .tx { flex: 1; } .daily b { font-size: 18px; } .daily small { display: block; opacity: .92; font-size: 12.5px; margin-top: 3px; line-height: 1.5; }
.daily .go { border: 0; background: #fff; color: #1c7c6b; font-weight: 900; border-radius: 14px; padding: 13px 18px; font-size: 16px; box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.mode.wide { grid-column: 1 / -1; } .mode.violet { background: #6a55b8; box-shadow: 0 5px 0 #46368a; } .mode.violet:active { box-shadow: 0 2px 0 #46368a; }
.links { grid-template-columns: 1fr 1fr !important; }
.kline { font-size: 12px; color: var(--dim); line-height: 1.6; font-weight: 700; } .kt { font-size: 11px; background: var(--acc-soft); color: var(--acc); border-radius: 99px; padding: 1px 8px; font-weight: 800; }
.chart { display: flex; gap: 3px; align-items: flex-end; height: 130px; margin: 6px 0; } .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; font-size: 10px; color: var(--dim); text-align: center; line-height: 1.2; }
.chart .cn { height: 14px; font-weight: 800; } .chart .cb { flex: 1; width: 100%; display: flex; flex-direction: column; justify-content: flex-end; } .chart .cb i { display: block; width: 100%; } .chart .cb .r { background: var(--acc); } .chart .cb .w { background: var(--ng); } .chart .cd { height: 26px; padding-top: 2px; }
table.cl { width: 100%; border-collapse: collapse; font-size: 12.5px; } .cl th, .cl td { border: 1px solid var(--line); padding: 5px 4px; text-align: center; } .cl th { background: var(--acc-soft); } .cl td:first-child { text-align: left; font-weight: 800; }
.es-item { display: flex !important; align-items: center; gap: 8px; width: 100%; margin-bottom: 8px; text-align: left; padding: 14px 12px; font-size: 16px; } .es-item b { flex: 1; } .es-item small { color: var(--dim); font-weight: 700; } .es-item .tag { font-size: 11px; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 2px 8px; font-weight: 800; }
.card textarea.esf { width: 100%; min-height: 96px; border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; font-size: 15px; line-height: 1.6; background: #fffef9; }
#glQ { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; background: #fff; }
.star { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-weight: 800; font-size: 13px; color: var(--dim); }
.star.on { background: #fff4d6; border-color: var(--gold); color: #8a6616; }
.gl .hd { display: flex; align-items: center; gap: 8px; } .gl .hd .t { flex: 1; } .gl .tag { font-size: 11px; color: var(--acc); background: var(--acc-soft); border-radius: 99px; padding: 2px 8px; font-weight: 800; }
.cmp table { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.65; margin: 8px 0; } .cmp th, .cmp td { border: 1px solid var(--line); padding: 7px 8px; vertical-align: top; text-align: left; }
.cmp th { background: var(--acc-soft); } .cmp td:first-child { background: #faf6ea; font-weight: 800; width: 24%; font-size: 12.5px; }
.cmp .note { background: #fff4d6; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; line-height: 1.65; margin: 8px 0; }
</style>
</head>
<body>
<div id="app">

<!-- タイトル -->
<section class="view" id="vTitle">
  <div class="logo">
    <svg viewBox="0 0 100 100"><path d="M10 38 L50 12 L90 38 Z" fill="#c9972b"/><rect x="14" y="42" width="72" height="7" rx="2" fill="#1f2a37"/><g fill="#1c7c6b"><rect x="20" y="52" width="10" height="30" rx="2"/><rect x="38" y="52" width="10" height="30" rx="2"/><rect x="56" y="52" width="10" height="30" rx="2"/><rect x="74" y="52" width="8" height="30" rx="2"/></g><rect x="10" y="84" width="80" height="8" rx="2" fill="#1f2a37"/></svg>
    <div class="name">pol<em>is</em></div>
    <div class="aca">academy</div>
    <div class="sub">～ 公共・政経 ～</div>
  </div>
  <div class="statline" id="statLine"></div>
  <div class="banner" id="reviewBanner"></div>

  <div class="card daily"><div class="tx"><b id="dailyTitle">今日の復習</b><small id="dailySub"></small></div><button class="go" id="btnDaily">開始</button></div>
  <div class="modes">
    <button class="mode" data-m="def2term">説明 → 用語<small>4択</small></button>
    <button class="mode alt" data-m="term2def">用語 → 説明<small>4択</small></button>
    <button class="mode gold" data-m="card">暗記カード<small>思い出して確認する</small></button>
    <button class="mode rose" data-m="stmt">正誤判定<small>○ か ×</small></button>
    <button class="mode violet wide" data-m="cmp">⚖ 対比クイズ<small>紛らわしい用語を見分ける</small></button>
  </div>
  <div style="margin:14px 4px 0;font-size:13px;font-weight:800;color:var(--dim)">▼ 出題の絞り込み</div>
  <div class="card"><h3>分野（未選択なら全分野）</h3><div class="chips" id="catChips"></div></div>
  <div class="card"><h3>出題</h3><div class="seg" id="segPool">
    <button class="chip" data-v="all">全て</button><button class="chip" data-v="weak">苦手</button><button class="chip" data-v="new">未学習</button><button class="chip" data-v="star">★</button></div></div>
  <div class="card"><h3>問題数</h3><div class="seg" id="segN"></div></div>

  <div class="links">
    <button class="link" id="goGloss">📖 用語集</button>
    <button class="link" id="goCmp">⚖ 対比カード</button>
    <button class="link" id="goEssay">✎ 論述メモ</button>
    <button class="link" id="goStats">📊 学習記録</button>
    <button class="link" id="goClass">👥 結果集計</button>
    <button class="link" id="goReview">✎ データ確認</button>
  </div>
  <a class="back" href="../">← Lapis に戻る</a>
</section>

<!-- クイズ -->
<section class="view hidden" id="vQuiz">
  <div class="qtop">
    <button class="icon-btn" id="btnQuit">← 中断</button>
    <div class="prog"><div class="bar"><i id="qBar" style="width:0%"></i></div></div>
    <div class="count" id="qCount">1 / 10</div>
  </div>
  <div class="card" id="qBody"></div>
  <div id="qFeedback"></div>
</section>

<!-- 結果 -->
<section class="view hidden" id="vResult">
  <h2>結果</h2>
  <div class="big" id="resScore"></div>
  <div class="msg" id="resMsg"></div>
  <div class="card wlist" id="resWrong"></div>
  <button class="btn" id="btnRetryWrong">間違えた問題をもう一度</button>
  <button class="btn sec" id="btnAgain">新しい問題でもう一度</button>
  <button class="btn sec" id="btnCopyRes">結果をコピー（ノート用）</button>
  <button class="btn sec" id="btnResTitle">タイトルへ</button>
</section>

<!-- きろく -->
<section class="view hidden" id="vStats">
  <h2>学習記録</h2>
  <div class="big" id="stBig"></div>
  <div class="msg" id="stMsg"></div>
  <div class="card" id="stKinds"></div>
  <div class="card" id="stChart"></div>
  <div class="card" id="stCats"></div>
  <div class="card wlist" id="stWeak"></div>
  <div class="card">
    <h3>先生への提出・バックアップ</h3>
    <input type="text" id="stName" placeholder="名前（出席番号など）" maxlength="20" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px">
    <button class="btn" id="btnCode">結果コードをコピー（先生に送る）</button>
    <button class="btn sec" id="btnBkCopy">バックアップをコピー</button>
    <button class="btn sec" id="btnBkOpen">バックアップから復元</button>
    <div id="bkBox" class="hidden"><textarea id="bkText" placeholder="コピーしたバックアップを貼り付け" style="width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:8px;margin-top:10px"></textarea><button class="btn" id="btnBkDo">この内容で復元</button></div>
    <div class="kline" style="margin-top:10px">※ ホーム画面に追加したアプリと、Safari（ブラウザ）では記録が別々に保存されます。同じほうで使い続けてください。端末を変えるときは「バックアップ」を使います。</div>
  </div>
  <button class="btn sec" id="btnResetProg">記録をリセット</button>
  <button class="btn sec" id="btnStatsBack">タイトルへ</button>
</section>

<!-- 論述メモ -->
<section class="view hidden" id="vEssay">
  <h2>✎ 論述メモ</h2>
  <div id="esList"></div>
  <div id="esEdit" class="hidden">
    <div class="card" id="esQ"></div>
    <div id="esFields"></div>
    <button class="btn" id="btnEsCopy">コピーして提出・共有</button>
    <button class="btn sec" id="btnEsList">テーマ一覧へ</button>
  </div>
  <button class="btn sec" id="btnEsBack">タイトルへ</button>
</section>

<!-- 結果集計（先生用） -->
<section class="view hidden" id="vClass">
  <h2>結果集計</h2>
  <div class="msg" style="font-size:14px">生徒から届いた「結果コード」を貼り付けて集計します（複数可）。</div>
  <textarea id="clText" placeholder="POLIS1:… を貼り付け（複数の場合は改行で区切る）" style="width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:8px"></textarea>
  <button class="btn" id="btnClassDo">集計する</button>
  <div id="clOut" style="margin-top:8px"></div>
  <button class="btn sec" id="btnClassBack">タイトルへ</button>
</section>

<!-- データかくにん（先生用） -->
<section class="view hidden" id="vReview">
  <h2>データ確認</h2>
  <div class="banner" id="rvSummary"></div>
  <div class="seg" id="rvFilter" style="margin-bottom:8px"><button class="chip on" data-v="all">全て</button><button class="chip" data-v="todo">未確認</button><button class="chip" data-v="fix">要修正</button></div>
  <div id="rvList"></div>
  <button class="btn" id="btnCopyRv">要修正・コメントをコピー</button>
  <button class="btn sec" id="btnRvBack">タイトルへ</button>
</section>

<!-- 用語集 -->
<section class="view hidden" id="vGloss">
  <h2>📖 用語集</h2>
  <input type="text" id="glQ" placeholder="キーワードで検索（用語・説明・考察）">
  <div class="chips" id="glCats" style="margin:10px 0"></div>
  <div class="statline" id="glCount" style="margin:6px 0"></div>
  <div class="card wlist" id="glList"></div>
  <button class="btn sec" id="btnGlBack">タイトルへ</button>
</section>

<!-- 対比カード -->
<section class="view hidden" id="vCmp">
  <h2>⚖ 対比カード</h2>
  <div class="msg" style="font-size:14px">紛らわしい用語を、表で比べよう。</div>
  <button class="btn" id="btnCmpQuizAll">対比クイズ（全部から出題）</button>
  <div id="cmpList" style="margin-top:12px"></div>
  <button class="btn sec" id="btnCmpBack">タイトルへ</button>
</section>
</div>

<script src="terms.js"></script>
<script>
'use strict';
/* =====================================================================
 * 調整用定数
 * ===================================================================== */
const CONFIG = {
  N_OPTIONS: [5, 10, 20, 40],            // 問題数の選択肢
  BOX_WEIGHTS: [10, 6, 3, 1.5, 0.6],      // 習熟度(0〜4)ごとの出やすさ。間違えた用語ほど、よく出る
  NEW_WEIGHT: 5,                          // まだ解いていない用語の出やすさ
  MASTERED_BOX: 3,                        // この習熟度以上を「覚えた」とみなす
  INTERVAL_DAYS: [0, 1, 3, 7, 14],        // 習熟度ごとの、次の復習までの日数（「今日の復習」に使う）
  DAILY_MAX: 20,                          // 「今日の復習」に出す、復習期限の用語の最大数
  DAILY_NEW: 5,                           // 「今日の復習」に加える、新しい用語の数
};
const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
const lsJson = (k, d) => { try { return JSON.parse(lsGet(k)) || d; } catch (e) { return d; } };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- データ ---------- */
const D = window.POLIS_DATA;
D.terms.forEach(t => { t.id = 't:' + t.t; });
D.stmts.forEach(s => { s.id = 's:' + s.s.slice(0, 24); });
(D.cmps || (D.cmps = [])).forEach(c => { c.id = 'p:' + c.title; });
const TERM = new Map(D.terms.map(t => [t.id, t])), STMT = new Map(D.stmts.map(s => [s.id, s]));
const catName = c => D.cats[c] || c;

let hist = lsJson('polis.hist.v1', {}), essays = lsJson('polis.essay.v1', {});
const saveHist = () => lsSet('polis.hist.v1', JSON.stringify(hist));
let prog = lsJson('polis.prog.v1', {}), sprog = lsJson('polis.sprog.v1', {}), memos = lsJson('polis.memo.v1', {}), review = lsJson('polis.review.v1', {});
let stars = lsJson('polis.star.v1', {}), dayLog = lsJson('polis.days.v1', { last: '', streak: 0, today: '', n: 0 });
const saveStars = () => lsSet('polis.star.v1', JSON.stringify(stars));
const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function touchStudy() {      // 学習した日を記録（連続学習日数）
  const t = ymd(); if (dayLog.today !== t) { dayLog.today = t; dayLog.n = 0; } dayLog.n++;
  if (dayLog.last !== t) { const y = new Date(); y.setDate(y.getDate() - 1); dayLog.streak = dayLog.last === ymd(y) ? dayLog.streak + 1 : 1; dayLog.last = t; }
  lsSet('polis.days.v1', JSON.stringify(dayLog));
}
function streakNow() { const y = new Date(); y.setDate(y.getDate() - 1); return (dayLog.last === ymd() || dayLog.last === ymd(y)) ? dayLog.streak : 0; }
const settings = Object.assign({ cats: [], pool: 'all', n: 10, name: '' }, lsJson('polis.settings.v1', {}));
const saveAll = () => { lsSet('polis.prog.v1', JSON.stringify(prog)); lsSet('polis.sprog.v1', JSON.stringify(sprog)); };
const saveSettings = () => lsSet('polis.settings.v1', JSON.stringify(settings));
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function copyText(text) {
  const done = () => toast('コピーしました');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-999px;top:0'; document.body.appendChild(ta);
    ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('コピーできませんでした'); } ta.remove();
  }
}

/* ---------- 画面 ---------- */
let view = 'title';
function showView(name) {
  view = name;
  for (const v of ['Title', 'Quiz', 'Result', 'Stats', 'Review', 'Gloss', 'Cmp', 'Essay', 'Class']) $('v' + v).classList.toggle('hidden', v.toLowerCase() !== name);
  $('app').scrollTop = 0;
}

/* ---------- タイトル ---------- */
function reviewCounts() {
  const all = [...D.terms, ...D.stmts, ...D.cmps]; let ok = 0, fix = 0;
  for (const x of all) { const r = review[x.id]; if (r && r.s === 'ok') ok++; else if (r && r.s === 'fix') fix++; }
  return { total: all.length, ok, fix };
}
function dailySet() {
  const end = new Date(); end.setHours(24, 0, 0, 0);
  const due = D.terms.filter(x => { const p = prog[x.id]; return p && p.s > 0 && (p.d == null || p.d < end.getTime()); }).sort((a, b) => (prog[a.id].d || 0) - (prog[b.id].d || 0));
  const fresh = D.terms.filter(x => !prog[x.id] || !prog[x.id].s);
  return { due, dueUse: due.slice(0, CONFIG.DAILY_MAX), fresh: shuffle(fresh).slice(0, CONFIG.DAILY_NEW) };
}
function renderTitle() {
  const mastered = D.terms.filter(t => prog[t.id] && prog[t.id].b >= CONFIG.MASTERED_BOX).length;
  $('statLine').innerHTML = `覚えた用語 <b>${mastered}</b> / ${D.terms.length}`;
  const rc = reviewCounts();
  $('reviewBanner').classList.toggle('hidden', rc.ok === rc.total);
  $('reviewBanner').textContent = `内容は教員が確認中です（確認済み ${rc.ok} / ${rc.total}　要修正 ${rc.fix}）　データ ${D.version}`;
  $('catChips').innerHTML = Object.keys(D.cats).map(c => `<button class="chip${settings.cats.includes(c) ? ' on' : ''}" data-c="${c}">${esc(catName(c))}</button>`).join('');
  document.querySelectorAll('#segPool .chip').forEach(b => b.classList.toggle('on', b.dataset.v === settings.pool));
  $('segN').innerHTML = [...CONFIG.N_OPTIONS, 9999].map(n => `<button class="chip${settings.n === n ? ' on' : ''}" data-n="${n}">${n === 9999 ? '全部' : n + '問'}</button>`).join('');
  const ds = dailySet(), total = ds.dueUse.length + ds.fresh.length;
  $('dailyTitle').textContent = total ? `今日の復習　${total}問` : '今日の復習は完了！';
  $('dailySub').innerHTML = `期限の用語 ${ds.due.length}　＋　新しい用語 ${ds.fresh.length}<br>🔥 連続学習 ${streakNow()}日　今日の解答 ${dayLog.today === ymd() ? dayLog.n : 0}問`;
  $('btnDaily').classList.toggle('hidden', !total);
}
$('catChips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; const c = b.dataset.c; const i = settings.cats.indexOf(c); if (i >= 0) settings.cats.splice(i, 1); else settings.cats.push(c); saveSettings(); renderTitle(); });
$('segPool').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; settings.pool = b.dataset.v; saveSettings(); renderTitle(); });
$('segN').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; settings.n = +b.dataset.n; saveSettings(); renderTitle(); });
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { startQuiz(b.dataset.m); }));
$('btnDaily').addEventListener('click', () => { const ds = dailySet(); startQuiz('daily', shuffle([...ds.dueUse, ...ds.fresh])); });

/* ---------- 出題 ---------- */
function poolList(kind) {
  const items = kind === 'stmt' ? D.stmts : D.terms, P = kind === 'stmt' ? sprog : prog;
  let list = items.filter(x => !settings.cats.length || settings.cats.includes(x.c));
  if (settings.pool === 'weak') list = list.filter(x => P[x.id] && P[x.id].s > 0 && P[x.id].b <= 1);
  else if (settings.pool === 'new') list = list.filter(x => !P[x.id] || !P[x.id].s);
  else if (settings.pool === 'star') list = list.filter(x => stars[x.id]);
  return list;
}
function sample(list, n, P) {
  const arr = list.slice(), out = [];
  while (out.length < n && arr.length) {
    const ws = arr.map(x => (P[x.id] && P[x.id].s) ? CONFIG.BOX_WEIGHTS[P[x.id].b] : CONFIG.NEW_WEIGHT);
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    for (; k < arr.length - 1; k++) { r -= ws[k]; if (r <= 0) break; }
    out.push(arr.splice(k, 1)[0]);
  }
  return out;
}
function distractors(t, n) {
  const ok = x => x !== t && !x.t.includes(t.t) && !t.t.includes(x.t);
  const pool = shuffle(D.terms.filter(x => ok(x) && x.c === t.c)).slice(0, n);
  if (pool.length < n) pool.push(...shuffle(D.terms.filter(x => ok(x) && x.c !== t.c)).slice(0, n - pool.length));
  return pool;
}
let quiz = null;
function cmpCells(only) {       // 対比カードの「1マス分の説明」を、問題の素材にする
  const out = [];
  for (const c of D.cmps) {
    if (only ? c.title !== only : (settings.cats.length && !settings.cats.includes(c.c))) continue;
    c.rows.forEach((r, ri) => c.cols.forEach((col, ci) => out.push({ id: `p:${c.title}:${ri}:${ci}`, c: c.c, cmp: c, label: r[0], text: r[ci + 1], col: ci, t: `${c.title}（${r[0]}）`, d: `${col}：${r[ci + 1]}`, n: c.n })));
  }
  return out;
}
function startQuiz(mode, items, only) {
  const kind = mode === 'stmt' ? 'stmt' : mode === 'cmp' ? 'cmp' : 'term';
  if (!items) {
    const list = kind === 'cmp' ? cmpCells(only) : poolList(kind);
    if (!list.length) { toast('その条件の問題がありません。分野や出題を変更してください'); return; }
    items = kind === 'cmp' ? shuffle(list).slice(0, Math.min(settings.n, 20)) : sample(list, settings.n, kind === 'stmt' ? sprog : prog);
  }
  const modes = mode === 'daily' ? items.map(() => (Math.random() < 0.6 ? 'def2term' : 'term2def')) : null;
  quiz = { mode, kind, items, modes, only, i: 0, right: 0, wrongs: [], answered: false, correctIdx: -1, pick: [], flipped: false };
  showView('quiz'); renderQ();
}
const MODE_LABEL = { def2term: '説明→用語', term2def: '用語→説明', card: '暗記カード', stmt: '正誤判定', daily: '今日の復習', cmp: '対比クイズ' };
function renderQ() {
  const it = quiz.items[quiz.i], n = quiz.items.length;
  quiz.answered = false; quiz.flipped = false;
  $('qCount').textContent = `${quiz.i + 1} / ${n}`; $('qBar').style.width = (quiz.i / n * 100) + '%';
  $('qFeedback').innerHTML = '';
  const cat = `<span class="qcat">${esc(catName(it.c))}</span>`;
  const qm = quiz.mode === 'daily' ? quiz.modes[quiz.i] : quiz.mode;
  let h = '';
  if (qm === 'cmp') {
    quiz.correctIdx = it.col;
    h = `${cat}<div style="font-size:13px;color:var(--dim);font-weight:800;margin:4px 0">⚖ ${esc(it.cmp.title)}　【${esc(it.label)}】</div><div class="qtext">${esc(it.text)}</div><div class="choices">${it.cmp.cols.map((c, i) => `<button class="choice" data-i="${i}">${esc(c)}</button>`).join('')}</div>`;
  } else if (qm === 'def2term') {
    const ch = shuffle([it, ...distractors(it, 3)]); quiz.pick = ch; quiz.correctIdx = ch.indexOf(it);
    h = `${cat}<div class="qtext">${esc(it.d)}</div><div class="choices">${ch.map((c, i) => `<button class="choice" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`;
  } else if (qm === 'term2def') {
    const ch = shuffle([it, ...distractors(it, 3)]); quiz.pick = ch; quiz.correctIdx = ch.indexOf(it);
    h = `${cat}<div class="qterm">${esc(it.t)}</div><div class="choices">${ch.map((c, i) => `<button class="choice def" data-i="${i}">${esc(c.d)}</button>`).join('')}</div>`;
  } else if (qm === 'card') {
    h = `${cat}<div class="qterm">${esc(it.t)}</div><div id="cardBack"></div><button class="btn" id="btnFlip">答えを見る</button>`;
  } else {
    h = `${cat}<div class="qtext">${esc(it.s)}</div><div class="tf"><button class="t" data-a="1">○</button><button class="f" data-a="0">×</button></div>`;
  }
  $('qBody').innerHTML = h;
  window.scrollTo(0, 0); $('app').scrollTop = 0;
}
function record(ok) {
  const it = quiz.items[quiz.i], P = quiz.kind === 'term' ? prog : sprog;
  const p = P[it.id] || (P[it.id] = { b: 0, s: 0, r: 0, w: 0 });
  p.s++; if (ok) { p.r++; p.b = Math.min(4, p.b + 1); } else { p.w++; p.b = 0; }
  p.d = Date.now() + CONFIG.INTERVAL_DAYS[p.b] * 86400000;      // 次に復習する日
  touchStudy(); { const k = ymd(), h = hist[k] || (hist[k] = { n: 0, r: 0 }); h.n++; if (ok) h.r++; saveHist(); } saveAll(); if (ok) quiz.right++; else quiz.wrongs.push(it);
}
function feedback(ok, it, extraHead) {
  const last = quiz.i === quiz.items.length - 1, memo = memos[it.id] || '';
  const isStmt = quiz.kind === 'stmt', isCmp = quiz.kind === 'cmp';
  const body = isCmp
    ? `<div class="ans">${esc(it.cmp.cols[it.col])}</div><div class="def">【${esc(it.label)}】${esc(it.text)}</div>${it.n ? `<div class="note">💡 考察：${esc(it.n)}</div>` : ''}`
    : isStmt
    ? `<div class="ans">${it.a ? '○（正しい）' : '×（誤り）'}</div><div class="def">${esc(it.e)}</div>`
    : `<div class="ans">${esc(it.t)}</div><div class="def">${esc(it.d)}</div>${it.n ? `<div class="note">💡 考察：${esc(it.n)}</div>` : ''}`;
  $('qFeedback').innerHTML = `<div class="fb ${ok ? 'ok' : 'ng'}"><div class="head">${extraHead || (ok ? '○ 正解！' : '× 不正解')}${quiz.kind === 'term' ? `<button class="star${stars[it.id] ? ' on' : ''}" id="btnStar" style="float:right">${stars[it.id] ? '★ 登録済み' : '☆ 後で見直す'}</button>` : ''}</div>${body}
    <textarea id="memo" placeholder="自分の言葉でメモ（なぜ？ 他との違いは？）">${esc(memo)}</textarea></div>
    <button class="btn" id="btnNext">${last ? '結果を見る' : '次へ'}</button>`;
  $('memo').addEventListener('input', e => { memos[it.id] = e.target.value; lsSet('polis.memo.v1', JSON.stringify(memos)); });
  if ($('btnStar')) $('btnStar').addEventListener('click', e => { stars[it.id] = !stars[it.id]; if (!stars[it.id]) delete stars[it.id]; saveStars(); e.target.className = 'star' + (stars[it.id] ? ' on' : ''); e.target.textContent = stars[it.id] ? '★ 登録済み' : '☆ 後で見直す'; });
  $('btnNext').addEventListener('click', next);
  $('btnNext').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function next() { if (quiz.i < quiz.items.length - 1) { quiz.i++; renderQ(); } else finish(); }
$('qBody').addEventListener('click', e => {
  if (!quiz) return;
  const it = quiz.items[quiz.i];
  const ch = e.target.closest('.choice');
  if (ch && !quiz.answered) {
    quiz.answered = true; const i = +ch.dataset.i, ok = i === quiz.correctIdx;
    document.querySelectorAll('#qBody .choice').forEach((b, k) => { b.classList.add(k === quiz.correctIdx ? 'ok' : (k === i ? 'ng' : 'dim')); });
    record(ok);  feedback(ok, it); return;
  }
  const tf = e.target.closest('.tf button');
  if (tf && !quiz.answered) {
    quiz.answered = true; const ok = (tf.dataset.a === '1') === it.a;
    document.querySelectorAll('#qBody .tf button').forEach(b => { b.disabled = b !== tf; });
    record(ok);  feedback(ok, it); return;
  }
  if (e.target.id === 'btnFlip') {
    quiz.flipped = true;
    $('cardBack').innerHTML = `<div class="fb"><div class="def">${esc(it.d)}</div>${it.n ? `<div class="note">💡 考察：${esc(it.n)}</div>` : ''}</div>`;
    $('btnFlip').outerHTML = `<div class="row2"><button class="btn dont" data-k="0">まだ</button><button class="btn know" data-k="1">覚えた</button></div>`;
    return;
  }
  const kb = e.target.closest('[data-k]');
  if (kb && quiz.flipped && !quiz.answered) {
    quiz.answered = true; const ok = kb.dataset.k === '1'; record(ok); 
    $('qFeedback').innerHTML = `<div class="fb ${ok ? 'ok' : 'ng'}"><div class="head">${ok ? '○ 覚えた！' : '× もう一度'}</div>
      <textarea id="memo" placeholder="自分の言葉でメモ">${esc(memos[it.id] || '')}</textarea></div>
      <button class="btn" id="btnNext">${quiz.i === quiz.items.length - 1 ? '結果を見る' : '次へ'}</button>`;
    $('memo').addEventListener('input', ev => { memos[it.id] = ev.target.value; lsSet('polis.memo.v1', JSON.stringify(memos)); });
    $('btnNext').addEventListener('click', next);
  }
});
$('btnQuit').addEventListener('click', () => { if (confirm('ここで中断しますか？（これまでの記録は保存されます）')) { showView('title'); renderTitle(); } });

/* ---------- 結果 ---------- */
function wrongHtml(list) {
  if (!list.length) return '<div class="msg">全問正解！ 素晴らしい！</div>';
  return '<h3 style="margin:0 0 6px;font-size:14px;color:var(--dim)">間違えた問題</h3>' + list.map(x => `<div class="item"><div class="t">${esc(x.t || x.s)}</div><div class="d">${esc(x.d || x.e)}</div>${memos[x.id] ? `<div class="m">✎ ${esc(memos[x.id])}</div>` : ''}</div>`).join('');
}
function finish() {
  const n = quiz.items.length, r = quiz.right, pct = Math.round(r / n * 100);
  showView('result'); $('qBar').style.width = '100%';
  $('resScore').innerHTML = `${r}<small> / ${n}</small>`;
  $('resMsg').textContent = pct === 100 ? '満点！' : pct >= 80 ? 'よくできました！' : pct >= 50 ? 'あと少し。間違えた用語を、もう一度。' : '大丈夫。間違えた用語から、もう一度。';
  $('resWrong').innerHTML = wrongHtml(quiz.wrongs);
  $('btnRetryWrong').classList.toggle('hidden', !quiz.wrongs.length);
}
$('btnRetryWrong').addEventListener('click', () => startQuiz(quiz.mode, shuffle(quiz.wrongs)));
$('btnAgain').addEventListener('click', () => { if (quiz.mode === 'daily') { const ds = dailySet(); startQuiz('daily', shuffle([...ds.dueUse, ...ds.fresh])); } else startQuiz(quiz.mode, null, quiz.only); });
$('btnResTitle').addEventListener('click', () => { showView('title'); renderTitle(); });
$('btnCopyRes').addEventListener('click', () => {
  const d = new Date(), ds = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  let t = `【polis academy】${ds}　${MODE_LABEL[quiz.mode]}　${quiz.right} / ${quiz.items.length}\n`;
  if (quiz.wrongs.length) { t += '\n間違えた問題:\n'; for (const x of quiz.wrongs) t += `・${x.t || x.s}\n   ${x.d || x.e}${memos[x.id] ? '\n   ✎ ' + memos[x.id] : ''}\n`; }
  copyText(t);
});

/* ---------- きろく ---------- */
const KIND_LABEL = { t: '用語', s: '正誤判定', c: '対比' };
function allProg() {       // 用語・正誤・対比の、すべての学習状況を1つの表にまとめる
  const rows = [];
  D.terms.forEach(t => rows.push({ id: t.id, k: 't', c: t.c, p: prog[t.id], label: t.t, def: t.d }));
  D.stmts.forEach(s => rows.push({ id: s.id, k: 's', c: s.c, p: sprog[s.id], label: s.s, def: s.e }));
  D.cmps.forEach(x => x.rows.forEach((r, ri) => x.cols.forEach((col, ci) => { const id = `p:${x.title}:${ri}:${ci}`; rows.push({ id, k: 'c', c: x.c, p: sprog[id], label: `${x.title}（${r[0]}）`, def: `${col}：${r[ci + 1]}` }); })));
  return rows;
}
function statsData() {
  const rows = allProg(), z = () => ({ total: 0, seen: 0, mastered: 0, ans: 0, ok: 0 });
  const kind = { t: z(), s: z(), c: z() }, cat = {}, all = z();
  Object.keys(D.cats).forEach(c => { cat[c] = z(); });
  for (const x of rows) {
    const p = x.p, ms = !!(p && p.b >= CONFIG.MASTERED_BOX);
    for (const o of [kind[x.k], cat[x.c] || (cat[x.c] = z()), all]) { o.total++; if (p && p.s > 0) { o.seen++; o.ans += p.s; o.ok += p.r; } if (ms) o.mastered++; }
  }
  const weak = rows.filter(x => x.p && x.p.s > 0 && x.p.b <= 1 && x.p.w > 0).sort((a, b) => b.p.w - a.p.w).slice(0, 25);
  const days = [];
  for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); const k = ymd(d), h = hist[k] || { n: 0, r: 0 }; days.push({ k, n: h.n, r: h.r, wd: d.getDay() }); }
  return { all, kind, cat, weak, days };
}
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;
function renderStats() {
  const S = statsData(), a = S.all;
  $('stBig').innerHTML = `${a.mastered}<small> / ${a.total} 項目 覚えた</small>`;
  $('stMsg').textContent = `累計 ${a.ans}問に解答　正答率 ${pctOf(a.ok, a.ans)}%　🔥 連続 ${streakNow()}日`;
  const bar = (l, r, v, t) => `<div class="catbar"><div class="l"><span>${l}</span><span>${r}</span></div><div class="bar"><i style="width:${t ? v / t * 100 : 0}%"></i></div></div>`;
  $('stKinds').innerHTML = '<h3>種類別（覚えた数 / 全体）</h3>' + ['t', 's', 'c'].map(k => { const o = S.kind[k]; return bar(KIND_LABEL[k], `${o.mastered} / ${o.total}　解答 ${o.ans}問・正答率 ${pctOf(o.ok, o.ans)}%`, o.mastered, o.total); }).join('');
  const mx = Math.max(5, ...S.days.map(d => d.n)), WD = '日月火水木金土';
  $('stChart').innerHTML = '<h3>この14日間の解答数</h3><div class="chart">' + S.days.map(d => `<div class="col"><div class="cn">${d.n || ''}</div><div class="cb"><i class="w" style="height:${(d.n - d.r) / mx * 100}%"></i><i class="r" style="height:${d.r / mx * 100}%"></i></div><div class="cd">${+d.k.slice(8)}<br>${WD[d.wd]}</div></div>`).join('') + '</div><div class="kline">緑＝正解　赤＝不正解（この機能を入れた日から記録されます）</div>';
  $('stCats').innerHTML = '<h3>分野別（覚えた数 / 全体）</h3>' + Object.keys(S.cat).map(c => { const o = S.cat[c]; return bar(esc(catName(c)), `${o.mastered} / ${o.total}　正答率 ${o.ans ? pctOf(o.ok, o.ans) + '%' : '―'}`, o.mastered, o.total); }).join('');
  $('stWeak').innerHTML = S.weak.length ? '<h3 style="margin:0 0 6px;font-size:14px;color:var(--dim)">苦手（誤答の多い順・用語／正誤／対比）</h3>' + S.weak.map(x => `<div class="item"><div class="t">${esc(x.label)}　<span style="font-size:12px;color:var(--ng)">×${x.p.w}</span> <span class="kt">${KIND_LABEL[x.k]}</span></div><div class="d">${esc(x.def)}</div>${memos[x.id] ? `<div class="m">✎ ${esc(memos[x.id])}</div>` : ''}</div>`).join('') : '<div class="msg">苦手な項目はまだありません</div>';
  $('stName').value = settings.name || '';
}
$('goStats').addEventListener('click', () => { renderStats(); showView('stats'); });
$('btnStatsBack').addEventListener('click', () => { showView('title'); renderTitle(); });
$('btnResetProg').addEventListener('click', () => { if (confirm('学習記録（習熟度・苦手・日ごとの記録）をすべて消去します。メモと論述メモは残ります。よろしいですか？')) { prog = {}; sprog = {}; hist = {}; dayLog = { last: '', streak: 0, today: '', n: 0 }; saveAll(); saveHist(); lsSet('polis.days.v1', JSON.stringify(dayLog)); renderStats(); toast('リセットしました'); } });
$('stName').addEventListener('input', e => { settings.name = e.target.value.trim().slice(0, 20); saveSettings(); });

/* ---------- バックアップ・結果コード ---------- */
const b64e = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))), b64d = t => JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g, '')))));
function buildSummary() {
  const S = statsData(), cat = {};
  Object.keys(S.cat).forEach(c => { cat[c] = [S.cat[c].ok, S.cat[c].ans]; });
  return { v: 1, n: settings.name || '(無名)', t: Date.now(), a: S.all.ans, o: S.all.ok, d: S.days.filter(x => x.n).length, s: streakNow(), m: S.all.mastered, tot: S.all.total, cat, w: S.weak.slice(0, 5).map(x => x.label) };
}
$('btnCode').addEventListener('click', () => { if (!settings.name) { toast('先に名前（出席番号など）を入力してください'); $('stName').focus(); return; } copyText('POLIS1:' + b64e(buildSummary())); });
$('btnBkCopy').addEventListener('click', () => copyText('POLISBACKUP:' + b64e({ prog, sprog, memos, stars, hist, dayLog, essays, review, name: settings.name || '' })));
$('btnBkOpen').addEventListener('click', () => $('bkBox').classList.toggle('hidden'));
$('btnBkDo').addEventListener('click', () => {
  const t = $('bkText').value.trim();
  if (!t.startsWith('POLISBACKUP:')) { toast('バックアップのコードを貼り付けてください'); return; }
  try {
    const o = b64d(t.slice(12));
    if (!confirm('今の学習記録を、このバックアップで置き換えます。よろしいですか？')) return;
    prog = o.prog || {}; sprog = o.sprog || {}; memos = o.memos || {}; stars = o.stars || {}; hist = o.hist || {}; essays = o.essays || {}; review = o.review || review;
    dayLog = o.dayLog || dayLog; if (o.name) settings.name = o.name;
    saveAll(); saveHist(); saveStars(); saveSettings(); lsSet('polis.memo.v1', JSON.stringify(memos)); lsSet('polis.essay.v1', JSON.stringify(essays)); lsSet('polis.review.v1', JSON.stringify(review)); lsSet('polis.days.v1', JSON.stringify(dayLog));
    $('bkText').value = ''; $('bkBox').classList.add('hidden'); renderStats(); toast('復元しました');
  } catch (e) { toast('コードを読み取れませんでした'); }
});

/* ---------- 結果集計（先生用） ---------- */
function renderClass() {
  const lines = $('clText').value.split(/\s+/).filter(x => x.startsWith('POLIS1:')), list = [];
  for (const l of lines) { try { const o = b64d(l.slice(7)); if (o && o.v === 1) list.push(o); } catch (e) { /* skip */ } }
  const bad = lines.length - list.length, dt = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
  if (!list.length) { $('clOut').innerHTML = `<div class="msg">${lines.length ? '読み取れるコードがありません' : '生徒の結果コードを貼り付けて「集計する」を押してください'}</div>`; return; }
  const cnt = {}; list.forEach(o => (o.w || []).forEach(w => { cnt[w] = (cnt[w] || 0) + 1; }));
  const wk = Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 15);
  const cats = Object.keys(D.cats).map(c => { let ok = 0, a = 0; list.forEach(o => { const v = (o.cat || {})[c]; if (v) { ok += v[0]; a += v[1]; } }); return `<tr><td>${esc(catName(c))}</td><td>${a ? pctOf(ok, a) + '%' : '―'}</td><td>${a}</td></tr>`; }).join('');
  $('clOut').innerHTML = `${bad ? `<div class="banner">読み取れなかったコード ${bad}件</div>` : ''}
    <div class="card"><h3>生徒別（${list.length}名）</h3><table class="cl"><tr><th>名前</th><th>解答</th><th>正答率</th><th>覚えた</th><th>学習日</th><th>連続</th><th>日付</th></tr>${list.sort((a, b) => String(a.n).localeCompare(String(b.n), 'ja')).map(o => `<tr><td>${esc(o.n)}</td><td>${o.a}</td><td>${pctOf(o.o, o.a)}%</td><td>${o.m}${o.tot ? '/' + o.tot : ''}</td><td>${o.d}</td><td>${o.s}</td><td>${dt(o.t)}</td></tr>`).join('')}</table></div>
    <div class="card"><h3>分野別の正答率（全員）</h3><table class="cl"><tr><th>分野</th><th>正答率</th><th>解答数</th></tr>${cats}</table></div>
    <div class="card wlist"><h3>つまずきの多い項目（各自の苦手上位5から集計）</h3>${wk.map(([w, n]) => `<div class="item"><div class="t">${esc(w)}　<span style="font-size:12px;color:var(--ng)">${n}名</span></div></div>`).join('') || '<div class="msg">なし</div>'}</div>`;
}
$('goClass').addEventListener('click', () => { showView('class'); });
$('btnClassDo').addEventListener('click', renderClass);
$('btnClassBack').addEventListener('click', () => { showView('title'); renderTitle(); });

/* ---------- 論述メモ ---------- */
const ESSAY_FIELDS = [['claim', '① 主張（結論）', '私は〜と考える。'], ['reason', '② 理由・根拠', 'なぜなら〜。（用語や制度を使って）'], ['ex', '③ 具体例・資料', '例えば〜。'], ['counter', '④ 反対意見とそれへの再反論', '確かに〜という意見もある。しかし〜。']];
const essayId = e => 'e:' + e.title, saveEssays = () => lsSet('polis.essay.v1', JSON.stringify(essays));
let essayCur = null;
function renderEssayList() {
  $('esList').classList.remove('hidden'); $('esEdit').classList.add('hidden');
  $('esList').innerHTML = D.essays.map((e, i) => { const v = essays[essayId(e)] || {}, n = ESSAY_FIELDS.filter(f => (v[f[0]] || '').trim()).length;
    return `<button class="link es-item" data-i="${i}"><span class="tag">${esc(catName(e.c))}</span><b>${esc(e.title)}</b><small>${n ? `記入 ${n} / 4` : '未記入'}</small></button>`; }).join('');
}
function openEssay(i) {
  const e = D.essays[i], v = essays[essayId(e)] || {}; essayCur = e;
  $('esList').classList.add('hidden'); $('esEdit').classList.remove('hidden');
  $('esQ').innerHTML = `<span class="qcat">${esc(catName(e.c))}</span><div class="qtext" style="font-size:17px"><b>${esc(e.title)}</b><br>${esc(e.q)}</div><div class="kline" style="margin-top:8px">考える視点</div><ul style="margin:4px 0 6px;padding-left:20px;font-size:14px;line-height:1.7">${e.pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul><div class="kline">使いたい用語：${e.terms.map(esc).join('・')}</div>`;
  $('esFields').innerHTML = ESSAY_FIELDS.map(f => `<div class="card"><h3>${f[1]}</h3><textarea class="esf" data-f="${f[0]}" placeholder="${f[2]}">${esc(v[f[0]] || '')}</textarea></div>`).join('');
  $('app').scrollTop = 0;
}
$('esList').addEventListener('click', e => { const b = e.target.closest('.es-item'); if (b) openEssay(+b.dataset.i); });
$('esFields').addEventListener('input', e => { const f = e.target.dataset.f; if (!f || !essayCur) return; const k = essayId(essayCur); (essays[k] || (essays[k] = {}))[f] = e.target.value; essays[k].t = Date.now(); saveEssays(); });
$('btnEsCopy').addEventListener('click', () => { const v = essays[essayId(essayCur)] || {}; copyText(`【論述メモ】${essayCur.title}\n${essayCur.q}\n\n` + ESSAY_FIELDS.map(f => `${f[1]}\n${v[f[0]] || ''}`).join('\n\n') + '\n'); });
$('btnEsList').addEventListener('click', renderEssayList);
$('goEssay').addEventListener('click', () => { renderEssayList(); showView('essay'); });
$('btnEsBack').addEventListener('click', () => { showView('title'); renderTitle(); });

/* ---------- データかくにん（先生用） ---------- */
let rvFilter = 'all';
function rvStatus(id) { return (review[id] && review[id].s) || ''; }
function renderReview() {
  const rc = reviewCounts();
  $('rvSummary').textContent = `確認済み ${rc.ok} / ${rc.total}　要修正 ${rc.fix}　未確認 ${rc.total - rc.ok - rc.fix}　（データ ${D.version}）`;
  document.querySelectorAll('#rvFilter .chip').forEach(b => b.classList.toggle('on', b.dataset.v === rvFilter));
  const show = x => rvFilter === 'all' || (rvFilter === 'todo' && !rvStatus(x.id)) || (rvFilter === 'fix' && rvStatus(x.id) === 'fix');
  const row = (x, isS) => { const isC = !!x.title, st = rvStatus(x.id), c = (review[x.id] && review[x.id].c) || ''; return `<div class="rv ${st ? 's-' + st : ''}" data-id="${esc(x.id)}">
    <div class="t">${isC ? '⚖ ' + esc(x.title) : esc(isS ? x.s : x.t)}${isS ? `　<span style="font-weight:700;color:var(--dim)">【${x.a ? '○' : '×'}】</span>` : ''}</div><div class="d">${isC ? x.rows.map(r => esc(r[0]) + '：' + r.slice(1).map(esc).join(' ／ ')).join('<br>') : esc(isS ? x.e : x.d)}</div>${x.n ? `<div class="n">💡 ${esc(x.n)}</div>` : ''}
    <div class="acts"><button class="ok${st === 'ok' ? ' on' : ''}" data-s="ok">○ 確認済み</button><button class="fix${st === 'fix' ? ' on' : ''}" data-s="fix">✎ 要修正</button></div>
    <input type="text" placeholder="コメント（修正箇所と修正案）" value="${esc(c)}"></div>`; };
  let h = '';
  for (const c of Object.keys(D.cats)) {
    const ts = D.terms.filter(t => t.c === c && show(t)), ss = D.stmts.filter(s => s.c === c && show(s)), cs = D.cmps.filter(x => x.c === c && show(x));
    if (!ts.length && !ss.length && !cs.length) continue;
    const allOk = [...D.terms, ...D.stmts, ...D.cmps].filter(x => x.c === c).every(x => rvStatus(x.id) === 'ok');
    h += `<details><summary>${esc(catName(c))}（用語${ts.length}・正誤${ss.length}・対比${cs.length}）${allOk ? ' ✔' : ''}</summary>${ts.map(t => row(t, false)).join('')}${ss.map(s => row(s, true)).join('')}${cs.map(x => row(x, false)).join('')}
      <button class="btn sec" data-allok="${c}" style="margin:8px 0">この分野を全て「確認済み」にする</button></details>`;
  }
  $('rvList').innerHTML = h || '<div class="msg">該当するものはありません</div>';
}
function setReview(id, patch) { review[id] = Object.assign({ s: '', c: '' }, review[id], patch); lsSet('polis.review.v1', JSON.stringify(review)); }
$('rvList').addEventListener('click', e => {
  const btn = e.target.closest('.acts button'), all = e.target.closest('[data-allok]');
  if (btn) {
    const id = btn.closest('.rv').dataset.id, s = btn.dataset.s;
    setReview(id, { s: rvStatus(id) === s ? '' : s });
    const open = [...document.querySelectorAll('#rvList details')].map(d => d.open); renderReview(); document.querySelectorAll('#rvList details').forEach((d, i) => { d.open = !!open[i]; });
  } else if (all) {
    const c = all.dataset.allok; [...D.terms, ...D.stmts, ...D.cmps].filter(x => x.c === c).forEach(x => setReview(x.id, { s: 'ok' }));
    const open = [...document.querySelectorAll('#rvList details')].map(d => d.open); renderReview(); document.querySelectorAll('#rvList details').forEach((d, i) => { d.open = !!open[i]; });
  }
});
$('rvList').addEventListener('input', e => { if (e.target.tagName === 'INPUT') setReview(e.target.closest('.rv').dataset.id, { c: e.target.value }); });
$('rvFilter').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; rvFilter = b.dataset.v; renderReview(); });
$('goReview').addEventListener('click', () => { renderReview(); showView('review'); });
$('btnRvBack').addEventListener('click', () => { showView('title'); renderTitle(); });
$('btnCopyRv').addEventListener('click', () => {
  const all = [...D.terms, ...D.stmts, ...D.cmps], rc = reviewCounts();
  let t = `【polis academy データ確認】データ ${D.version}\n確認済み ${rc.ok} / ${rc.total}　要修正 ${rc.fix}\n`;
  const items = all.filter(x => rvStatus(x.id) === 'fix' || (review[x.id] && review[x.id].c));
  if (!items.length) t += '\n（要修正・コメントはありません）\n';
  for (const x of items) t += `\n・[${catName(x.c)}] ${x.t || x.s || ('対比: ' + x.title)}\n   ${rvStatus(x.id) === 'fix' ? '【要修正】' : ''}${(review[x.id] && review[x.id].c) || ''}\n`;
  copyText(t);
});

/* ---------- 用語集 ---------- */
let gl = { q: '', cats: [], star: false };
function renderGloss() {
  $('glCats').innerHTML = `<button class="chip${gl.star ? ' on' : ''}" data-star="1">★ 登録のみ（${Object.keys(stars).length}）</button>` + Object.keys(D.cats).map(c => `<button class="chip${gl.cats.includes(c) ? ' on' : ''}" data-c="${c}">${esc(catName(c))}</button>`).join('');
  const q = gl.q.trim().toLowerCase();
  const list = D.terms.filter(t => (!gl.cats.length || gl.cats.includes(t.c)) && (!gl.star || stars[t.id]) && (!q || (t.t + ' ' + t.d + ' ' + (t.n || '') + ' ' + (memos[t.id] || '')).toLowerCase().includes(q)));
  $('glCount').textContent = `${list.length} 語`;
  $('glList').innerHTML = list.map(t => { const p = prog[t.id], lv = p && p.s ? `習熟度 ${'●'.repeat(p.b + 1)}${'○'.repeat(4 - p.b)}` : '未学習';
    return `<div class="item gl" data-id="${esc(t.id)}"><div class="hd"><span class="t">${esc(t.t)}</span><span class="tag">${esc(catName(t.c))}</span><button class="star${stars[t.id] ? ' on' : ''}">${stars[t.id] ? '★' : '☆'}</button></div>
      <div class="d">${esc(t.d)}</div>${t.n ? `<div class="n" style="font-size:13px;color:#8a6616;margin-top:4px">💡 ${esc(t.n)}</div>` : ''}${memos[t.id] ? `<div class="m">✎ ${esc(memos[t.id])}</div>` : ''}<div style="font-size:11.5px;color:var(--dim);margin-top:4px">${lv}</div></div>`; }).join('') || '<div class="msg">該当する用語はありません</div>';
}
$('goGloss').addEventListener('click', () => { renderGloss(); showView('gloss'); });
$('glQ').addEventListener('input', e => { gl.q = e.target.value; renderGloss(); });
$('glCats').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; if (b.dataset.star) gl.star = !gl.star; else { const c = b.dataset.c, i = gl.cats.indexOf(c); if (i >= 0) gl.cats.splice(i, 1); else gl.cats.push(c); } renderGloss(); });
$('glList').addEventListener('click', e => { const b = e.target.closest('.star'); if (!b) return; const id = b.closest('.item').dataset.id; stars[id] = !stars[id]; if (!stars[id]) delete stars[id]; saveStars(); const y = $('app').scrollTop; renderGloss(); $('app').scrollTop = y; });
$('btnGlBack').addEventListener('click', () => { showView('title'); renderTitle(); });

/* ---------- 対比カード ---------- */
function renderCmp() {
  let h = '';
  for (const c of Object.keys(D.cats)) {
    const cs = D.cmps.filter(x => x.c === c); if (!cs.length) continue;
    h += `<div style="margin:12px 4px 4px;font-size:13px;font-weight:800;color:var(--dim)">${esc(catName(c))}</div>` + cs.map(x => `<details class="cmp"><summary>${esc(x.title)}</summary>
      <table><tr><th></th>${x.cols.map(cn => `<th>${esc(cn)}</th>`).join('')}</tr>${x.rows.map(r => `<tr>${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table>
      ${x.n ? `<div class="note">💡 考察：${esc(x.n)}</div>` : ''}<button class="btn" data-cmp="${esc(x.title)}" style="margin:6px 0 10px">この対比でクイズ</button></details>`).join('');
  }
  $('cmpList').innerHTML = h;
}
$('goCmp').addEventListener('click', () => { renderCmp(); showView('cmp'); });
$('btnCmpBack').addEventListener('click', () => { showView('title'); renderTitle(); });
$('btnCmpQuizAll').addEventListener('click', () => { startQuiz('cmp'); });
$('cmpList').addEventListener('click', e => { const b = e.target.closest('[data-cmp]'); if (b) { startQuiz('cmp', null, b.dataset.cmp); } });

/* ---------- 起動 ---------- */
['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dragstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
renderTitle();
if (location.search.includes('debug')) window.__p = { D, hist: () => hist, essays: () => essays, buildSummary, statsData, settings, startQuiz, dailySet, stars: () => stars, dayLog: () => dayLog, get quiz() { return quiz; }, prog: () => prog, review: () => review, poolList, distractors };
</script>
