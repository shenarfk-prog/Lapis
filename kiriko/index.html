<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>KIRIKO</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KIRIKO">
<meta name="theme-color" content="#14122b">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg0: #1a1740;
  --bg1: #0d0b22;
  --ink: #f3f1ff;
  --ink-dim: #9d98c8;
  --panel: rgba(34, 30, 76, .92);
  --accent: #ffc83d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; overscroll-behavior: none;
  background: var(--bg1); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: none;
  -webkit-text-size-adjust: 100%;
}
body {
  position: fixed; inset: 0;
  background: radial-gradient(120% 80% at 50% 0%, var(--bg0), var(--bg1) 70%);
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#sab { position: fixed; left: 0; bottom: 0; height: env(safe-area-inset-bottom); width: 1px; visibility: hidden; pointer-events: none; }

/* HUD */
#hud {
  position: fixed; left: 0; right: 0; top: 0; z-index: 5;
  padding: calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) 4px calc(env(safe-area-inset-left) + 14px);
  pointer-events: none;
}
.hud-row { display: flex; align-items: flex-start; gap: 18px; }
.lbl { font-size: 10px; letter-spacing: .16em; color: var(--ink-dim); font-weight: 700; }
#score { font-size: 38px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; text-shadow: 0 2px 12px rgba(120, 100, 255, .5); }
#best  { font-size: 20px; font-weight: 700; line-height: 1.5; font-variant-numeric: tabular-nums; color: var(--accent); }
.spacer { flex: 1; }
.icon-btn {
  pointer-events: auto; width: 42px; height: 42px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.08); color: var(--ink); display: grid; place-items: center; padding: 0;
  touch-action: manipulation;
}
.icon-btn:active { background: rgba(255,255,255,.18); }
.icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
#btnSound.off .wave { display: none; }
#btnSound:not(.off) .cross { display: none; }
#comboChip {
  height: 26px; margin-top: 2px; display: flex; align-items: center;
}
#comboChip span {
  display: inline-block; padding: 3px 12px; border-radius: 99px; font-size: 13px; font-weight: 800; letter-spacing: .08em;
  background: linear-gradient(90deg, #ff7a59, #ff4f8b); box-shadow: 0 2px 12px rgba(255, 79, 139, .55);
  opacity: 0; transform: scale(.8); transition: opacity .15s;
}
#comboChip.on span { opacity: 1; transform: scale(1); }
#comboChip.pulse span { animation: pulse .32s ease-out; }
@keyframes pulse { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }

/* 画面 */
.screen {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 24px);
  background: radial-gradient(120% 80% at 50% 20%, rgba(36, 30, 90, .94), rgba(10, 8, 28, .97));
  transition: opacity .25s;
}
.screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
.screen.dim { background: rgba(8, 6, 22, .72); }
.logo { display: flex; gap: 7px; margin-bottom: 8px; }
.logo i {
  font-style: normal; width: 46px; height: 54px; border-radius: 12px; display: grid; place-items: center;
  font-size: 30px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.22);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.2), 0 8px 18px rgba(0,0,0,.35);
  animation: bob 2.4s ease-in-out infinite;
}
@keyframes bob { 50% { transform: translateY(-6px); } }
.sub { color: var(--ink-dim); letter-spacing: .3em; font-size: 12px; margin-bottom: 32px; font-weight: 700; }
.big-label { color: var(--ink-dim); font-size: 12px; letter-spacing: .2em; font-weight: 700; }
.big-num { font-size: 54px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1.1; margin-bottom: 6px; }
.hi { margin: 4px 0 28px; font-size: 15px; color: var(--ink-dim); }
.hi b { color: var(--accent); font-size: 22px; margin-left: 6px; font-variant-numeric: tabular-nums; }
.btn {
  appearance: none; border: 0; width: min(280px, 78vw); padding: 16px 0; margin-top: 12px; border-radius: 18px;
  font-size: 18px; font-weight: 800; color: #1a1030; letter-spacing: .08em;
  background: linear-gradient(180deg, #ffd96b, #ffb02e);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 6px 0 #c47f10, 0 12px 22px rgba(0,0,0,.4);
  touch-action: manipulation; transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 2px 0 #c47f10, 0 6px 12px rgba(0,0,0,.4); }
.btn.sec { color: var(--ink); background: linear-gradient(180deg, #4a4590, #373275); box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 6px 0 #231f52, 0 12px 22px rgba(0,0,0,.4); }
.btn.sec:active { box-shadow: inset 0 2px 0 rgba(255,255,255,.2), 0 2px 0 #231f52, 0 6px 12px rgba(0,0,0,.4); }
.btn[hidden] { display: none; }
#newRecord { color: var(--accent); font-weight: 900; letter-spacing: .14em; font-size: 16px; height: 24px; margin-bottom: 4px; animation: pulse .6s ease-out infinite alternate; }
#confirmMsg { white-space: pre-line; }
h2 { margin: 0 0 18px; font-size: 26px; letter-spacing: .2em; }
#tapSplash { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.5);
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); color: #fff; font-weight: 900; font-size: 24px; letter-spacing: .06em; touch-action: manipulation; }
#tapSplash .msg { padding: 16px 28px; border-radius: 99px; background: rgba(255,255,255,.2); border: 2px solid rgba(255,255,255,.5); animation: splashPulse 1.2s ease-in-out infinite; }
@keyframes splashPulse { 50% { transform: scale(1.07); } }
#tapSplash.hidden { opacity: 0; pointer-events: none; transition: opacity .25s; }

.title-snd { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 14px; margin: 0 !important; height: 46px; padding: 0 14px 0 12px; border-radius: 23px; border: 0;
  background: rgba(255,255,255,.2); color: var(--title-snd-color, #fff); display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 800; font-size: 14px; touch-action: manipulation; z-index: 3; }
.title-snd svg { width: 22px; height: 22px; fill: currentColor; }
.title-snd .lbl::after { content: 'おとON'; }
.title-snd.off .lbl::after { content: 'おとOFF'; }
.title-snd.off .wave { display: none; } .title-snd:not(.off) .cross { display: none; }
</style>
</head>
<body>
<div id="tapSplash"><div class="msg">♪ タップして はじめる</div></div>
<canvas id="c"></canvas>
<div id="sab"></div>

<div id="hud">
  <div class="hud-row">
    <div><div class="lbl">SCORE</div><div id="score">0</div></div>
    <div><div class="lbl">BEST</div><div id="best">0</div></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnSound" aria-label="サウンド">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2l1.4-1.4zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10l1.4-1.4z"/><path class="cross" d="M15 9.4 16.4 8 18.5 10.1 20.6 8 22 9.4 19.9 11.5 22 13.6 20.6 15 18.5 12.9 16.4 15 15 13.6 17.1 11.5z"/></svg>
    </button>
    <button class="icon-btn" id="btnPause" aria-label="一時停止">
      <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>
    </button>
  </div>
  <div id="comboChip"><span id="comboText">COMBO</span></div>
</div>

<div class="screen" id="scTitle">
  <button id="btnSoundTitle" class="title-snd" aria-label="サウンド"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2l1.4-1.4zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10l1.4-1.4z"/><path class="cross" d="M15 9.4 16.4 8 18.5 10.1 20.6 8 22 9.4 19.9 11.5 22 13.6 20.6 15 18.5 12.9 16.4 15 15 13.6 17.1 11.5z"/></svg><span class="lbl"></span></button>
  <div class="logo" id="logo"></div>
  <div class="sub">BLOCK PUZZLE</div>
  <div class="big-label">BEST</div>
  <div class="big-num" id="titleBest" style="color:var(--accent)">0</div>
  <div style="height:22px"></div>
  <button class="btn" id="btnContinue" hidden>つづきから</button>
  <button class="btn" id="btnStart">はじめる</button>
</div>

<div class="screen hidden dim" id="scPause">
  <h2>PAUSE</h2>
  <button class="btn" id="btnResume">さいかい</button>
  <button class="btn sec" id="btnRestart">はじめからやり直す</button>
  <button class="btn sec" id="btnToTitle">タイトルへ</button>
</div>

<div class="screen hidden dim" id="scOver">
  <h2>GAME OVER</h2>
  <div class="big-label">SCORE</div>
  <div class="big-num" id="overScore">0</div>
  <div id="newRecord"></div>
  <div class="hi">BEST<b id="overBest">0</b></div>
  <button class="btn" id="btnRetry">もういちど</button>
  <button class="btn sec" id="btnOverTitle">タイトルへ</button>
</div>

<div class="screen hidden dim" id="scConfirm" style="z-index:20">
  <h2 id="confirmMsg" style="font-size:20px;letter-spacing:.06em;text-align:center;line-height:1.6"></h2>
  <button class="btn" id="btnConfirmOk">はい</button>
  <button class="btn sec" id="btnConfirmNo">やめる</button>
</div>

<script>
'use strict';
/* =====================================================================
 * 調整用定数（ここだけいじれば遊び心地・難易度が変わる）
 * ===================================================================== */
const CONFIG = {
  BOARD_SIZE: 8,

  // コンボ: 何も消さない手を何手まで許すか（0 = 1手でも外すとコンボ0に戻る）
  COMBO_GRACE: 0,

  // 得点
  SCORE: {
    PER_CELL: 1,                    // 置いたマス数 × この点
    LINES: [0, 10, 30, 60, 100],    // 同時に消した列数ごとの基本点（index = 列数、4列まで）
    EXTRA_PER_LINE_OVER_4: 50,      // 5列以上は 100 + (列数-4) × この点
    COMBO_STEP: 0.5,                // 列消し点 × (1 + コンボ数 × COMBO_STEP)
    CLEAR_ALL_BONUS: 300,           // 盤面全消しボーナス
  },

  // ブロックの出し方
  SPAWN: {
    NEUTRAL_FILL: 0.40,   // 盤面の埋まり率がこれのとき、大小の出やすさが中立
    SIZE_BIAS: 0.35,      // 大きい = 空いてる時に出やすい / 詰まると小さめに寄る強さ（0で無効、大きいほど極端）
    HELP_FILL: 0.45,      // この埋まり率を超えると救済が働く
    HELP_CLEAR_CHANCE: 0.30, // 救済: 列を消せるブロックを混ぜる確率（0で完全に無し）
    DUP_REROLL: 4,        // 同じ形が3つ揃わないよう引き直す回数
    // 形グループごとの出やすさ（1つの形あたりの重み）
    WEIGHTS: {
      dot: 0.5, line2: 1.0, line3: 1.0, line4: 0.8, line5: 0.5,
      sq2: 1.0, sq3: 0.5, rect: 0.5, corner3: 0.8,
      l4: 0.55, bigl: 0.35, t: 0.6, sz: 0.5,
    },
  },

  // 操作
  DRAG: {
    TRAY_SCALE: 0.75,     // 手持ちブロックの大きさ（盤面のマスに対する比率。大きいほど掴みやすい）
    LIFT_CELLS: 1.5,      // 指よりブロックを上に浮かせる量（マス単位）
    PICKUP_MS: 110,       // 掴んで盤面サイズに拡大するまでの時間
  },

  // サウンド
  SOUND: {
    TAP_SPLASH: true,   // 起動時に「タップしてはじめる」を出す（iPhoneは最初のタップまで音が出せないため。falseで無効）
    BGM_VOLUME: 0.5,   // BGMの音量（0〜1、0でBGM無し）
    BGM_BPM: 92,       // BGMのテンポ
    IGNORE_SILENT_SWITCH: false, // true にすると、iPhoneの消音スイッチがオンでも鳴らす（アプリ内の消音ボタンは有効）
  },

  // 演出
  FX: {
    CLEAR_STAGGER_MS: 28,  // 消える列が置いた位置から波のように広がる遅れ
    MAX_PARTICLES: 500,
    VIBRATE: true,
  },
};

/* ===================================================================== */
const N = CONFIG.BOARD_SIZE;
const SAVE_KEY = 'kiriko.save.v1';
const BEST_KEY = 'kiriko.best.v1';
const MUTE_KEY = 'kiriko.mute.v1';

/* ---------- 色 ---------- */
const COLORS = [
  null,
  { base: '#4f7cff', light: '#9bb6ff', dark: '#2a47c4' }, // sapphire
  { base: '#22cbbb', light: '#8ff0e3', dark: '#0e8d85' }, // aqua
  { base: '#8fdc4f', light: '#d0f6a4', dark: '#4f9a22' }, // lime
  { base: '#ffbe2e', light: '#ffe48f', dark: '#c4850a' }, // amber
  { base: '#ff7048', light: '#ffb095', dark: '#c4401c' }, // coral
  { base: '#ff4a8d', light: '#ff9fc3', dark: '#c01f61' }, // rose
  { base: '#a367ff', light: '#d2b4ff', dark: '#6d33cc' }, // violet
];

/* ---------- 形 ---------- */
const SHAPE_DEFS = [
  ['dot', 'dot', ['#']],
  ['h2', 'line2', ['##']], ['v2', 'line2', ['#', '#']],
  ['h3', 'line3', ['###']], ['v3', 'line3', ['#', '#', '#']],
  ['h4', 'line4', ['####']], ['v4', 'line4', ['#', '#', '#', '#']],
  ['h5', 'line5', ['#####']], ['v5', 'line5', ['#', '#', '#', '#', '#']],
  ['sq2', 'sq2', ['##', '##']],
  ['sq3', 'sq3', ['###', '###', '###']],
  ['r23', 'rect', ['###', '###']], ['r32', 'rect', ['##', '##', '##']],
  ['c3a', 'corner3', ['##', '#.']], ['c3b', 'corner3', ['##', '.#']],
  ['c3c', 'corner3', ['#.', '##']], ['c3d', 'corner3', ['.#', '##']],
  ['l1', 'l4', ['#.', '#.', '##']], ['l2', 'l4', ['.#', '.#', '##']],
  ['l3', 'l4', ['##', '#.', '#.']], ['l4', 'l4', ['##', '.#', '.#']],
  ['l5', 'l4', ['###', '#..']], ['l6', 'l4', ['###', '..#']],
  ['l7', 'l4', ['#..', '###']], ['l8', 'l4', ['..#', '###']],
  ['bl1', 'bigl', ['#..', '#..', '###']], ['bl2', 'bigl', ['..#', '..#', '###']],
  ['bl3', 'bigl', ['###', '#..', '#..']], ['bl4', 'bigl', ['###', '..#', '..#']],
  ['t1', 't', ['###', '.#.']], ['t2', 't', ['.#.', '###']],
  ['t3', 't', ['#.', '##', '#.']], ['t4', 't', ['.#', '##', '.#']],
  ['s1', 'sz', ['.##', '##.']], ['z1', 'sz', ['##.', '.##']],
  ['s2', 'sz', ['#.', '##', '.#']], ['z2', 'sz', ['.#', '##', '#.']],
];
const GROUP_ORDER = [...new Set(SHAPE_DEFS.map(d => d[1]))];
const SHAPES = SHAPE_DEFS.map(([id, group, rows]) => {
  const cells = [];
  rows.forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') cells.push([r, c]); }));
  return {
    id, group, cells,
    h: rows.length, w: rows[0].length, size: cells.length,
    color: 1 + (GROUP_ORDER.indexOf(group) % 7),
    weight: CONFIG.SPAWN.WEIGHTS[group],
  };
});
const SHAPE_BY_ID = Object.fromEntries(SHAPES.map(s => [s.id, s]));

/* ---------- 盤面ロジック ---------- */
function canPlace(board, shape, r0, c0) {
  for (const [dr, dc] of shape.cells) {
    const r = r0 + dr, c = c0 + dc;
    if (r < 0 || c < 0 || r >= N || c >= N || board[r * N + c]) return false;
  }
  return true;
}
function fitsAnywhere(board, shape) {
  for (let r = 0; r <= N - shape.h; r++)
    for (let c = 0; c <= N - shape.w; c++)
      if (canPlace(board, shape, r, c)) return true;
  return false;
}
// 埋まっている行と列（shape を渡すとそれを置いた場合）
function fullLines(board, shape, r0, c0) {
  const occ = (r, c) => board[r * N + c] || (shape && shape.cells.some(([dr, dc]) => r0 + dr === r && c0 + dc === c));
  const rows = [], cols = [];
  for (let r = 0; r < N; r++) { let ok = true; for (let c = 0; c < N && ok; c++) ok = !!occ(r, c); if (ok) rows.push(r); }
  for (let c = 0; c < N; c++) { let ok = true; for (let r = 0; r < N && ok; r++) ok = !!occ(r, c); if (ok) cols.push(c); }
  return { rows, cols };
}
const fullLinesAfter = fullLines;
function canClearSomewhere(board, shape) {
  for (let r = 0; r <= N - shape.h; r++)
    for (let c = 0; c <= N - shape.w; c++)
      if (canPlace(board, shape, r, c)) {
        const f = fullLinesAfter(board, shape, r, c);
        if (f.rows.length + f.cols.length) return true;
      }
  return false;
}
const countFilled = board => board.reduce((a, v) => a + (v ? 1 : 0), 0);

/* ---------- ブロック生成 ---------- */
function shapeWeight(s, pressure) {
  return s.weight * Math.exp(-CONFIG.SPAWN.SIZE_BIAS * pressure * (s.size - 3));
}
function weightedPick(list, wf) {
  let total = 0;
  const ws = list.map(s => { const w = wf(s); total += w; return w; });
  let x = Math.random() * total;
  for (let i = 0; i < list.length; i++) { x -= ws[i]; if (x <= 0) return list[i]; }
  return list[list.length - 1];
}
function generateSet(board) {
  const S = CONFIG.SPAWN;
  const fill = countFilled(board) / (N * N);
  // 空いている→負（大きい形が出やすい）、詰まっている→正（小さい形に寄る）
  const pressure = fill < S.NEUTRAL_FILL
    ? (fill - S.NEUTRAL_FILL) / S.NEUTRAL_FILL
    : (fill - S.NEUTRAL_FILL) / (1 - S.NEUTRAL_FILL);
  const wf = s => shapeWeight(s, pressure);

  const picks = [];
  for (let i = 0; i < 3; i++) {
    let s;
    for (let t = 0; t < S.DUP_REROLL; t++) { s = weightedPick(SHAPES, wf); if (!picks.includes(s)) break; }
    picks.push(s);
  }
  // 保証: 3つのうち最低1つは今の盤面に置ける
  if (!picks.some(s => fitsAnywhere(board, s))) {
    const cand = SHAPES.filter(s => fitsAnywhere(board, s));
    if (cand.length) picks[Math.floor(Math.random() * 3)] = weightedPick(cand, wf);
  }
  // 救済: 詰まり気味のとき、列を消せる形を一定確率で混ぜる
  if (fill >= S.HELP_FILL && Math.random() < S.HELP_CLEAR_CHANCE && !picks.some(s => canClearSomewhere(board, s))) {
    const cand = SHAPES.filter(s => canClearSomewhere(board, s));
    if (cand.length) picks[Math.floor(Math.random() * 3)] = weightedPick(cand, wf);
  }
  return picks;
}

/* ---------- 状態 ---------- */
const state = {
  board: new Array(N * N).fill(0),
  pieces: [null, null, null],   // {shape, spawnAt, placeable}
  score: 0, combo: 0, miss: 0,
  bestAtStart: 0,
  over: false,
};
let best = 0;
let screen = 'title';

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

best = parseInt(lsGet(BEST_KEY), 10) || 0;

function saveGame() {
  if (state.over) { lsDel(SAVE_KEY); return; }
  lsSet(BEST_KEY, String(best));
  lsSet(SAVE_KEY, JSON.stringify({
    v: 1, board: state.board,
    pieces: state.pieces.map(p => p ? p.shape.id : null),
    score: state.score, combo: state.combo, miss: state.miss, bestAtStart: state.bestAtStart,
  }));
}
function loadSave() {
  try {
    const d = JSON.parse(lsGet(SAVE_KEY));
    if (!d || d.v !== 1 || !Array.isArray(d.board) || d.board.length !== N * N) return null;
    if (!Array.isArray(d.pieces) || d.pieces.length !== 3) return null;
    if (!d.pieces.every(id => id === null || SHAPE_BY_ID[id])) return null;

}

function refreshPlaceable() {

}
function spawnPieces(now) {
  const set = generateSet(state.board);
  state.pieces = set.map((shape, i) => ({ shape, spawnAt: now + i * 90, placeable: true }));
  refreshPlaceable();
}

function newGame() {
  state.board = new Array(N * N).fill(0);
  state.score = 0; state.combo = 0; state.miss = 0; state.over = false;
  state.bestAtStart = best;
  displayScore = 0;
  resetFx();
  spawnPieces(performance.now());
  saveGame();
  updateHud(true);
}
function continueGame() {
  const d = loadSave();
  if (!d) { newGame(); return; }
  state.board = d.board.map(v => (v | 0));
  state.score = d.score | 0; state.combo = d.combo | 0; state.miss = d.miss | 0; state.over = false;
  state.bestAtStart = d.bestAtStart | 0;
  const now = performance.now();
  state.pieces = d.pieces.map((id, i) => id ? { shape: SHAPE_BY_ID[id], spawnAt: now + i * 90, placeable: true } : null);
  refreshPlaceable();

/* ---------- サウンド ---------- */
const Sound = {
  ctx: null, master: null, muted: lsGet(MUTE_KEY) === '1',

        const str = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
        str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); v.setUint32(16, 16, true);
        v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true);

  place() { this.tone(200, 0.12, 'triangle', 0.3, 110); this.tone(900, 0.04, 'square', 0.04); },
  invalid() { this.tone(180, 0.16, 'sawtooth', 0.08, 90); },
  clear(lines, combo) {

    const n = Math.min(2 + lines * 2, steps.length);

  allClear() {

/* ---------- 描画・レイアウト ---------- */
const canvas = $('c'), ctx = canvas.getContext('2d');
const hudEl = $('hud');
let W = 0, H = 0, dpr = 1;
let L = {};   // layout

function layout() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const sb = $('sab').offsetHeight || 0;
  const hudB = hudEl.getBoundingClientRect().bottom;
  const avail = H - sb - hudB - 8;
  const boardSize = Math.floor(Math.min(W - 20, avail * 0.62));
  const extra = Math.max(0, Math.min(34, (avail - boardSize - 190) * 0.3));
  const pad = Math.max(6, boardSize * 0.022);
  const cell = (boardSize - pad * 2) / N;
  const bx = Math.round((W - boardSize) / 2), by = Math.round(hudB + 8 + extra);
  const remaining = H - sb - (by + boardSize);
  const slotH = Math.min(remaining - 16, Math.max(170, cell * 4));
  const trayTop = by + boardSize + (remaining - slotH) / 2;
  const gap = 8, margin = Math.max(10, (W - boardSize) / 2);
  const slotW = (W - margin * 2 - gap * 2) / 3;
  const trayCell = cell * CONFIG.DRAG.TRAY_SCALE;   // 手持ちの基本サイズ。入りきらない形だけ縮める
  L = { bx, by, boardSize, pad, cell, gx: bx + pad, gy: by + pad, trayTop, slotH, slotW, gap, margin, trayCell, boardBottom: by + boardSize };
}
const trayCellFor = shape => Math.min(L.trayCell, (L.slotW - 12) / shape.w, (L.slotH - 10) / shape.h);
const slotCenter = i => ({
  x: L.margin + i * (L.slotW + L.gap) + L.slotW / 2,
  y: L.trayTop + L.slotH / 2,
});

function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 切子ガラス風のセル
function drawCell(x, y, s, col, alpha = 1, scale = 1) {
  const C = COLORS[col];
  const pad = s * 0.05, d = (s - pad * 2) * scale;
  const px = x + s / 2 - d / 2, py = y + s / 2 - d / 2;
  const r = d * 0.2;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = C.base;
  rr(px, py, d, d, r); ctx.fill();
  ctx.save();
  rr(px, py, d, d, r); ctx.clip();
  ctx.fillStyle = C.light; ctx.globalAlpha = alpha * 0.55;       // 左上のファセット
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + d, py); ctx.lineTo(px + d * 0.5, py + d * 0.5); ctx.lineTo(px, py + d); ctx.closePath(); ctx.fill();
  ctx.fillStyle = C.dark; ctx.globalAlpha = alpha * 0.5;          // 右下のファセット
  ctx.beginPath(); ctx.moveTo(px + d, py + d); ctx.lineTo(px, py + d); ctx.lineTo(px + d * 0.5, py + d * 0.5); ctx.lineTo(px + d, py); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = C.base;                                         // 中央の面
  rr(px + d * 0.16, py + d * 0.16, d * 0.68, d * 0.68, r * 0.6); ctx.fill();
  ctx.globalAlpha = alpha * 0.35; ctx.fillStyle = '#fff';         // 艶
  rr(px + d * 0.2, py + d * 0.2, d * 0.3, d * 0.14, d * 0.07); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawPiece(shape, cx, cy, cs, alpha = 1, scale = 1) {
  const ox = cx - shape.w * cs / 2, oy = cy - shape.h * cs / 2;
  for (const [r, c] of shape.cells) drawCell(ox + c * cs, oy + r * cs, cs, shape.color, alpha, scale);
}

/* ---------- 演出 ---------- */
let particles = [], floaters = [], clearFx = [], lineFlash = [];
let popAt = new Array(N * N).fill(0);
let shake = { amp: 0, t0: 0, dur: 1 };
let displayScore = 0;
function resetFx() {
  particles = []; floaters = []; clearFx = []; lineFlash = [];
  popAt = new Array(N * N).fill(0);
  shake = { amp: 0, t0: 0, dur: 1 };
  returning = {};
}
const easeOutBack = t => { const c = 1.70158; t = Math.min(1, Math.max(0, t)) - 1; return 1 + (c + 1) * t * t * t + c * t * t; };
const easeOutCubic = t => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);

function addFloater(text, x, y, size, color, dur = 900, rise = 40) {
  floaters.push({ text, x, y, size, color, dur, rise, t0: performance.now() });
}
function burst(x, y, col, count, power) {
  for (let i = 0; i < count && particles.length < CONFIG.FX.MAX_PARTICLES; i++) {
    const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * power;
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - power * 0.35,
      rot: Math.random() * 6, vr: (Math.random() - .5) * 14,
      size: L.cell * (0.1 + Math.random() * 0.16), life: 0, max: 0.55 + Math.random() * 0.45,
      color: Math.random() < 0.35 ? '#fff' : COLORS[col].light,
    });
  }
}

/* ---------- ドラッグ ---------- */
let drag = null;       // {id, idx, px, py, x, y, t0, moved}
let returning = {};    // idx -> {x,y,s,t0,dur}

function trayIndexAt(x, y) {
  if (y < L.boardBottom) return -1;
  let i = Math.floor((x - L.margin + L.gap / 2) / (L.slotW + L.gap));
  return Math.max(0, Math.min(2, i));
}
function dragTarget() {
  const p = state.pieces[drag.idx], sh = p.shape, cs = L.cell;
  const cx = drag.px;
  const cy = drag.py - CONFIG.DRAG.LIFT_CELLS * cs - sh.h * cs / 2;
  const left = cx - sh.w * cs / 2, top = cy - sh.h * cs / 2;
  const c = Math.round((left - L.gx) / cs), r = Math.round((top - L.gy) / cs);
  const valid = canPlace(state.board, sh, r, c);
  return { cx, cy, r, c, valid };
}
function cancelDrag() {
  if (!drag) return;
  startReturn();
}
function startReturn() {
  const d = drag; drag = null;
  if (!d) return;
  returning[d.idx] = { x: d.x, y: d.y, s: d.s, t0: performance.now(), dur: 200 };
}

canvas.addEventListener('pointerdown', e => {
  Sound.unlock();
  if (screen !== 'play' || state.over || drag) return;
  const idx = trayIndexAt(e.clientX, e.clientY);
  if (idx < 0 || !state.pieces[idx] || returning[idx]) return;
  const p = state.pieces[idx];
  if (performance.now() < p.spawnAt) return;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  const sc = slotCenter(idx);
  drag = { id: e.pointerId, idx, px: e.clientX, py: e.clientY, x: sc.x, y: sc.y, s: trayCellFor(p.shape), t0: performance.now(), sx: e.clientX, sy: e.clientY, moved: false };
  Sound.pick();
  e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.px = e.clientX; drag.py = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
  e.preventDefault();
});
function endDrag(e, cancelled) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!cancelled) { drag.px = e.clientX; drag.py = e.clientY; }
  const t = dragTarget();
  const idx = drag.idx;
  if (!cancelled && drag.moved && t.valid) {
    drag = null;
    placePiece(idx, t.r, t.c);
  } else {
    if (!cancelled && drag.moved && drag.py < L.boardBottom + L.cell) Sound.invalid();
    startReturn();
  }
}
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));
canvas.addEventListener('lostpointercapture', e => endDrag(e, true));

/* ---------- ゲーム進行 ---------- */
function placePiece(idx, r0, c0) {
  const now = performance.now();
  const p = state.pieces[idx], sh = p.shape;
  const S = CONFIG.SCORE;
  for (const [dr, dc] of sh.cells) {
    const i = (r0 + dr) * N + (c0 + dc);
    state.board[i] = sh.color;
    popAt[i] = now;
  }
  state.pieces[idx] = null;
  Sound.place(); vibrate(8);

  const pcx = L.gx + (c0 + sh.w / 2) * L.cell, pcy = L.gy + (r0 + sh.h / 2) * L.cell;
  let gained = sh.size * S.PER_CELL;

  const { rows, cols } = fullLines(state.board);
  const lines = rows.length + cols.length;
  if (lines > 0) {
    state.combo += 1; state.miss = 0;
    const base = lines <= 4 ? S.LINES[lines] : S.LINES[4] + (lines - 4) * S.EXTRA_PER_LINE_OVER_4;
    const lineScore = Math.round(base * (1 + state.combo * S.COMBO_STEP));
    gained += lineScore;

    // 消えるセルを集める（重複なし）
    const set = new Set();
    for (const r of rows) for (let c = 0; c < N; c++) set.add(r * N + c);
    for (const c of cols) for (let r = 0; r < N; r++) set.add(r * N + c);
    for (const i of set) {
      const r = (i / N) | 0, c = i % N;
      const dist = Math.hypot(r + .5 - (r0 + sh.h / 2), c + .5 - (c0 + sh.w / 2));
      clearFx.push({ r, c, col: state.board[i], t0: now, delay: dist * CONFIG.FX.CLEAR_STAGGER_MS, burst: false });
      state.board[i] = 0;
    }
    for (const r of rows) lineFlash.push({ kind: 'r', i: r, t0: now });
    for (const c of cols) lineFlash.push({ kind: 'c', i: c, t0: now });

    const empty = state.board.every(v => v === 0);
    if (empty) gained += S.CLEAR_ALL_BONUS;

    // 演出
    const mid = L.by + L.boardSize / 2, cx = W / 2;
    const label = empty ? 'ALL CLEAR!' : lines >= 4 ? 'INCREDIBLE!' : lines === 3 ? 'AMAZING!' : lines === 2 ? 'GREAT!' : '';
    if (label) addFloater(label, cx, mid - L.cell * 1.2, L.cell * (empty ? 1.5 : 1.2), empty ? '#ffd96b' : '#fff', 1300, 30);
    if (state.combo >= 2) addFloater('COMBO ×' + state.combo, cx, mid + (label ? L.cell * 0.2 : -L.cell * 0.6), L.cell * 0.85, '#ff9fc3', 1100, 30);
    const amp = empty ? 14 : lines >= 4 ? 10 : lines === 3 ? 7 : lines === 2 ? 4 : 0;
    if (amp) shake = { amp, t0: now, dur: 380 };
    if (empty) {
      for (let k = 0; k < 90; k++) burst(Math.random() * W, L.by + Math.random() * L.boardSize, 1 + (k % 7), 1, L.cell * 14);
      Sound.allClear(); vibrate([30, 40, 30, 40, 60]);
    } else {
      Sound.clear(lines, state.combo); vibrate(lines >= 2 ? [20, 30, 40] : 18);
    }
    $('comboChip').classList.remove('pulse'); void $('comboChip').offsetWidth; $('comboChip').classList.add('pulse');
  } else {
    state.miss += 1;
    if (state.miss > CONFIG.COMBO_GRACE) state.combo = 0;
  }

  state.score += gained;
  addFloater('+' + gained, pcx, pcy - L.cell * 0.8, L.cell * 0.55, '#ffe48f', 800, 36);
  if (state.score > best) best = state.score;

  if (state.pieces.every(x => x === null)) spawnPieces(now + 120);
  refreshPlaceable();
  updateHud();
  saveGame();
  checkGameOver();
}

function checkGameOver() {
  if (state.over) return;
  if (state.pieces.some(p => p && p.placeable)) return;
  state.over = true;
  lsDel(SAVE_KEY);
  lsSet(BEST_KEY, String(best));
  Sound.bgmStop(); Sound.over(); vibrate([60, 40, 120]);
  setTimeout(() => {
    if (!state.over) return;
    $('overScore').textContent = state.score.toLocaleString();
    $('overBest').textContent = best.toLocaleString();
    $('newRecord').textContent = state.score > state.bestAtStart && state.score > 0 ? '★ NEW RECORD ★' : '';
    showScreen('over');
  }, 900);
}

/* ---------- HUD ---------- */
let hudScoreShown = '', hudBestShown = '', hudComboShown = -1;
function updateHud(force) {
  if (force) { hudScoreShown = hudBestShown = ''; hudComboShown = -1; }
  const b = best.toLocaleString();
  if (b !== hudBestShown) { $('best').textContent = b; hudBestShown = b; }
  const chip = $('comboChip');
  if (state.combo !== hudComboShown) {
    hudComboShown = state.combo;
    chip.classList.toggle('on', state.combo >= 1);
    if (state.combo >= 1) $('comboText').textContent = 'COMBO ×' + state.combo;
  }
}

/* ---------- メインループ ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (screen === 'play' || screen === 'over' || screen === 'title' || screen === 'pause') render(now, dt);
  requestAnimationFrame(frame);
}

function render(now, dt) {
  // スコアのカウントアップ
  if (displayScore !== state.score) {
    displayScore += (state.score - displayScore) * (1 - Math.exp(-dt * 9));
    if (Math.abs(state.score - displayScore) < 0.6) displayScore = state.score;
  }
  const s = Math.round(displayScore).toLocaleString();
  if (s !== hudScoreShown) { $('score').textContent = s; hudScoreShown = s; }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 画面揺れ
  ctx.save();
  if (shake.amp) {
    const k = (now - shake.t0) / shake.dur;
    if (k >= 1) shake.amp = 0;
    else { const a = shake.amp * (1 - k); ctx.translate((Math.random() - .5) * a * 2, (Math.random() - .5) * a * 2); }
  }

  drawBoard(now);
  drawClearFx(now, dt);
  drawTray(now);
  drawDrag(now, dt);
  ctx.restore();

  drawParticles(dt);
  drawFloaters(now);
}

function drawBoard(now) {
  // 盤面パネル
  ctx.fillStyle = 'rgba(28, 24, 68, .9)';
  rr(L.bx, L.by, L.boardSize, L.boardSize, L.cell * 0.4); ctx.fill();
  ctx.strokeStyle = 'rgba(160, 150, 255, .22)'; ctx.lineWidth = 1.5; ctx.stroke();

  const dimmed = state.over;
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x = L.gx + c * L.cell, y = L.gy + r * L.cell;
      ctx.fillStyle = (r + c) & 1 ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.085)';
      rr(x + L.cell * .05, y + L.cell * .05, L.cell * .9, L.cell * .9, L.cell * .16); ctx.fill();
    }
  }
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const col = state.board[r * N + c];
      if (!col) continue;
      const t = (now - popAt[r * N + c]) / 240;
      let sc = 1;
      if (t >= 0 && t < 1) sc = 1 + 0.22 * Math.sin(Math.PI * t) * (1 - t * 0.4);
      drawCell(L.gx + c * L.cell, L.gy + r * L.cell, L.cell, col, dimmed ? 0.5 : 1, sc);
    }
  }
}

function drawClearFx(now, dt) {
  // ライン全体のフラッシュ
  lineFlash = lineFlash.filter(f => now - f.t0 < 420);
  for (const f of lineFlash) {
    const k = (now - f.t0) / 420;
    ctx.globalAlpha = (1 - k) * 0.7;
    ctx.fillStyle = '#fff';
    if (f.kind === 'r') rr(L.gx, L.gy + f.i * L.cell + L.cell * .08, L.cell * N, L.cell * .84, L.cell * .3);
    else rr(L.gx + f.i * L.cell + L.cell * .08, L.gy, L.cell * .84, L.cell * N, L.cell * .3);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 消えるセル
  clearFx = clearFx.filter(f => now - f.t0 < f.delay + 340);
  for (const f of clearFx) {
    const t = now - f.t0 - f.delay;
    const x = L.gx + f.c * L.cell, y = L.gy + f.r * L.cell;
    if (t < 0) { drawCell(x, y, L.cell, f.col); continue; }
    if (!f.burst) { f.burst = true; burst(x + L.cell / 2, y + L.cell / 2, f.col, 5, L.cell * 7); }
    const k = t / 340;
    const sc = k < 0.25 ? 1 + 0.35 * (k / 0.25) : 1.35 * (1 - (k - 0.25) / 0.75);
    drawCell(x, y, L.cell, f.col, 1 - k * 0.6, Math.max(0, sc));
    ctx.globalAlpha = Math.max(0, 0.9 - k * 1.6);
    ctx.fillStyle = '#fff';
    const d = L.cell * 0.9 * Math.max(0, sc);
    rr(x + L.cell / 2 - d / 2, y + L.cell / 2 - d / 2, d, d, d * .2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawTray(now) {
  for (let i = 0; i < 3; i++) {
    const sc = slotCenter(i);
    ctx.fillStyle = 'rgba(255,255,255,.04)';
    rr(sc.x - L.slotW / 2, L.trayTop, L.slotW, L.slotH, 18); ctx.fill();
    const p = state.pieces[i];
    if (!p || (drag && drag.idx === i) || returning[i]) continue;
    const t = (now - p.spawnAt) / 280;
    if (t <= 0) continue;
    const k = easeOutBack(t);
    drawPiece(p.shape, sc.x, sc.y, trayCellFor(p.shape), p.placeable ? 1 : 0.3, Math.max(0, k));
  }
  // 戻りアニメ
  for (const key of Object.keys(returning)) {
    const i = +key, rt = returning[i], p = state.pieces[i];
    if (!p) { delete returning[i]; continue; }
    const k = easeOutCubic((now - rt.t0) / rt.dur), sc = slotCenter(i);
    drawPiece(p.shape, rt.x + (sc.x - rt.x) * k, rt.y + (sc.y - rt.y) * k, rt.s + (trayCellFor(p.shape) - rt.s) * k, p.placeable ? 1 : 0.3);
    if (k >= 1) delete returning[i];
  }
}

function drawDrag(now, dt) {
  if (!drag) return;
  const p = state.pieces[drag.idx];
  if (!p) { drag = null; return; }
  const sh = p.shape, t = dragTarget();
  // 位置と大きさをなめらかに追従
  const kk = 1 - Math.exp(-dt * 32);
  drag.x += (t.cx - drag.x) * kk; drag.y += (t.cy - drag.y) * kk;
  const g = easeOutCubic((now - drag.t0) / CONFIG.DRAG.PICKUP_MS);
  const tc = trayCellFor(sh);
  drag.s = tc + (L.cell - tc) * g;

  if (t.valid) {
    const f = fullLinesAfter(state.board, sh, t.r, t.c);
    const pulse = 0.5 + 0.5 * Math.sin(now / 110);
    // 揃いそうな列を光らせる
    ctx.fillStyle = COLORS[sh.color].light;
    ctx.globalAlpha = 0.22 + 0.2 * pulse;
    for (const r of f.rows) { rr(L.gx, L.gy + r * L.cell + L.cell * .04, L.cell * N, L.cell * .92, L.cell * .3); ctx.fill(); }
    for (const c of f.cols) { rr(L.gx + c * L.cell + L.cell * .04, L.gy, L.cell * .92, L.cell * N, L.cell * .3); ctx.fill(); }
    ctx.globalAlpha = 1;
    // 置き場所の影
    for (const [dr, dc] of sh.cells) {
      const x = L.gx + (t.c + dc) * L.cell, y = L.gy + (t.r + dr) * L.cell;
      ctx.fillStyle = COLORS[sh.color].base;
      ctx.globalAlpha = 0.38;
      rr(x + L.cell * .06, y + L.cell * .06, L.cell * .88, L.cell * .88, L.cell * .18); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.strokeStyle = COLORS[sh.color].light; ctx.lineWidth = 2;
      rr(x + L.cell * .06, y + L.cell * .06, L.cell * .88, L.cell * .88, L.cell * .18); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 浮かせたブロック本体（影つき）
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 14 * dpr; ctx.shadowOffsetY = 8 * dpr;
  drawPiece(sh, drag.x, drag.y, drag.s, 1);
  ctx.restore();
}

function drawParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.vy += L.cell * 22 * dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    ctx.globalAlpha = 1 - p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    const s = p.size * (1 - p.life / p.max * 0.4);
    ctx.fillRect(-s / 2, -s / 2, s, s);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawFloaters(now) {
  floaters = floaters.filter(f => now - f.t0 < f.dur);
  for (const f of floaters) {
    const k = (now - f.t0) / f.dur;
    const pop = easeOutBack(Math.min(1, (now - f.t0) / 160));
    const a = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;
    ctx.save();
    ctx.globalAlpha = Math.max(0, a);
    ctx.translate(f.x, f.y - f.rise * easeOutCubic(k));
    ctx.scale(pop, pop);
    ctx.font = `900 ${f.size}px -apple-system, "Hiragino Sans", system-ui, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const tw = ctx.measureText(f.text).width, maxW = W * 0.88;
    if (tw > maxW) ctx.scale(maxW / tw, maxW / tw);
    ctx.lineJoin = 'round'; ctx.lineWidth = f.size * 0.22;
    ctx.strokeStyle = 'rgba(20, 10, 60, .85)'; ctx.strokeText(f.text, 0, 0);
    ctx.fillStyle = f.color; ctx.fillText(f.text, 0, 0);
    ctx.restore();
  }
}

/* ---------- UI ---------- */
function startNew() { newGame(); showScreen('play'); }
let confirmCb = null;
function askConfirm(msg, cb) { $('confirmMsg').textContent = msg; confirmCb = cb; $('scConfirm').classList.remove('hidden'); }
function closeConfirm() { $('scConfirm').classList.add('hidden'); confirmCb = null; }
$('btnConfirmOk').addEventListener('click', () => { const cb = confirmCb; closeConfirm(); if (cb) cb(); });
$('btnConfirmNo').addEventListener('click', closeConfirm);
$('btnStart').addEventListener('click', () => {
  Sound.unlock();
  if (loadSave()) askConfirm('とちゅうのゲームが消えます。\nはじめからやり直しますか？', startNew);
  else startNew();
});
$('btnContinue').addEventListener('click', () => { Sound.unlock(); continueGame(); showScreen(state.over ? 'over' : 'play'); });
$('btnPause').addEventListener('click', () => { if (screen === 'play' && !state.over) { saveGame(); showScreen('pause'); } });
$('btnResume').addEventListener('click', () => showScreen('play'));
$('btnRestart').addEventListener('click', () => askConfirm('今のゲームが消えます。\nはじめからやり直しますか？', startNew));
$('btnRetry').addEventListener('click', startNew);
$('btnToTitle').addEventListener('click', () => { saveGame(); openTitle(); });
$('btnOverTitle').addEventListener('click', openTitle);
$('btnSound').addEventListener('click', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); });

// 操作の邪魔をするiOSの挙動を抑える
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dragstart', 'selectstart'].forEach(t =>
  document.addEventListener(t, e => e.preventDefault()));
// iOSは「指を離した」「クリック」の時点でないと音を許可しないことがあるので、全部で解除を試す
['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click'].forEach(t =>
  document.addEventListener(t, () => { Sound.unlock(); if (!Sound.bgmOn) syncBgm(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Sound.onHide(); if (screen === 'play' && !state.over) { saveGame(); showScreen('pause'); } }
  else Sound.unlock();
});
window.addEventListener('pagehide', () => { if (!state.over && screen !== 'title') saveGame(); });
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

// ロゴ
(function buildLogo() {
  const el = $('logo');
  [...'KIRIKO'].forEach((ch, i) => {
    const t = document.createElement('i');
    t.textContent = ch;
    t.style.background = COLORS[1 + (i % 7)].base;
    t.style.animationDelay = (i * 0.15) + 's';
    el.appendChild(t);
  });
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

$('btnSoundTitle').addEventListener('click', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); if (!Sound.muted && !Sound.bgmOn) syncBgm(); });

Sound.setMuted(Sound.muted);
layout();
updateHud(true);
openTitle();
requestAnimationFrame(frame);

// テスト用フック（URL に ?debug を付けた時だけ）
// 起動時の「タップしてはじめる」: iPhoneは最初のタップまで音を出せないので、ここでタップしてもらい、タイトルのBGMを流す
(function () {
  const sp = document.getElementById('tapSplash');
  if (!sp) return;
  if (Sound.muted || CONFIG.SOUND.TAP_SPLASH === false) { sp.remove(); return; }
  let done = false;
  const go = e => { if (done) return; done = true; Sound.unlock(); syncBgm(); sp.classList.add('hidden'); setTimeout(() => sp.remove(), 300); if (e) e.preventDefault(); };
  sp.addEventListener('touchend', go); sp.addEventListener('click', go);
})();

if (location.search.includes('debug')) window.__game = { state, CONFIG, SHAPES, generateSet, fitsAnywhere, placePiece, layout: () => L, newGame };
</script>
