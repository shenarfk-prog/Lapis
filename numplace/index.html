<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root { --bg0: #17306f; --bg1: #08112d; --paper: #f4f1e6; --ink: #14234f; --gold: #f1b52a; --blue: #2c5fd6; --red: #e0354b; --line: #8a97c4; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg1); color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; touch-action: none; -webkit-text-size-adjust: 100%; }
body { position: fixed; inset: 0; background: radial-gradient(120% 80% at 50% 0%, var(--bg0), var(--bg1) 70%); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px); }
#top { width: 100%; max-width: 560px; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.chip { padding: 7px 14px; border-radius: 99px; background: rgba(255,255,255,.12); font-weight: 800; font-size: 15px; white-space: nowrap; }
.chip b { color: var(--gold); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.icon-btn { min-width: 46px; height: 46px; border-radius: 14px; border: 0; background: rgba(255,255,255,.14); color: #fff; display: inline-flex; align-items: center; justify-content: center;
  padding: 0 10px; font-weight: 800; font-size: 15px; touch-action: manipulation; }
.icon-btn:active { background: rgba(255,255,255,.28); }
.icon-btn svg { width: 22px; height: 22px; fill: currentColor; }
#btnSound.off .wave { display: none; }
#btnSound:not(.off) .cross { display: none; }

#boardWrap { width: 100%; max-width: 560px; flex: 0 0 auto; }
#board { display: grid; grid-template-columns: repeat(9, 1fr); width: 100%; aspect-ratio: 1; background: var(--ink); border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; gap: 1px; }
.cell { position: relative; background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--ink);
  font-weight: 800; font-size: min(7.4vw, 40px); touch-action: manipulation; }
.cell.bR { margin-right: 2px; } .cell.bB { margin-bottom: 2px; }
.cell.peer { background: #dfe6f7; }
.cell.same { background: #ffe9a8; }
.cell.sel { background: #9db8f5; }
.cell.given { color: var(--ink); font-weight: 900; }
.cell.user { color: var(--blue); }
.cell.hint { color: #b87900; }
.cell.wrong { color: var(--red); background: #ffd9de; }
.cell.conflict { color: var(--red); }
.cell .notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); font-size: min(2.7vw, 14px); font-weight: 800; color: #5a6a9e; line-height: 1; }
.cell .notes span { display: flex; align-items: center; justify-content: center; }
.cell .notes span.hl { color: #fff; background: var(--blue); border-radius: 50%; margin: 1px; }
.cell.wave { animation: wave .9s ease-out both; }
@keyframes wave { 0% { transform: scale(1); } 35% { transform: scale(1.18); background: #ffd24d; } 100% { transform: scale(1); } }

#tools { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 8px; }
.tool { height: clamp(48px, 7.2vh, 66px); border-radius: 16px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-family: inherit; font-weight: 800; font-size: 15px; touch-action: manipulation; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.tool small { font-size: 11px; opacity: .75; font-weight: 700; }
.tool:active { background: rgba(255,255,255,.28); }
.tool.on { background: var(--gold); color: var(--ink); }
.tool:disabled { opacity: .35; }
#pad { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; }
.num { height: clamp(52px, 9.5vh, 86px); border-radius: 14px; border: 0; background: #fff; color: var(--ink); font-family: inherit; font-weight: 900; font-size: min(7vw, 34px);
  touch-action: manipulation; box-shadow: 0 4px 0 #9aa6cc; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.num small { font-size: 10px; font-weight: 800; color: #6a79ad; margin-top: 3px; white-space: nowrap; }
.num:active { transform: translateY(3px); box-shadow: 0 1px 0 #9aa6cc; }
.num.done { opacity: .3; }
.num.noteMode { background: #ffe9a8; }

.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; overflow-y: auto; touch-action: pan-y;
  padding: calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px); background: radial-gradient(120% 80% at 50% 10%, rgba(23,48,111,.98), rgba(8,17,45,.99)); transition: opacity .25s; }
.screen > :first-child { margin-top: auto; } .screen > :last-child { margin-bottom: auto; }
.screen.hidden { opacity: 0; pointer-events: none; visibility: hidden; }
.screen.dim { background: rgba(8,17,45,.94); }
.logo { text-align: center; margin-bottom: 14px; }
.logo .mark { display: inline-grid; grid-template-columns: repeat(3, 38px); gap: 3px; padding: 6px; background: var(--ink); border-radius: 12px; border: 2px solid var(--gold); }
.logo .mark i { font-style: normal; width: 38px; height: 38px; background: var(--paper); color: var(--ink); display: grid; place-items: center; font-weight: 900; font-size: 24px; border-radius: 5px; }
.logo .mark i.g { color: #b87900; }
.logo .name { margin-top: 12px; font-size: 46px; font-weight: 900; letter-spacing: .04em; color: #fff; text-shadow: 0 4px 0 #0a1330; }
.logo .name em { font-style: normal; color: var(--gold); }
.logo .sub { margin-top: 2px; font-size: 14px; font-weight: 800; letter-spacing: .3em; color: #b9c4ea; }
.group { width: min(360px, 92vw); margin-top: 10px; }
.group .lbl { font-size: 13px; font-weight: 800; margin: 0 4px 6px; opacity: .75; }
.btn { appearance: none; border: 0; width: min(320px, 82vw); padding: 15px 0; margin-top: 10px; border-radius: 18px; font-family: inherit; font-size: 19px; font-weight: 800; color: var(--ink);
  background: linear-gradient(180deg, #ffd467, #f1a91d); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 6px 0 #a56d00, 0 12px 20px rgba(0,0,0,.35); touch-action: manipulation; }
.btn:active { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.55), 0 2px 0 #a56d00, 0 6px 10px rgba(0,0,0,.35); }
.btn.sec { color: #fff; background: linear-gradient(180deg, #4766c4, #2f4a9c); box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 6px 0 #1b2c66, 0 12px 20px rgba(0,0,0,.35); }
.btn.sec:active { box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 2px 0 #1b2c66, 0 6px 10px rgba(0,0,0,.35); }
.btn[hidden] { display: none; }
.levels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.levels button { appearance: none; border: 3px solid transparent; border-radius: 16px; padding: 10px 4px; font-family: inherit; font-size: 17px; font-weight: 800; background: rgba(255,255,255,.12); color: #fff; touch-action: manipulation; }
.levels button small { display: block; font-size: 11px; font-weight: 700; opacity: .7; margin-top: 2px; }
.levels button.on { border-color: var(--gold); background: rgba(241,181,42,.2); }
.toggles { display: flex; flex-direction: column; gap: 6px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 14px; background: rgba(255,255,255,.1); font-weight: 700; font-size: 14px; touch-action: manipulation; }
.toggle .sw { width: 46px; height: 26px; border-radius: 99px; background: #56628f; position: relative; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.toggle.on .sw { background: #35b46b; } .toggle.on .sw::after { transform: translateX(20px); }
.best { margin: 12px 0 2px; font-size: 14px; font-weight: 800; opacity: .85; }
.back { margin-top: 18px; color: #b9c4ea; font-size: 14px; font-weight: 700; text-decoration: none; }
h2 { margin: 0 0 8px; font-size: 28px; text-align: center; }
.big { font-size: 46px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--gold); margin: 4px 0; }
.sumline { text-align: center; font-size: 15px; font-weight: 700; line-height: 1.8; opacity: .9; margin-bottom: 8px; }
@media (max-height: 740px) { #tools { margin: 8px 0 6px; } .logo .name { font-size: 38px; } }
</style>

<body>
<div id="app">
  <div id="top">
    <div class="chip" id="chipLevel">ふつう</div>
    <div class="chip">⏱ <b id="timer">0:00</b></div>
    <div class="chip">ミス <b id="mistakes">0</b></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnSound" aria-label="サウンド">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2l1.4-1.4zM18.4 5.6a9 9 0 0 1 0 12.8L17 17a7 7 0 0 0 0-10l1.4-1.4z"/><path class="cross" d="M15 9.4 16.4 8 18.5 10.1 20.6 8 22 9.4 19.9 11.5 22 13.6 20.6 15 18.5 12.9 16.4 15 15 13.6 17.1 11.5z"/></svg>
    </button>
    <button class="icon-btn" id="btnPause" aria-label="一時停止"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg></button>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="tools">
    <button class="tool" id="btnNote"><span>メモ</span><small id="noteState">OFF</small></button>
    <button class="tool" id="btnErase"><span>けす</span><small>1マス</small></button>
    <button class="tool" id="btnUndo"><span>もどす</span><small>ひとつ前</small></button>

<div class="screen" id="scTitle">
  <div class="logo">
    <div class="mark"><i>5</i><i class="g">3</i><i></i><i></i><i>9</i><i class="g">1</i><i class="g">7</i><i></i><i>4</i></div>
    <div class="name">num<em>place</em></div>

  </div>

    <div class="levels" id="levels">
      <button data-v="easy">やさしい<small>ひらめきだけで解ける</small></button>

</div>

  <h2>ひとやすみ</h2>
  <div class="sumline">（ボードは かくしています）</div>
  <button class="btn" id="btnResume">つづける</button>
  <button class="btn sec" id="btnNew">あたらしい問題</button>

</div>

<div class="screen hidden dim" id="scWin">
  <h2>クリア！</h2>

  <div class="sumline" id="winSum"></div>
  <button class="btn" id="btnAgain">もういちど（同じむずかしさ）</button>
  <button class="btn sec" id="btnWinTitle">タイトルへ</button>
</div>

<script>
'use strict';
/* =====================================================================
 * 調整用定数
 * ===================================================================== */
const CONFIG = {
  LEVELS: {
    easy:   { label: 'やさしい',   clues: 42, singles: true },     // clues = 最初から見えている数字の目標数
    normal: { label: 'ふつう',     clues: 34, singles: true },     // singles = 「ひらめき（1つに決まる）」だけで解ける問題に限る
    hard:   { label: 'むずかしい', clues: 29, singles: false, advanced: true },   // advanced = ひらめきだけでは解けない問題にする
    expert: { label: 'ぎりぎり',   clues: 24, singles: false },
  },
  MAX_TRIES_ADVANCED: 25,     // 「ひらめきだけでは解けない」問題を探す回数
  SOUND: { SFX_VOLUME: 0.6, BGM_VOLUME: 0.85, BGM_BPM: 78 },
  VIBRATE: true,
};

const $ = id => document.getElementById(id);
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* ignore */ } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } };
function vibrate(p) { if (CONFIG.VIBRATE && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { /* ignore */ } } }
const SAVE_KEY = 'numplace.save.v1', SET_KEY = 'numplace.settings.v1', BEST_KEY = 'numplace.best.v1';

/* ---------- 盤面ロジック ---------- */
const ROW = i => (i / 9) | 0, COL = i => i % 9, BOX = i => (((ROW(i) / 3) | 0) * 3) + ((COL(i) / 3) | 0);
const PEERS = Array.from({ length: 81 }, (_, i) => {
  const a = [];
  for (let j = 0; j < 81; j++) if (j !== i && (ROW(j) === ROW(i) || COL(j) === COL(i) || BOX(j) === BOX(i))) a.push(j);
  return a;
});
const UNITS = [];
for (let k = 0; k < 9; k++) {
  UNITS.push(Array.from({ length: 9 }, (_, c) => k * 9 + c));
  UNITS.push(Array.from({ length: 9 }, (_, r) => r * 9 + k));
  UNITS.push(Array.from({ length: 9 }, (_, n) => (((k / 3) | 0) * 3 + ((n / 3) | 0)) * 9 + (k % 3) * 3 + (n % 3)));
}
const pop = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// 解の数を数える（limit個見つけたら打ち切り）
function countSolutions(g, limit = 2) {
  const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0), cells = g.slice(), empties = [];
  for (let i = 0; i < 81; i++) {
    if (cells[i]) { const b = 1 << (cells[i] - 1); rows[ROW(i)] |= b; cols[COL(i)] |= b; boxes[BOX(i)] |= b; } else empties.push(i);
  }
  let count = 0;
  (function rec() {
    if (count >= limit) return;
    let best = -1, bestMask = 0, bestN = 10;
    for (const i of empties) {
      if (cells[i]) continue;
      const m = ~(rows[ROW(i)] | cols[COL(i)] | boxes[BOX(i)]) & 511, n = pop(m);
      if (n < bestN) { best = i; bestMask = m; bestN = n; if (n <= 1) break; }
    }
    if (best < 0) { count++; return; }
    if (bestN === 0) return;
    for (let d = 1; d <= 9; d++) {
      const b = 1 << (d - 1);
      if (!(bestMask & b)) continue;
      cells[best] = d; rows[ROW(best)] |= b; cols[COL(best)] |= b; boxes[BOX(best)] |= b;
      rec();
      cells[best] = 0; rows[ROW(best)] &= ~b; cols[COL(best)] &= ~b; boxes[BOX(best)] &= ~b;
      if (count >= limit) return;
    }
  })();
  return count;
}
function randomFullGrid() {
  const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0), cells = new Array(81).fill(0);
  (function rec(pos) {
    if (pos === 81) return true;
    const r = ROW(pos), c = COL(pos), b = BOX(pos);
    for (const d of shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
      const bit = 1 << (d - 1);
      if ((rows[r] | cols[c] | boxes[b]) & bit) continue;
      cells[pos] = d; rows[r] |= bit; cols[c] |= bit; boxes[b] |= bit;
      if (rec(pos + 1)) return true;
      cells[pos] = 0; rows[r] &= ~bit; cols[c] &= ~bit; boxes[b] &= ~bit;
    }
    return false;
  })(0);
  return cells;
}
// 「ひらめき」＝その場所に入る数字が1つしかない / その数字が入る場所が1つしかない、だけで解けるか
function solvableBySingles(g) {
  const cells = g.slice();
  for (;;) {
    let progress = false;
    const cand = new Array(81).fill(0);
    for (let i = 0; i < 81; i++) {
      if (cells[i]) continue;
      let m = 511;
      for (const j of PEERS[i]) if (cells[j]) m &= ~(1 << (cells[j] - 1));
      cand[i] = m;
    }
    for (let i = 0; i < 81; i++) if (!cells[i] && pop(cand[i]) === 1) { cells[i] = Math.log2(cand[i]) + 1; progress = true; break; }
    if (!progress) {
      outer: for (const u of UNITS) for (let d = 0; d < 9; d++) {
        let only = -1, n = 0;
        for (const i of u) { if (cells[i] === d + 1) { n = 99; break; } if (!cells[i] && (cand[i] >> d) & 1) { n++; only = i; } }
        if (n === 1) { cells[only] = d + 1; progress = true; break outer; }
      }
    }
    if (!progress) break;
  }
  return cells.every(Boolean);
}
function makePuzzle(levelKey) {
  const L = CONFIG.LEVELS[levelKey];
  let sol, puz;
  for (let attempt = 0; attempt < (L.advanced ? CONFIG.MAX_TRIES_ADVANCED : 1); attempt++) {
    sol = randomFullGrid(); puz = sol.slice();
    let clues = 81;
    for (const i of shuffled([...Array(81).keys()])) {
      if (clues <= L.clues) break;
      const v = puz[i]; puz[i] = 0;
      if (countSolutions(puz) !== 1 || (L.singles && !solvableBySingles(puz))) puz[i] = v; else clues--;
    }
    if (!L.advanced || !solvableBySingles(puz)) break;
  }
  return { puzzle: puz, solution: sol };
}

/* ---------- サウンド ---------- */
const Sound = {
  ctx: null, master: null, sfx: null, bgmGain: null, revSend: null, primed: false,
  muted: lsGet('numplace.mute') === '1',
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = this.ctx = new AC();
        this.master = c.createGain(); this.master.gain.value = 1;
        const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.2;
        this.master.connect(comp); comp.connect(c.destination);
        this.sfx = c.createGain(); this.sfx.gain.value = CONFIG.SOUND.SFX_VOLUME; this.sfx.connect(this.master);
        this.bgmGain = c.createGain(); this.bgmGain.gain.value = this.bgmOn ? this.bgmLevel() : 0; this.bgmGain.connect(this.master);
        const len = Math.floor(c.sampleRate * 1.2), ir = c.createBuffer(2, len, c.sampleRate);
        for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / len, 2.6); }
        const conv = c.createConvolver(); conv.buffer = ir; this.revSend = c.createGain();
        const wet = c.createGain(); wet.gain.value = 0.3; this.revSend.connect(conv); conv.connect(wet); wet.connect(this.sfx);
      }
      if (this.ctx.state !== 'running') this.ctx.resume();
      if (!this.primed) { const b = this.ctx.createBuffer(1, 1, 22050), s = this.ctx.createBufferSource(); s.buffer = b; s.connect(this.ctx.destination); s.start(0); this.primed = true; }
    } catch (e) { /* ignore */ }
  },
  ready() { return !(this.muted || !this.ctx || this.ctx.state !== 'running'); },
  tone(freq, dur, type = 'sine', vol = 0.2, slideTo = 0, delay = 0) {
    if (!this.ready()) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + dur + 0.02);
  },
  bell(freq, delay, vol, dur) {
    if (!this.ready()) return;
    const c = this.ctx, t = c.currentTime + delay, car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
    car.frequency.value = freq; mod.frequency.value = freq * 3.5;
    mg.gain.setValueAtTime(freq * 1.5, t); mg.gain.exponentialRampToValueAtTime(1, t + dur * 0.6); mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(this.sfx); g.connect(this.revSend); car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  },
  noise() {
    if (!this._noise) { const len = this.ctx.sampleRate, b = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this._noise = b; }
    return this._noise;
  },
  burstNoise(delay, dur, freq, q, vol) {
    const c = this.ctx, t = c.currentTime + delay, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random() * 0.5, dur + 0.02);
  },
  select() { this.tone(900, 0.04, 'sine', 0.12); },
  place() { this.bell(1047, 0, 0.14, 0.35); },
  note() { this.tone(1400, 0.03, 'triangle', 0.1); },
  erase() { this.tone(500, 0.07, 'triangle', 0.14, 300); },
  wrong() { this.tone(220, 0.22, 'sawtooth', 0.12, 150); },
  unit() { [0, 4, 7, 12].forEach((s, i) => this.bell(784 * Math.pow(2, s / 12), i * 0.06, 0.13, 0.5)); },
  hintSnd() { this.bell(1319, 0, 0.14, 0.4); this.bell(1760, 0.08, 0.12, 0.5); },
  win() {
    if (!this.ready()) return;
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => this.bell(523 * Math.pow(2, s / 12), i * 0.09, 0.2, 0.7));
    this.burstNoise(0.2, 0.12, 3000, 0.6, 0.5);
    for (let i = 0; i < 55; i++) this.burstNoise(0.3 + Math.random() * 1.2, 0.035 + Math.random() * 0.03, 2500 + Math.random() * 3500, 0.7, 0.2 + Math.random() * 0.14);
  },
  // BGM: ローファイ風のゆったりした曲。title = パッド+メロディ / play = ベース・コード・ハットを足す
  bgmOn: false, bgmTimer: null, bgmNext: 0, bgmStep: 0, bgmScene: 'title', mel: 3,
  bgmLevel() { return this.muted ? 0 : CONFIG.SOUND.BGM_VOLUME; },
  bgmFade(to, sec) { if (!this.ctx || !this.bgmGain) return; const g = this.bgmGain.gain, t = this.ctx.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(to, t + sec); },
  bgmNote(freq, t, dur, type, vol) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bgmGain); o.start(t); o.stop(t + dur + 0.05);
  },
  epiano(freq, t, dur, vol) {       // やわらかいエレピ風（FM合成）
    const c = this.ctx, car = c.createOscillator(), mod = c.createOscillator(), mg = c.createGain(), g = c.createGain();
    car.frequency.value = freq; mod.frequency.value = freq * 2;
    mg.gain.setValueAtTime(freq * 0.9, t); mg.gain.exponentialRampToValueAtTime(freq * 0.05, t + dur * 0.7); mod.connect(mg); mg.connect(car.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(this.bgmGain); car.start(t); mod.start(t); car.stop(t + dur + 0.05); mod.stop(t + dur + 0.05);
  },
  bgmHat(t, vol) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise(); f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05); s.connect(f); f.connect(g); g.connect(this.bgmGain); s.start(t, Math.random() * 0.5, 0.06);
  },
  bgmStart(scene) {
    if (scene) this.bgmScene = scene;
    if (this.bgmOn || !CONFIG.SOUND.BGM_VOLUME) return;
    this.bgmOn = true; this.bgmNext = 0; this.bgmStep = 0; this.bgmFade(this.bgmLevel(), 0.8); this.bgmTimer = setInterval(() => this.bgmTick(), 100);
  },
  bgmStop() { if (!this.bgmOn) return; this.bgmOn = false; clearInterval(this.bgmTimer); this.bgmTimer = null; this.bgmFade(0, 0.3); },
  bgmTick() {
    if (!this.ctx || this.ctx.state !== 'running') { this.bgmNext = 0; return; }
    const now = this.ctx.currentTime;
    if (!this.bgmNext || this.bgmNext < now) this.bgmNext = now + 0.1;
    const e = 60 / CONFIG.SOUND.BGM_BPM / 2, play = this.bgmScene === 'play';
    const CH = [[3, 7, 10, 14], [0, 3, 7, 10], [-4, 0, 3, 7], [-2, 2, 5, 8]];      // Cmaj7 - Am7 - Fmaj7 - G7（Aからの半音数）
    const PENTA = [3, 5, 7, 10, 12, 15, 17, 19], hz = n => 220 * Math.pow(2, n / 12);
    while (this.bgmNext < now + 0.4) {
      const bar = Math.floor(this.bgmStep / 8) % 4, k = this.bgmStep % 8, ch = CH[bar], t = this.bgmNext + (k % 2 ? e * 0.12 : 0);   // 少しはねる
      if (k === 0) for (const n of ch.slice(0, 3)) this.bgmNote(hz(n + 12), t, e * 8.5, 'sine', 0.05);                      // パッド
      if (Math.random() < (play ? 0.3 : 0.4)) {                                                                              // ときどき入るメロディ
        this.mel = Math.max(0, Math.min(7, this.mel + Math.floor(Math.random() * 5) - 2));
        this.epiano(hz(PENTA[this.mel] + 12), t, e * 3, play ? 0.1 : 0.12);
      }
      if (play) {
        if (k === 0 || k === 3) for (const n of ch) this.epiano(hz(n), t, k === 0 ? e * 2.6 : e * 1.5, 0.05);               // コード
        if (k === 0 || k === 4) { this.bgmNote(hz(ch[0] - 12), t, e * 2.2, 'sine', 0.2); this.bgmNote(hz(ch[0]), t, e * 2.2, 'triangle', 0.06); }   // ベース
        if (k % 2 === 1) this.bgmHat(t, 0.04);
      }
      this.bgmNext += e; this.bgmStep++;
    }
  },
  setMuted(m) { this.muted = m; lsSet('numplace.mute', m ? '1' : '0'); $('btnSound').classList.toggle('off', m); if (this.bgmOn) this.bgmFade(this.bgmLevel(), 0.2); },
};

/* ---------- ゲーム状態 ---------- */
const settings = Object.assign({ level: 'normal', checkNow: true, autoNotes: true }, (() => { try { return JSON.parse(lsGet(SET_KEY)) || {}; } catch (e) { return {}; } })());
if (!CONFIG.LEVELS[settings.level]) settings.level = 'normal';
const saveSettings = () => lsSet(SET_KEY, JSON.stringify(settings));

const S = { level: 'normal', puzzle: [], solution: [], entries: [], hintCells: [], notes: [], sel: -1, noteMode: false, mistakes: 0, hints: 0, time: 0, undo: [], over: false };
let screen = 'title', timerId = null, rendering = false;

function bestTimes() { try { return JSON.parse(lsGet(BEST_KEY)) || {}; } catch (e) { return {}; } }
const fmt = sec => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
const given = i => S.puzzle[i] !== 0;
const valueAt = i => S.puzzle[i] || S.entries[i];

function newGame(level) {
  S.level = level;
  const g = makePuzzle(level);
  S.puzzle = g.puzzle; S.solution = g.solution;
  S.entries = new Array(81).fill(0); S.hintCells = new Array(81).fill(false); S.notes = new Array(81).fill(0);
  S.sel = -1; S.noteMode = false; S.mistakes = 0; S.hints = 0; S.time = 0; S.undo = []; S.over = false;
  saveGame(); renderAll();
}
function saveGame() {
  if (S.over) { lsDel(SAVE_KEY); return; }
  lsSet(SAVE_KEY, JSON.stringify({ v: 1, level: S.level, puzzle: S.puzzle, solution: S.solution, entries: S.entries, hintCells: S.hintCells, notes: S.notes, mistakes: S.mistakes, hints: S.hints, time: S.time }));
}
function loadGame() {
  try {
    const d = JSON.parse(lsGet(SAVE_KEY));
    if (!d || d.v !== 1 || d.puzzle.length !== 81 || d.solution.length !== 81) return false;
    Object.assign(S, { level: CONFIG.LEVELS[d.level] ? d.level : 'normal', puzzle: d.puzzle, solution: d.solution, entries: d.entries, hintCells: d.hintCells, notes: d.notes,
      mistakes: d.mistakes | 0, hints: d.hints | 0, time: d.time | 0, sel: -1, noteMode: false, undo: [], over: false });
    return true;
  } catch (e) { return false; }
}

/* ---------- 描画 ---------- */
const boardEl = $('board'), cellEls = [];
for (let i = 0; i < 81; i++) {
  const d = document.createElement('div');
  d.className = 'cell' + (COL(i) % 3 === 2 && COL(i) !== 8 ? ' bR' : '') + (ROW(i) % 3 === 2 && ROW(i) !== 8 ? ' bB' : '');
  d.dataset.i = i; boardEl.appendChild(d); cellEls.push(d);
}
const padEl = $('pad');
for (let n = 1; n <= 9; n++) { const b = document.createElement('button'); b.className = 'num'; b.dataset.n = n; b.innerHTML = `${n}<small></small>`; padEl.appendChild(b); }

function conflicts() {      // 同じ行・列・ブロックに同じ数字があるマス
  const bad = new Set();
  for (const u of UNITS) {
    const seen = {};
    for (const i of u) { const v = valueAt(i); if (!v) continue; (seen[v] = seen[v] || []).push(i); }
    for (const v in seen) if (seen[v].length > 1) seen[v].forEach(i => bad.add(i));
  }
  return bad;
}
function renderAll() {
  $('chipLevel').textContent = CONFIG.LEVELS[S.level].label;
  $('mistakes').textContent = S.mistakes; $('timer').textContent = fmt(S.time);
  const selV = S.sel >= 0 ? valueAt(S.sel) : 0, bad = settings.checkNow ? conflicts() : new Set();
  const counts = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) { const v = valueAt(i); if (v) counts[v]++; }
  for (let i = 0; i < 81; i++) {
    const el = cellEls[i], v = valueAt(i);
    let cls = 'cell' + (COL(i) % 3 === 2 && COL(i) !== 8 ? ' bR' : '') + (ROW(i) % 3 === 2 && ROW(i) !== 8 ? ' bB' : '');
    if (i === S.sel) cls += ' sel';
    else if (S.sel >= 0 && v && v === selV) cls += ' same';
    else if (S.sel >= 0 && PEERS[S.sel].includes(i)) cls += ' peer';
    if (given(i)) cls += ' given'; else if (v) {
      cls += S.hintCells[i] ? ' hint' : ' user';
      if (settings.checkNow && v !== S.solution[i]) cls += ' wrong'; else if (bad.has(i)) cls += ' conflict';
    }
    el.className = cls;
    if (v) el.textContent = v;
    else if (S.notes[i]) {
      let h = '<div class="notes">';
      for (let d = 1; d <= 9; d++) h += `<span${selV === d ? ' class="hl"' : ''}>${S.notes[i] & (1 << (d - 1)) ? d : ''}</span>`;
      el.innerHTML = h + '</div>';
    } else el.textContent = '';
  }
  padEl.querySelectorAll('.num').forEach(b => {
    const n = +b.dataset.n; b.classList.toggle('done', counts[n] >= 9); b.classList.toggle('noteMode', S.noteMode);
    b.querySelector('small').textContent = counts[n] >= 9 ? '' : `あと${9 - counts[n]}`;
  });
  $('btnNote').classList.toggle('on', S.noteMode); $('noteState').textContent = S.noteMode ? 'ON' : 'OFF';
  $('hintState').textContent = `${S.hints}回`; $('btnUndo').disabled = !S.undo.length;
}

/* ---------- 操作 ---------- */
function pushUndo(i) { S.undo.push({ i, v: S.entries[i], n: S.notes[i], h: S.hintCells[i], m: S.mistakes }); if (S.undo.length > 200) S.undo.shift(); }
function selectCell(i) { S.sel = i; Sound.select(); renderAll(); }
function checkUnits(i) {      // 行・列・ブロックが完成したか
  const done = u => u.every(j => valueAt(j) === S.solution[j]);
  return [UNITS[ROW(i) * 3], UNITS[COL(i) * 3 + 1], UNITS[BOX(i) * 3 + 2]].some(done);
}
function inputNumber(n) {
  const i = S.sel;
  if (S.over || i < 0 || given(i)) return;
  if (S.noteMode) {
    if (S.entries[i]) return;
    pushUndo(i); S.notes[i] ^= (1 << (n - 1)); Sound.note();
  } else {
    pushUndo(i);
    if (S.entries[i] === n) { S.entries[i] = 0; S.hintCells[i] = false; Sound.erase(); }
    else {
      S.entries[i] = n; S.hintCells[i] = false; S.notes[i] = 0;
      if (n !== S.solution[i]) { S.mistakes++; Sound.wrong(); vibrate(40); }
      else {
        if (settings.autoNotes) for (const j of PEERS[i]) S.notes[j] &= ~(1 << (n - 1));
        if (checkUnits(i)) Sound.unit(); else Sound.place();
      }
    }
  }
  afterChange();
}
function afterChange() { renderAll(); saveGame(); if (isSolved()) win(); }
function isSolved() { for (let i = 0; i < 81; i++) if (valueAt(i) !== S.solution[i]) return false; return true; }
$('board').addEventListener('pointerdown', e => { const c = e.target.closest('.cell'); if (c && screen === 'play') { selectCell(+c.dataset.i); e.preventDefault(); } });
$('pad').addEventListener('pointerdown', e => { const b = e.target.closest('.num'); if (b && screen === 'play') { Sound.unlock(); inputNumber(+b.dataset.n); e.preventDefault(); } });
$('btnNote').addEventListener('click', () => { S.noteMode = !S.noteMode; Sound.select(); renderAll(); });
$('btnErase').addEventListener('click', () => {
  const i = S.sel; if (S.over || i < 0 || given(i) || (!S.entries[i] && !S.notes[i])) return;
  pushUndo(i); S.entries[i] = 0; S.notes[i] = 0; S.hintCells[i] = false; Sound.erase(); afterChange();
});
$('btnUndo').addEventListener('click', () => {
  const u = S.undo.pop(); if (!u || S.over) return;
  S.entries[u.i] = u.v; S.notes[u.i] = u.n; S.hintCells[u.i] = u.h; S.mistakes = u.m; S.sel = u.i; Sound.erase(); afterChange();
});
$('btnHint').addEventListener('click', () => {
  if (S.over) return;
  let i = S.sel;
  if (i < 0 || given(i) || S.entries[i] === S.solution[i]) {      // 選んでいないときは、まちがい→空きマスの順に探す
    i = -1;
    for (let j = 0; j < 81; j++) if (!given(j) && S.entries[j] && S.entries[j] !== S.solution[j]) { i = j; break; }
    if (i < 0) for (let j = 0; j < 81; j++) if (!valueAt(j)) { i = j; break; }
    if (i < 0) return;
  }
  pushUndo(i); S.entries[i] = S.solution[i]; S.hintCells[i] = true; S.notes[i] = 0; S.sel = i; S.hints++;
  if (settings.autoNotes) for (const j of PEERS[i]) S.notes[j] &= ~(1 << (S.solution[i] - 1));
  Sound.hintSnd(); afterChange();
});

/* ---------- 進行・画面 ---------- */
function tick() { if (screen === 'play' && !S.over && !document.hidden) { S.time++; $('timer').textContent = fmt(S.time); if (S.time % 10 === 0) saveGame(); } }
timerId = setInterval(tick, 1000);
const screens = { title: $('scTitle'), pause: $('scPause'), win: $('scWin') };
function showScreen(name) {
  screen = name;
  for (const k in screens) screens[k].classList.toggle('hidden', k !== name);
  $('app').style.visibility = name === 'pause' ? 'hidden' : 'visible';
  syncBgm();
}
function syncBgm() {        // 画面に合わせてBGMを切り替える（タイトル=静かな版 / プレイ中=ベースとリズム入り / それ以外=止める）
  if (screen === 'title') Sound.bgmStart('title'); else if (screen === 'play') Sound.bgmStart('play'); else Sound.bgmStop();
  if (Sound.bgmOn) Sound.bgmScene = screen === 'play' ? 'play' : 'title';
}
function win() {
  S.over = true; lsDel(SAVE_KEY);
  const best = bestTimes(), key = S.level, prev = best[key];
  const record = !prev || S.time < prev; if (record) { best[key] = S.time; lsSet(BEST_KEY, JSON.stringify(best)); }
  Sound.bgmStop(); Sound.win(); vibrate([30, 40, 30, 40, 80]);
  cellEls.forEach((el, i) => { el.style.animationDelay = (Math.hypot(ROW(i) - 4, COL(i) - 4) * 70) + 'ms'; el.classList.add('wave'); });
  $('winTime').textContent = fmt(S.time);
  $('winSum').innerHTML = `${CONFIG.LEVELS[S.level].label}　ミス ${S.mistakes}回　ヒント ${S.hints}回<br>${record ? '★ ベスト記録！ ★' : `ベスト ${fmt(prev)}`}`;
  setTimeout(() => { cellEls.forEach(el => { el.classList.remove('wave'); el.style.animationDelay = ''; }); showScreen('win'); }, 1600);
}
function openTitle() {
  document.querySelectorAll('#levels button').forEach(b => b.classList.toggle('on', b.dataset.v === settings.level));
  $('tgCheck').classList.toggle('on', settings.checkNow); $('tgAuto').classList.toggle('on', settings.autoNotes);
  const best = bestTimes()[settings.level];
  $('titleBest').textContent = best ? `${CONFIG.LEVELS[settings.level].label}のベスト ${fmt(best)}` : '';
  $('btnContinue').hidden = !(() => { try { return JSON.parse(lsGet(SAVE_KEY)).v === 1; } catch (e) { return false; } })();
  showScreen('title');
}
let busy = false;
function startNew(level) {
  if (busy) return; busy = true;
  document.body.style.cursor = 'progress';
  setTimeout(() => { newGame(level); busy = false; document.body.style.cursor = ''; showScreen('play'); }, 30);   // 問題づくりの間に画面を更新させる
}
document.querySelectorAll('#levels button').forEach(b => b.addEventListener('click', () => { settings.level = b.dataset.v; saveSettings(); openTitle(); }));
$('tgCheck').addEventListener('click', () => { settings.checkNow = !settings.checkNow; saveSettings(); openTitle(); });
$('tgAuto').addEventListener('click', () => { settings.autoNotes = !settings.autoNotes; saveSettings(); openTitle(); });
$('btnStart').addEventListener('click', () => { Sound.unlock(); startNew(settings.level); });
$('btnContinue').addEventListener('click', () => { Sound.unlock(); if (loadGame()) { renderAll(); showScreen('play'); } else startNew(settings.level); });
$('btnPause').addEventListener('click', () => { if (screen === 'play') { saveGame(); showScreen('pause'); } });
$('btnResume').addEventListener('click', () => showScreen('play'));
$('btnNew').addEventListener('click', () => startNew(S.level));
$('btnToTitle').addEventListener('click', () => { saveGame(); openTitle(); });
$('btnAgain').addEventListener('click', () => startNew(S.level));
$('btnWinTitle').addEventListener('click', openTitle);
$('btnSound').addEventListener('click', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); });

document.addEventListener('touchmove', e => { if (!e.target.closest('.screen')) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend', 'contextmenu', 'dragstart', 'selectstart'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click'].forEach(t => document.addEventListener(t, () => { Sound.unlock(); if (!Sound.bgmOn && (screen === 'title' || screen === 'play')) syncBgm(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'play') { saveGame(); showScreen('pause'); } else if (!document.hidden) Sound.unlock(); });
window.addEventListener('pagehide', () => { if (!S.over && screen !== 'title') saveGame(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
Sound.setMuted(Sound.muted);
renderAll();
openTitle();
if (location.search.includes('debug')) window.__n = { S, CONFIG, makePuzzle, countSolutions, solvableBySingles, newGame, inputNumber, selectCell, renderAll, isSolved };
</script>
</body>
</html>
